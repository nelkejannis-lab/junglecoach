# Baut Moosi-Setup.exe (Windows) und veröffentlicht sie als GitHub-Release.
# Läuft automatisch bei jedem Tag "v*" (z. B. v0.7.0) oder manuell über Actions -> Run workflow.
name: Build installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v1.4.1) – leer = nur bauen"
        required: false
        default: ""
  push:
    branches: ["codex/fix-coach-leaderboard", "release/v1.15.1"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout benchmark exporter for integration tests
        uses: actions/checkout@v4
        with:
          repository: nelkejannis-lab/junglecoach-data
          path: benchmark-source
          ref: cc31e54fb4c965d79632cf66ee4c5a40aef0c8a9
      - name: Place benchmark source beside app
        shell: pwsh
        run: Copy-Item -LiteralPath benchmark-source -Destination ../junglecoach-data -Recurse
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Check ffmpeg GPU capture support
        run: python -c "import imageio_ffmpeg,subprocess;e=imageio_ffmpeg.get_ffmpeg_exe();f=subprocess.run([e,'-hide_banner','-filters'],capture_output=True,text=True).stdout;c=subprocess.run([e,'-hide_banner','-encoders'],capture_output=True,text=True).stdout;print('FFMPEG', subprocess.run([e,'-version'],capture_output=True,text=True).stdout.splitlines()[0]);print('DDAGRAB', 'ddagrab' in f, 'NVENC', 'h264_nvenc' in c, 'AMF', 'h264_amf' in c, 'QSV', 'h264_qsv' in c)"
      - run: python -m unittest discover tests
      - run: node --test server/test/*.test.js
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Moosi --icon assets\icon.ico
          --add-data "jc\static;jc\static" --add-data "config.json;."
          --collect-all webview --collect-all imageio_ffmpeg --collect-all pyaudiowpatch --collect-submodules jc run_app.py
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\JungleCoach.iss
      - uses: actions/upload-artifact@v4
        with: { name: Moosi-Setup, path: dist/Moosi-Setup.exe }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != '' || github.ref == 'refs/heads/release/v1.15.1'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Moosi-Setup.exe
          tag_name: ${{ inputs.tag || (github.ref == 'refs/heads/release/v1.15.1' && 'v1.15.1') || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Moosi ${{ inputs.tag || (github.ref == 'refs/heads/release/v1.15.1' && 'v1.15.1') || github.ref_name }}
          body: "Installer herunterladen, ausführen, fertig. SmartScreen-Warnung: Weitere Informationen → Trotzdem ausführen."

