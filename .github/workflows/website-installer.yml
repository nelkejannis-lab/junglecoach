name: Build website integration installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/website-installer.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover tests
      - name: Prepare distributable settings
        run: |
          python -c "import json; p='config.json'; c=json.load(open(p,encoding='utf-8')); c['riot_api_key']=''; c.pop('auth_token',None); json.dump(c,open(p,'w',encoding='utf-8'),indent=2)"
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed --name JungleCoach --icon assets\icon.ico
          --add-data "jc\static;jc\static" --add-data "config.json;."
          --collect-all webview --collect-all imageio_ffmpeg run_app.py
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\JungleCoach.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JungleCoach-Website-Setup
          path: dist/JungleCoach-Setup.exe
