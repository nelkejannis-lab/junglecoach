name: Website meta tests
on:
  push:
    paths: ['jc/**', 'tests/test_website_meta.py', '.github/workflows/website-meta-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_website_meta.py
      - run: python -m compileall -q jc
