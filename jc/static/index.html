<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Coach</title>
<style>
  :root {
    --bg:#07090f; --bg2:#0b0f1a; --card:rgba(20,26,40,.72); --card2:rgba(255,255,255,.055); --card3:rgba(255,255,255,.09);
    --txt:#eef2ff; --sec:#8b93a7; --sep:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
    --acc:#22d3ee; --acc2:#a78bfa; --grad:linear-gradient(135deg,#22d3ee 0%,#818cf8 55%,#c084fc 100%);
    --green:#34d399; --orange:#fbbf24; --red:#fb7185; --purple:#c084fc; --gold:#f5c451;
    --shadow:0 10px 40px rgba(0,0,0,.45); --r:20px; --blur:rgba(7,9,15,.7);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--txt);
    font:14.5px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1, "cv11" 1; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(900px 600px at 85% -10%, rgba(129,140,248,.16), transparent 60%),
               radial-gradient(800px 600px at -10% 110%, rgba(34,211,238,.12), transparent 60%),
               radial-gradient(600px 400px at 50% 50%, rgba(192,132,252,.05), transparent 70%); }
  ::selection { background:rgba(34,211,238,.3); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }

  /* ---------- shell: sidebar + content */
  .shell { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  aside { position:sticky; top:0; height:100vh; padding:22px 14px; border-right:1px solid var(--sep);
    background:linear-gradient(180deg,rgba(11,15,26,.92),rgba(7,9,15,.92)); backdrop-filter:blur(20px); display:flex; flex-direction:column; gap:18px; }
  .logo { display:flex; align-items:center; gap:10px; padding:0 8px; font-weight:800; font-size:17px; letter-spacing:-.3px; }
  .logo i { width:32px; height:32px; border-radius:10px; background:var(--grad); display:grid; place-items:center; font-style:normal; font-size:17px;
    box-shadow:0 6px 24px rgba(34,211,238,.35); }
  .logo small { display:block; font-size:11px; color:var(--sec); font-weight:500; letter-spacing:0; }
  nav#nav { display:flex; flex-direction:column; gap:3px; }
  nav#nav button { display:flex; align-items:center; gap:11px; border:0; background:none; color:var(--sec); font:inherit; font-weight:600; font-size:14px;
    padding:10px 12px; border-radius:12px; cursor:pointer; text-align:left; transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); position:relative; }
  nav#nav button span.ic { width:22px; text-align:center; font-size:16px; filter:grayscale(.3); }
  nav#nav button:hover { background:var(--card2); color:var(--txt); }
  nav#nav button.act { background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(129,140,248,.06)); color:var(--txt); }
  nav#nav button.act::before { content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--grad); }
  nav#nav button .pill { margin-left:auto; font-size:10px; padding:1px 7px; border-radius:99px; background:var(--grad); color:#071018; font-weight:800; }
  .side-status { margin-top:auto; padding:12px; border-radius:14px; background:var(--card2); border:1px solid var(--sep); font-size:12.5px; }
  .status { color:var(--sec); display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--sec); display:inline-block; box-shadow:0 0 0 3px rgba(255,255,255,.05); }
  .dot.on { background:var(--green); box-shadow:0 0 12px rgba(52,211,153,.7); } .dot.rec { background:var(--red); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  main { padding:34px 40px 80px; max-width:1320px; width:100%; }
  @media (max-width:900px) { .shell { grid-template-columns:1fr; } aside { position:sticky; height:auto; flex-direction:row; align-items:center; padding:10px 12px; z-index:20; overflow-x:auto; }
    nav#nav { flex-direction:row; } nav#nav button { padding:8px 10px; } nav#nav button .lbl, .side-status, .logo small { display:none; } main { padding:20px 16px 60px; } }

  /* ---------- typography */
  .title { font-size:34px; font-weight:800; letter-spacing:-.8px; margin:0; line-height:1.15; }
  .title .g, .g { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:var(--sec); margin:6px 0 26px; max-width:760px; font-size:15px; }
  .muted { color:var(--sec); } .small { font-size:12.5px; }
  .green { color:var(--green); } .red { color:var(--red); } .orange { color:var(--orange); } .acc { color:var(--acc); } .gold { color:var(--gold); }
  .big { font-size:28px; font-weight:800; letter-spacing:-.5px; }
  .huge { font-size:44px; font-weight:800; letter-spacing:-1.2px; line-height:1.05; }
  a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }

  /* ---------- cards & grid */
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .card { position:relative; background:var(--card); border-radius:var(--r); padding:22px 24px; border:1px solid var(--line);
    box-shadow:var(--shadow); backdrop-filter:blur(18px); transition:transform .25s var(--ease), border-color .25s var(--ease); }
  .card:hover { border-color:rgba(255,255,255,.16); }
  .card.wide { grid-column:1/-1; }
  .card.glow::after { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; background:var(--grad); opacity:.55;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .card h3 { margin:0 0 3px; font-size:16.5px; font-weight:700; letter-spacing:-.2px; }
  .card .hint { color:var(--sec); font-size:12.5px; margin:0 0 16px; }
  .enter .card { animation:rise .45s var(--ease) both; }
  .enter .card:nth-child(2) { animation-delay:.04s } .enter .card:nth-child(3) { animation-delay:.08s } .enter .card:nth-child(4) { animation-delay:.12s }
  .enter .card:nth-child(5) { animation-delay:.16s } .enter .card:nth-child(n+6) { animation-delay:.2s }
  .enter .title, .enter .subtitle { animation:rise .4s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.995); } to { opacity:1; transform:none; } }

  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--sep); }
  .row:last-child { border-bottom:0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin-top:14px; }
  .stat { background:var(--card2); border:1px solid var(--sep); border-radius:14px; padding:12px 14px; transition:background .2s; }
  .stat:hover { background:var(--card3); }
  .stat b { display:block; font-size:21px; letter-spacing:-.4px; font-weight:800; } .stat span { font-size:12px; color:var(--sec); }
  .badge { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; padding:3px 8px;
    border-radius:99px; background:var(--card3); color:var(--sec); vertical-align:middle; }
  .badge.meta { background:rgba(34,211,238,.14); color:var(--acc); } .badge.gem { background:rgba(192,132,252,.16); color:var(--purple); }
  .badge.mu { background:rgba(251,191,36,.15); color:var(--orange); } .badge.team { background:rgba(52,211,153,.15); color:var(--green); }
  .tier { display:inline-grid; place-items:center; min-width:30px; height:30px; padding:0 8px; border-radius:9px; font-weight:900; font-size:14px; color:#071018; }
  .tier.S { background:linear-gradient(135deg,#fde68a,#f59e0b); } .tier.A { background:linear-gradient(135deg,#a5f3fc,#22d3ee); }
  .tier.B { background:linear-gradient(135deg,#bbf7d0,#34d399); } .tier.C { background:#94a3b8; } .tier.D { background:#64748b; }
  .item { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--sep); }
  .item:last-child { border:0; } .item .n { font-weight:700; } .item .w { color:var(--sec); font-size:12.5px; margin-top:1px; }
  .num { width:26px; height:26px; flex:none; border-radius:9px; background:var(--card3); display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--txt); }
  .btn { white-space:nowrap; border:0; background:var(--grad); color:#061018; font:inherit; font-weight:800; font-size:13.5px; padding:10px 18px; border-radius:12px; cursor:pointer;
    box-shadow:0 8px 24px rgba(34,211,238,.22); transition:transform .15s var(--ease), box-shadow .2s, filter .2s; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.08); } .btn:active { transform:translateY(0) scale(.98); }
  .btn.sec { background:var(--card3); color:var(--txt); box-shadow:none; border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; transform:none; }
  .meter { height:7px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:7px; }
  .meter i { display:block; height:100%; border-radius:99px; transition:width .7s var(--ease); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:99px; background:var(--card3); border:1px solid var(--sep); cursor:default; transition:background .2s, border-color .2s; }
  .chip.on, button.chip.on { background:rgba(34,211,238,.16); border-color:rgba(34,211,238,.45); color:var(--acc); }
  button.chip { color:var(--txt); font-family:inherit; cursor:pointer; } button.chip:hover { border-color:var(--line); background:var(--card2); }
  .empty { text-align:center; padding:40px 20px; color:var(--sec); }
  .empty .ico { font-size:38px; margin-bottom:10px; filter:drop-shadow(0 6px 18px rgba(34,211,238,.35)); }
  .empty b { color:var(--txt); display:block; font-size:17px; margin-bottom:6px; }
  ul.clean { list-style:none; padding:0; margin:0; }
  ul.clean li { padding:8px 0; border-bottom:1px solid var(--sep); } ul.clean li:last-child { border:0; }
  .click { cursor:pointer; transition:opacity .15s, background .15s; } .click:hover { opacity:.85; }
  .sel { color:var(--acc); font-weight:700; }
  .two { display:grid; grid-template-columns:minmax(260px,360px) 1fr; gap:24px; align-items:start; }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } .title { font-size:27px; } }
  label.f { display:block; margin:14px 0 5px; font-weight:700; font-size:13px; color:var(--sec); }
  input, select { font:inherit; color:var(--txt); }
  input.f, select.f, .card input:not([type=checkbox]):not([type=range]), .card select { width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
    background:rgba(0,0,0,.25); color:var(--txt); outline:none; transition:border-color .2s, box-shadow .2s; }
  input:focus, select:focus { border-color:rgba(34,211,238,.6) !important; box-shadow:0 0 0 4px rgba(34,211,238,.12); }
  select option { background:#0b0f1a; }
  .switch { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--sep); }
  .switch input { width:46px; height:26px; appearance:none; background:var(--card3); border-radius:99px; position:relative; cursor:pointer; transition:.25s var(--ease); border:1px solid var(--line); }
  .switch input:checked { background:var(--green); }
  .switch input::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.25s var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked::after { left:22px; }
  .err { background:rgba(251,113,133,.12); color:var(--red); border:1px solid rgba(251,113,133,.3); border-radius:14px; padding:11px 15px; margin-bottom:18px; display:none; }
  video { width:100%; max-width:820px; border-radius:14px; background:#000; display:block; }
  details summary { cursor:pointer; color:var(--sec); font-weight:600; }
  img { image-rendering:auto; }

  /* ---------- coach & meta components */
  .hero { display:grid; grid-template-columns:auto 1fr auto; gap:26px; align-items:center; }
  @media (max-width:760px) { .hero { grid-template-columns:1fr; } }
  .ring { position:relative; width:128px; height:128px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { transition:stroke-dashoffset 1s var(--ease); }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:34px; font-weight:900; letter-spacing:-1px; }
  .ring span { position:absolute; bottom:22px; left:0; right:0; text-align:center; font-size:10.5px; color:var(--sec); font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .focus { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .fcard { position:relative; border-radius:18px; padding:18px 18px 16px; background:linear-gradient(160deg,rgba(34,211,238,.10),rgba(129,140,248,.05) 50%,rgba(255,255,255,.02)); border:1px solid rgba(34,211,238,.22); }
  .fcard .k { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); }
  .fcard h4 { margin:4px 0 8px; font-size:19px; letter-spacing:-.3px; }
  .fcard .drill { background:rgba(0,0,0,.25); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:13px; border:1px solid var(--sep); }
  .pbar { display:grid; grid-template-columns:1fr auto; gap:5px 10px; padding:7px 0; align-items:center; }
  .pbar .lab { font-size:13px; font-weight:600; } .pbar .track { grid-column:1/-1; height:8px; border-radius:99px; background:rgba(255,255,255,.06); position:relative; overflow:hidden; }
  .pbar .track i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .8s var(--ease); }
  .pbar .track::after { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:rgba(255,255,255,.25); }
  .pbar .val { text-align:right; font-size:12.5px; white-space:nowrap; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:110px; padding-top:6px; }
  .bars i { flex:1; border-radius:6px 6px 2px 2px; min-height:4px; transition:height .7s var(--ease); opacity:.9; }
  .bars i:hover { opacity:1; filter:brightness(1.2); }
  .tl { width:100%; border-collapse:collapse; }
  .tl th { text-align:left; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--sec); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--sep); }
  .tl td { padding:9px 10px; border-bottom:1px solid var(--sep); vertical-align:middle; }
  .tl tr.click:hover td { background:rgba(255,255,255,.035); }
  .champ { display:flex; align-items:center; gap:10px; font-weight:700; }
  .runes { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .rtree h5 { margin:0 0 8px; display:flex; align-items:center; gap:8px; font-size:14px; }
  .rrow { display:flex; gap:10px; justify-content:center; padding:7px 0; border-bottom:1px dashed var(--sep); }
  .rrow:last-child { border:0; }
  .rune { border-radius:50%; transition:filter .2s, opacity .2s, transform .2s; }
  .rune.off { filter:grayscale(1) brightness(.6); opacity:.45; }
  .rune.on { box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(245,196,81,.45); transform:scale(1.06); }
  .build { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .build .arr { color:var(--sec); font-size:18px; }
  .ibox { position:relative; text-align:center; width:68px; }
  .ibox small { display:block; font-size:10.5px; color:var(--sec); margin-top:3px; line-height:1.2; }
  .skills { display:flex; gap:8px; align-items:center; }
  .skey { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:900; background:var(--card3); border:1px solid var(--line); }
  .skey.q { color:var(--acc); } .skey.w { color:var(--green); } .skey.e { color:var(--purple); }
  .search { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .skel { background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)); background-size:200% 100%;
    animation:sh 1.2s linear infinite; border-radius:12px; min-height:16px; }
  @keyframes sh { to { background-position:-200% 0; } }
  .steps { counter-reset:s; display:grid; gap:10px; }
  .steps div { counter-increment:s; display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:14px; background:var(--card2); border:1px solid var(--sep); }
  .steps div::before { content:counter(s); width:26px; height:26px; flex:none; border-radius:9px; background:var(--grad); color:#061018; display:grid; place-items:center; font-weight:900; font-size:13px; }
  .duel { display:flex; align-items:center; gap:10px; }
  .duel .track { flex:1; height:12px; border-radius:99px; background:linear-gradient(90deg,var(--red),rgba(255,255,255,.12) 50%,var(--green)); position:relative; }
  .duel .track i { position:absolute; top:-5px; width:4px; height:22px; border-radius:3px; background:#fff; box-shadow:0 0 12px #fff; transition:left .8s var(--ease); }
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="logo"><i>🌿</i><div>Jungle Coach<small>Dein persönlicher Coach</small></div></div>
  <nav id="nav">
    <button data-v="coach"><span class="ic">🧠</span><span class="lbl">Coach</span><span class="pill">NEU</span></button>
    <button data-v="profile"><span class="ic">👤</span><span class="lbl">Profil</span></button>
    <button data-v="ranked"><span class="ic">🏆</span><span class="lbl">Ranked</span></button>
    <button data-v="select"><span class="ic">⚔️</span><span class="lbl">Champ Select</span></button>
    <button data-v="live"><span class="ic">🎮</span><span class="lbl">Live</span></button>
    <button data-v="analyse"><span class="ic">🔍</span><span class="lbl">Analyse</span></button>
    <button data-v="meta"><span class="ic">📊</span><span class="lbl">Meta & Builds</span></button>
    <button data-v="settings"><span class="ic">⚙️</span><span class="lbl">Einstellungen</span></button>
  </nav>
  <div class="side-status">
    <div class="status"><span id="sdot" class="dot"></span><span id="stxt">Verbinde…</span></div>
    <div class="status" id="rec" style="display:none;margin-top:6px"><span class="dot rec"></span>Aufnahme läuft</div>
  </div>
</aside>
<main><div id="err" class="err"></div><div id="main"></div></main>
</div>
<script src="/i18n_en.js"></script>

<script>
// ------------------------------------------------------------ state
let view = "profile", profData = null, profQuery = "", profQueue = "all", profLoading = false, profErr = "",
    histChamp = "", histRole = "", histResult = "", matchData = null, matchLoading = false, allTimer = null, state = {}, rankedData = null, metaData = null, cfgData = null, sessions = [];
let lastJson = "", lastPhase = "", selGame = 0, replayMin = 15, playTimer = null, selClip = null, msg = {};
let labForm = {champ: "", role: "", enemies: "", msg: ""}, labData = null, rankedAccount = "";
let onb = {role: "", mains: [], q: "", msg: ""}, champList = [];
let coachData = null, tierRole = "JUNGLE", tierData = {}, champPage = null, champLoading = "", tierQuery = "";
async function runLab() {
  labForm = {champ: $("#lab-champ").value.trim(), role: $("#lab-role").value, enemies: $("#lab-enemies").value, msg: "Rechne …"};
  labData = null; render();
  try {
    const q = new URLSearchParams({champ: labForm.champ, role: labForm.role, enemies: labForm.enemies.split(",").map(x => x.trim()).filter(Boolean).join(",")});
    const r = await fetch("/api/sim?" + q); const j = await r.json();
    if (j.error) { labForm.msg = j.error; } else { labData = j; labForm.msg = ""; }
  } catch (e) { labForm.msg = "Fehler: " + e; }
  render();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sign = v => v == null ? "–" : (v > 0 ? "+" : "") + v;
const col = v => v > 0 ? "green" : v < 0 ? "red" : "muted";
const gradeCol = g => g === "A" ? "green" : g === "B" ? "acc" : g === "C" ? "orange" : "red";
const scoreCol = s => s >= 65 ? "var(--green)" : s >= 50 ? "var(--orange)" : "var(--red)";
const card = (title, hint, body, wide) => `<div class="card${wide ? " wide" : ""}">${title ? `<h3>${esc(title)}</h3>` : ""}${hint ? `<p class="hint">${hint}</p>` : ""}${body}</div>`;
const empty = (ico, t, d) => `<div class="empty"><div class="ico">${ico}</div><b>${esc(t)}</b>${d}</div>`;
const list = (arr, f) => arr && arr.length ? `<ul class="clean">${arr.map((x, i) => f(x, i)).join("")}</ul>` : '<span class="muted small">Noch keine Daten.</span>';
const page = (title, sub, body) => `<h1 class="title">${esc(title)}</h1><p class="subtitle">${sub}</p><div class="grid">${body}</div>`;
const BADGE = {Meta: "meta", Geheimtipp: "gem", Matchup: "mu", "Team-Fit": "team", "Meta + Sim": "meta", Sim: "mu", Theorie: "team", gekauft: ""};
const badge = b => b ? `<span class="badge ${BADGE[b] || ""}">${esc(b)}</span>` : "";

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
function go(v) {
  view = v; document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("act", x.dataset.v === v));
  if (v === "settings") loadAccount();
  if (v === "profile" && !profData && !profLoading) loadProfile(); if (v === "ranked") loadRanked(); if (v === "meta") { loadMeta(); loadTier(); } if (v === "settings") loadCfg(); if (v === "analyse") loadSessions();
  if (v === "coach") loadCoach();

}

// ------------------------------------------------------------ map helpers (own schematic drawing)
const S = 15000, sx = x => x / S * 300, sy = y => 300 - y / S * 300;
const LANE_POS = {TOP: [2600, 12200], MIDDLE: [7400, 7400], BOTTOM: [12200, 2600], UTILITY: [11600, 3200]};
function mapSvg(layers) {
  return `<svg viewBox="0 0 300 300" style="width:100%;max-width:360px;display:block;background:#17301f;border-radius:14px">
    <path d="M18 282 L18 18 L282 18" stroke="#41544a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M18 282 L282 282 L282 18" stroke="#41544a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M18 282 L282 18" stroke="#41544a" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 40 L260 260" stroke="#1f5577" stroke-width="12" opacity=".8" stroke-linecap="round"/>
    <circle cx="22" cy="278" r="26" fill="#24467f"/><circle cx="278" cy="22" r="26" fill="#7a2532"/>${layers.join("")}</svg>`;
}
const trail = (pts, c) => pts.length > 1 ? `<polyline points="${pts.map(p => sx(p.x) + "," + sy(p.y)).join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="4 3" opacity=".85"/>` : "";
const dot = (x, y, c, label) => `<circle cx="${sx(x)}" cy="${sy(y)}" r="7" fill="${c}" stroke="#fff" stroke-width="1.5"/>` +
  (label ? `<text x="${sx(x) + 10}" y="${sy(y) + 4}" fill="#fff" font-size="11" font-weight="600" font-family="-apple-system,Segoe UI">${esc(label)}</text>` : "");
const cross = (x, y, c) => `<path d="M${sx(x)-5} ${sy(y)-5}L${sx(x)+5} ${sy(y)+5}M${sx(x)+5} ${sy(y)-5}L${sx(x)-5} ${sy(y)+5}" stroke="${c}" stroke-width="2.5"/>`;
function lineChart(vals, labels, opts = {}) {
  if (!vals || vals.length < 2) return '<span class="muted small">Noch zu wenige Datenpunkte – kommt nach ein paar Games.</span>';
  const W = 560, H = opts.h || 150, lo = Math.min(...vals, opts.zero ? -Math.max(...vals.map(Math.abs)) : Infinity), hi = Math.max(...vals, opts.zero ? Math.max(...vals.map(Math.abs)) : -Infinity);
  const span = hi - lo || 1, x = i => i / (vals.length - 1) * W, y = v => H - 6 - (v - lo) / span * (H - 12);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const base = opts.zero ? y(0) : H;
  return `<svg viewBox="0 0 ${W} ${H + 18}" style="width:100%">
    ${opts.zero ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--sep)"/>` : ""}
    <polygon points="0,${base} ${pts} ${W},${base}" fill="var(--acc)" opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>
    ${(labels || []).map(([i, t]) => `<text x="${x(i)}" y="${H + 15}" fill="var(--sec)" font-size="11" text-anchor="middle">${esc(t)}</text>`).join("")}
  </svg>`;
}

const DD = () => `https://ddragon.leagueoflegends.com/cdn/${profData && profData.version}`;
const img = (src, size, round) => `<img src="${src}" width="${size}" height="${size}" loading="lazy" style="border-radius:${round ? "50%" : "8px"};background:var(--card2);flex:none" onerror="this.style.visibility='hidden'">`;
const champImg = (c, s = 36) => img(`${DD()}/img/champion/${encodeURIComponent(c)}.png`, s);
const itemImg = i => i ? img(`${DD()}/img/item/${i}.png`, 24) : `<span style="width:24px;height:24px;border-radius:6px;background:var(--card2);display:inline-block"></span>`;
const ago = ts => { const d = (Date.now() / 1000 - ts) / 3600; return d < 1 ? "gerade eben" : d < 24 ? `vor ${Math.round(d)} Std.` : `vor ${Math.round(d / 24)} Tg.`; };
function rankBlock(label, r) {
  if (!r) return `<div class="stat"><span>${label}</span><b class="muted" style="font-size:17px">Unranked</b></div>`;
  return `<div class="stat"><span>${label}</span><b style="font-size:19px">${esc(cap(r.tier))} ${esc(r.division)} · ${r.lp} LP</b>
    <span>${r.wins}S ${r.losses}N · <span class="${r.winrate >= 50 ? "green" : "red"}">${r.winrate}%</span>${r.hot_streak ? " · 🔥 Serie" : ""}</span></div>`;
}

  if (matchData || matchLoading) h += matchModal();

async function loadProfile(extra) {
  profLoading = true; profErr = ""; if (view === "profile") render();
  if (!cfgData) await loadCfg();
  const q = new URLSearchParams(); if (profQuery) q.set("riot_id", profQuery); q.set("queue", profQueue || "all");
  if (extra) for (const [k, v] of Object.entries(extra)) q.set(k, v);
  try { const r = await getJson("/api/profile?" + q); if (r.error) profErr = r.error; else profData = r; } catch (e) { profErr = "App-Server nicht erreichbar"; }
  profLoading = false; if (view === "profile") render();
}
function setQueue(q) { profQueue = q; histChamp = histRole = histResult = ""; loadProfile(); }
async function moreGames() { await loadProfile({more: 1}); }
async function loadAllGames() {
  await loadProfile({all: 1});
  clearInterval(allTimer);
  allTimer = setInterval(async () => {
    await loadProfile();
    if (!(profData && profData.load_all && profData.load_all.running)) clearInterval(allTimer);
  }, 4000);
}
async function openMatch(id) {
  matchLoading = true; matchData = null; render();
  const q = new URLSearchParams({id, puuid: (profData || {}).puuid || ""});
  try { matchData = await getJson("/api/match?" + q); } catch (e) { matchData = {error: "Nicht erreichbar"}; }
  matchLoading = false; render();
}
function closeMatch() { matchData = null; matchLoading = false; render(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && (matchData || matchLoading)) closeMatch(); });
const spellImg = s => s ? img(`${DD()}/img/spell/${s}.png`, 18) : "";
const runeImg = (ic, sz) => ic ? img(`https://ddragon.leagueoflegends.com/cdn/img/${ic}`, sz, true) : "";
function matchModal() {
  const wrap = inner => `<div onclick="if(event.target===this)closeMatch()" style="position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:50;overflow:auto;padding:30px 16px">
    <div class="card" style="max-width:1080px;margin:auto;position:relative"><button class="btn sec" style="position:absolute;right:16px;top:16px" onclick="closeMatch()">Schließen</button>${inner}</div></div>`;
  if (matchLoading) return wrap(empty("⏳", "Lade Game…", "Scoreboard und Analyse werden geholt."));
  const d = matchData;
  if (d.error) return wrap(empty("⚠️", "Konnte das Game nicht laden", esc(d.error)));
  const teamHtml = t => {
    const o = t.objectives || {};
    return `<div style="margin-top:16px"><div class="row" style="border:0"><b class="${t.win ? "green" : "red"}" style="font-size:17px">${t.win ? "Sieg" : "Niederlage"} · ${t.team_id === 100 ? "Blau" : "Rot"}</b>
      <span class="small muted">${t.kills} Kills · ${(t.gold / 1000).toFixed(1)}k Gold · 🐉 ${o.dragon || 0} · 🪱 ${o.horde || 0} · 👁 ${o.riftHerald || 0} · 🟣 ${o.baron || 0} · 🗼 ${o.tower || 0}${t.bans.length ? " · Bans: " + t.bans.map(b => champImg(b, 18)).join("") : ""}</span></div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr class="muted" style="text-align:left"><th style="padding:6px 4px">Spieler</th><th>KDA</th><th>Schaden</th><th>CS</th><th>Gold</th><th>Vision</th><th>Items</th></tr>
      ${t.players.map(r => `<tr style="border-top:1px solid var(--sep);${r.me ? "background:rgba(0,113,227,.08)" : ""}">
        <td style="padding:6px 4px;white-space:nowrap"><div style="display:flex;gap:6px;align-items:center">${champImg(r.champion, 32)}
          <div style="display:flex;flex-direction:column;gap:1px">${spellImg(r.spells[0])}${spellImg(r.spells[1])}</div>
          <div style="display:flex;flex-direction:column;gap:1px">${runeImg(r.keystone_icon, 18)}${runeImg(r.sub_icon, 14)}</div>
          <div><b>${esc(r.name)}</b>${r.mvp ? ' <span class="badge gem">MVP</span>' : ""}<div class="muted" style="font-size:11px">${esc(r.champion_name)} · ${esc(r.role)} · Lvl ${r.level}</div></div></div></td>
        <td style="white-space:nowrap"><b>${r.kills}/<span class="red">${r.deaths}</span>/${r.assists}</b><div class="muted" style="font-size:11px">${r.kda} KDA</div></td>
        <td style="min-width:90px">${(r.damage / 1000).toFixed(1)}k<div class="meter" style="height:4px;margin-top:3px"><i style="width:${r.damage_pct}%;background:var(--red)"></i></div></td>
        <td>${r.cs}<div class="muted" style="font-size:11px">${r.cs_min}/Min</div></td><td>${(r.gold / 1000).toFixed(1)}k</td><td>${r.vision}</td>
        <td style="white-space:nowrap">${r.items.map(itemImg).join(" ")}</td></tr>`).join("")}</table></div></div>`;
  };
  let inner = `<h2 class="title" style="font-size:26px">${esc(d.queue)} · ${d.duration} Min</h2><p class="subtitle" style="margin-bottom:0">${new Date(d.ended * 1000).toLocaleString("de-DE")}</p>` + d.teams.map(teamHtml).join("");
  if (d.analysis) {
    const g = Object.assign({}, d.analysis, {clips: null});
    inner += `<div class="grid" style="margin-top:20px">${deepCard(g)}</div>`;
  } else if (d.analysis_error) inner += `<p class="small red">Analyse nicht möglich: ${esc(d.analysis_error)}</p>`;
  else inner += `<p class="small muted" style="margin-top:16px">Die Deep-Analyse gibt es für deine eigenen Jungle-Games.</p>`;
  return wrap(inner);
}
function searchProfile() { profQuery = $("#p_q").value.trim(); profQueue = ""; profData = null; loadProfile(); }

// ------------------------------------------------------------ RANKED
function renderRanked() {
  const r = rankedData;
  if (!r) return page("Ranked", "Lade…", "");
  const s = r.summary;
  let h = "";
  if ((r.accounts || []).length > 1) h += card("", "", `<div class="row" style="border:0;padding:0"><span class="muted small">Account</span>
    <select onchange="rankedAccount=this.value;loadRanked()">${r.accounts.map(a => `<option value="${esc(a)}"${a === r.account ? " selected" : ""}>${esc(a)}</option>`).join("")}</select></div>`, true);
  if (!s) {
    h += card("", "", empty("🏆", "Noch kein Rang erfasst", "Starte den League Client. Dein Solo/Duo-Rang und jede LP-Änderung werden ab jetzt automatisch mitgeschrieben."), true);
  } else {
    const chart = s.chart.map(c => c.abs);
    h += card("", "", `<div class="two" style="grid-template-columns:minmax(240px,320px) 1fr">
      <div><div class="muted small">Solo/Duo</div><div class="huge">${esc(cap(s.tier))} ${esc(s.division)}</div>
        <div class="big" style="font-size:22px">${s.lp} LP</div>
        <div class="stats">
          <div class="stat"><b class="${col(s.today)}">${sign(s.today)}</b><span>LP heute</span></div>
          <div class="stat"><b class="${col(s.week)}">${sign(s.week)}</b><span>LP 7 Tage</span></div>
          <div class="stat"><b>${s.winrate}%</b><span>${s.wins}S / ${s.losses}N</span></div>
          <div class="stat"><b class="${col(s.streak)}">${s.streak > 0 ? s.streak + " S" : s.streak < 0 ? -s.streak + " N" : "–"}</b><span>Serie</span></div>
          <div class="stat"><b class="green">${sign(s.avg_win_lp)}</b><span>Ø LP pro Sieg</span></div>
          <div class="stat"><b class="red">${sign(s.avg_loss_lp)}</b><span>Ø LP pro Niederlage</span></div>
        </div></div>
      <div><div class="muted small" style="margin-bottom:6px">LP-Verlauf</div>${lineChart(chart)}
        <div class="muted small" style="margin:10px 0 6px">Letzte Games</div>
        <div class="chips">${s.recent.map(g => `<span class="chip ${g.win ? "green" : "red"}">${sign(g.lp)}</span>`).join("") || '<span class="muted small">Kommt nach dem nächsten Game.</span>'}</div>
        ${s.avg_win_lp != null && s.avg_loss_lp != null && s.avg_win_lp < -s.avg_loss_lp ? `<p class="small orange" style="margin-top:10px">Du bekommst weniger LP pro Sieg als du pro Niederlage verlierst – dein MMR liegt unter deinem Rang. Konstant gewinnen gleicht das aus.</p>` : ""}
      </div></div>`, true);
  }
  const imp = r.improvements || [];
  h += card("Was besser werden muss", `Durchschnitt aus ${r.games} analysierten Games. Pfeil = Trend deiner neuesten Games.`,
    imp.length ? imp.map((c, i) => `<div style="padding:8px 0;${i < imp.length - 1 ? "border-bottom:1px solid var(--sep)" : ""}">
      <div class="row" style="border:0;padding:0"><span>${i < 2 ? "<b>" + esc(c.name) + "</b>" : esc(c.name)}</span>
      <span><b>${c.score}</b> <span class="small ${col(c.trend)}">${c.trend > 0 ? "▲" : c.trend < 0 ? "▼" : ""}${c.trend ? Math.abs(c.trend) : ""}</span></span></div>
      <div class="meter"><i style="width:${c.score}%;background:${scoreCol(c.score)}"></i></div></div>`).join("")
      : empty("📊", "Noch keine Analysen", 'Öffne <a href="#" onclick="go(\'analyse\');return false">Analyse</a> und lade deine letzten Games.'));
  h += card("Deine schlechtesten Matchups", "Gegen diese Jungler verlierst du in deinen eigenen Games am meisten.",
    list((r.own_matchups || []).slice(0, 6), m => `<li class="row"><span><b>${esc(m.enemy)}</b> <span class="muted small">${m.games} ${m.games === 1 ? "Game" : "Games"}</span></span>
      <span><span class="${m.winrate < 50 ? "red" : "green"}">${m.winrate}%</span> <span class="muted small">GD@10 ${sign(m.avg_gd10)}</span></span></li>`));
  if ((r.pool_worst || []).length) h += card("Schwerste Matchups laut Daten", "Aus allen gesammelten Games, für deine Champions (Meta-Tab füllt die Daten).",
    r.pool_worst.map(p => `<div style="margin-bottom:10px"><b>${esc(p.champion)}</b>${list(p.worst, m => `<li class="row"><span>vs ${esc(m.enemy)}</span><span class="${m.adj_winrate < 50 ? "red" : "orange"}">${m.adj_winrate}% <span class="muted small">${m.games} G</span></span></li>`)}</div>`).join(""));

function clipPlayer(sid, clips) {
  if (!clips || !clips.length) return '<span class="muted small">Keine Clips für dieses Game.</span>';
  const cur = selClip && selClip.sid === sid ? selClip.file : clips[0].file;
  return `<video src="/clips/${encodeURIComponent(sid)}/${encodeURIComponent(cur)}" controls></video>` +
    list(clips, c => `<li class="click ${c.file === cur ? "sel" : ""}" onclick='selClip={sid:${JSON.stringify(sid)},file:${JSON.stringify(c.file)}};render()'>
      <b>${esc(c.time)}</b> ${esc(c.title)} <span class="muted small">– ${esc(c.why)}</span></li>`);
}
function sessionsCards() {
  if (!sessions.length) return card("Fehler-Clips", "Die letzten 3 Games werden automatisch aufgenommen und geschnitten.", empty("🎬", "Noch keine Clips", "Spiel ein Game – Tode, verlorene Objectives und Gegner-Ganks landen danach hier."), true);
  return sessions.map(se => card(`Clips · ${se.champion || "Game"}`, new Date(se.start_wall * 1000).toLocaleString("de-DE"), clipPlayer(se.id, se.clips), true)).join("");
}

        ${D.categories.map(c => `<div style="padding:7px 0"><div class="row" style="border:0;padding:0"><span>${esc(c.name)}</span><b class="${gradeCol(c.grade)}">${c.grade}</b></div>
          <div class="meter"><i style="width:${c.score}%;background:${scoreCol(c.score)}"></i></div></div>`).join("")}</div>
      <div><b>Deine 3 Prioritäten</b>${D.priorities.map((p, i) => `<div class="item"><div class="num">${i + 1}</div><div><div class="n">${esc(p.name)} <span class="${gradeCol(p.grade)}">${p.grade}</span></div><div class="w">${esc(p.advice)}</div></div></div>`).join("")}</div>
      <div><b>Gold vs Gegner-Jungler</b>${lineChart(D.curve.map(c => c.gold_diff), [0, 5, 10, 15, 20, 25, 30].filter(m => m < D.curve.length).map(m => [m, m + "'"]), {zero: true, h: 130})}
        <div class="stats"><div class="stat"><b>${D.stats.kp}%</b><span>Kill-Beteiligung</span></div><div class="stat"><b>${D.stats.vision_per_min}</b><span>Vision / Min</span></div><div class="stat"><b>${D.stats.jungle_cs_10}</b><span>Jungle-CS @10</span></div></div></div>
      <div><b>Tode im Detail</b>${list(D.deaths, d => { const c = clipFor(d.t);
        return `<li><b>${d.min}'</b> · ${esc(d.area)} ${c ? `<a href="#" onclick='selClip={sid:${JSON.stringify(g.session_id)},file:${JSON.stringify(c.file)}};render();return false'>▶ Clip</a>` : ""}<div class="muted small">${esc(d.tags.join(" · "))}</div></li>`; })}
        <b style="display:block;margin-top:12px">Objectives</b>${list(D.objectives, o => `<li class="small"><span class="${o.ours ? "green" : "red"}">${o.min}' ${esc(o.type)} ${o.ours ? "geholt" : "verloren"}</span> <span class="muted">${o.present ? "· du warst da" : "· du warst weg"}</span></li>`)}</div>
    </div>${g.clips ? `<div style="margin-top:18px"><b>Fehler-Clips dieses Games</b><div style="margin-top:8px">${clipPlayer(g.session_id, g.clips)}</div></div>` : ""}`, true);
}
function replayCard(g) {
  const R = g.replay, m = replayMin, me = R.me.filter(p => p.min <= m), ej = R.enemy_jg.filter(p => p.min <= m), ev = R.events.filter(e => e.min <= m);
  const L = [trail(me, "#30d158"), trail(ej, "#ff453a"), ...ev.map(e => cross(e.x, e.y, e.who === "me" ? "#30d158" : "#ff453a"))];
  if (me.length) L.push(dot(me[me.length - 1].x, me[me.length - 1].y, "#30d158", "Du"));
  if (ej.length) L.push(dot(ej[ej.length - 1].x, ej[ej.length - 1].y, "#ff453a", g.enemy_jungler));
  const cur = ej.find(p => p.min === m);
  return card("Map-Replay", "Wege von dir (grün) und dem Gegner-Jungler (rot), Minute für Minute. ✕ = Kill/Tod.", `<div class="two"><div>${mapSvg(L)}
    <div class="row" style="border:0"><button class="btn sec" onclick="togglePlay()">${playTimer ? "Pause" : "Abspielen"}</button>
      <input type="range" min="0" max="15" value="${m}" style="flex:1" oninput="replayMin=+this.value;render()"><b>${m}'</b></div>
    <div class="small muted">${cur ? "Gegner-Jungler: " + esc(cur.area) : ""}</div></div>
    <div><b>Gegner-Jungler pro Minute</b>${list(R.enemy_jg.filter(p => p.min >= 1), p => `<li class="small ${p.min === m ? "sel" : ""}">${p.min}' · ${esc(p.area)}</li>`)}</div></div>`, true);
}
function renderAnalyse() {

  if (!r) return page("Analyse", "Deine letzten Ranked-Jungle-Games im Detail: Noten, Fehler und Clips.",

    <div class="stat"><b>${s.avg_jungle_cs_5}</b><span>Ø Jungle-CS @5</span></div><div class="stat"><b>${esc(s.objectives_pre20)}</b><span>Objectives vor 20'</span></div></div>` : "") + `<div style="margin-top:14px">${loadBtn}</div>`);
  h += card("Was du ändern musst", "Muster über alle analysierten Games.", list(s.tips, t => `<li class="small">${esc(t)}</li>`));
  h += card("Games", "Antippen für Deep-Analyse und Clips.", list(r.games, (g, i) => `<li class="click ${i === selGame ? "sel" : ""}" onclick="selGame=${i};replayMin=15;selClip=null;render()">

}

function ring(v, label, size = 128) {

    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="url(#rg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <b style="font-size:${size / 3.8}px">${v ?? "–"}</b>${label ? `<span>${esc(label)}</span>` : ""}</div>`;
}

          <div style="font-size:30px">${ROLE_ICON[r]}</div><h4 style="margin:6px 0 0">${l}</h4></button>`).join("")}</div>`, true)}
    ${card("2 · Deine Main-Champions", "Optional – bis zu 2. Sie bekommen extra Analysen, Matchups und Vorschläge im Champ Select.",
      `<div class="chips" style="margin-bottom:12px">${onb.mains.map(id => `<button class="chip on" onclick="onb.mains=onb.mains.filter(x=>x!=='${id}');render()">${cImg(id, 20, 6)} ${esc((champList.find(c => c.id === id) || {name: id}).name)} ✕</button>`).join("") || '<span class="muted small">Noch keiner gewählt.</span>'}</div>
      ${onb.mains.length < 2 ? `<input placeholder="Champion suchen, z. B. Graves" value="${esc(onb.q)}" oninput="onb.q=this.value;render()">
      <div class="chips" style="margin-top:10px">${hits.map(c => `<button class="chip" onclick="onb.mains.push('${c.id}');onb.q='';render()">${cImg(c.id, 20, 6)} ${esc(c.name)}</button>`).join("")}</div>` : ""}`, true)}
    ${card("", "", `<div class="row" style="border:0"><span class="small ${onb.msg ? "red" : "muted"}">${esc(onb.msg || "Du kannst beides später in den Einstellungen ändern.")}</span>
      <button class="btn" ${onb.role ? "" : "disabled"} onclick="finishOnboarding()">Los geht's</button></div>`, true)}</div>`;
}
async function finishOnboarding() {
  if (!onb.role) { onb.msg = "Bitte wähle deine Rolle."; render(); return; }
  const body = {main_role: onb.role, champion_pool: onb.mains};
  const r = await (await fetch("/api/config", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();
  if (!r.ok) { onb.msg = "Speichern fehlgeschlagen."; render(); return; }
  await loadCfg(); tierRole = onb.role; renderedView = null; go("coach");
}

  if (cons) h += card("Konstanz", esc(cons.verdict), `<div class="stats" style="margin-top:0">

      <div class="stat"><b>±${cons.spread}</b><span>Schwankung</span></div><div class="stat"><b class="green">${cons.great_games}</b><span>Top-Games</span></div><div class="stat"><b class="red">${cons.bad_games}</b><span>Ausrutscher</span></div></div>

const ROLES = [["TOP", "Top"], ["JUNGLE", "Jungle"], ["MIDDLE", "Mid"], ["BOTTOM", "Bot"], ["UTILITY", "Support"]];
async function loadTier() { try { const d = await getJson("/api/tierlist?role=" + tierRole); tierData[tierRole] = d; if (view === "meta") render(); } catch (e) {} }
async function openChamp(id, role) {
  champLoading = id; champPage = null; render();
  try { champPage = await getJson("/api/champion?id=" + encodeURIComponent(id) + (role ? "&role=" + role : "")); } catch (e) { champPage = {error: String(e)}; }
  champLoading = ""; renderedView = null; render();
}
function closeChamp() { champPage = null; renderedView = null; render(); }

  h += card("Build", "Kern-Items nach Häufigkeit – mit Winrate.", `${core.length ? `<div class="build">${core.map((i, n) => `${n ? '<span class="arr">›</span>' : ""}<div class="ibox">${iImg(i.id, 52)}<small>${esc(i.name)}</small><small class="${i.winrate >= 50 ? "green" : "red"}">${i.winrate}% · ${i.pickrate}%</small></div>`).join("")}

  if (p.benchmarks) h += card("So spielen gute Spieler", `${esc(p.benchmarks.scope)} · ${p.benchmarks.games} Games`,
    p.benchmarks.values.map(v => `<div class="row small"><span>${esc(v.label)}</span><span>Ø <b>${typeof v.avg === "number" ? Math.round(v.avg * 10) / 10 : v.avg}${v.unit}</b> · Top 25%: <b class="green">${typeof v.top === "number" ? Math.round(v.top * 10) / 10 : v.top}${v.unit}</b></span></div>`).join(""));

      <p class="small muted">Komma-getrennt, Schreibweise wie im Spiel ohne Leerzeichen (Wukong = MonkeyKing).</p>
      <label class="f">Statistiken aus welchem Elo?</label><select class="f" id="s_bracket">
        ${[["auto", "Automatisch (mein Rang)"], ["all", "Alle Elos"], ["low", "Iron–Silver"], ["mid", "Gold–Platin"], ["high", "Emerald–Diamond"], ["apex", "Master+"]].map(([v, t]) => `<option value="${v}" ${v === c.meta_bracket ? "selected" : ""}>${t}</option>`).join("")}</select>
      <div class="switch"><span>Runen automatisch setzen<div class="small muted">Bei jedem neuen Gegner-Pick, final wenn alle 5 drin sind.</div></span><input type="checkbox" id="s_auto" ${c.auto_import_runes !== false ? "checked" : ""}></div>
      <label class="f">Games im Profil</label><input class="f" id="s_pgames" type="number" min="5" max="50" value="${c.profile_games || 20}">
      <label class="f">Games pro Analyse</label><input class="f" id="s_games" type="number" min="5" max="50" value="${c.review_games || 20}">`) +
    card("Rechtliches", "", `<ul class="clean small">

      <li><a href="${serverUrl()}/impressum.html" target="_blank">Impressum</a></li>
      <li><a href="${serverUrl()}/nutzungsbedingungen.html" target="_blank">Nutzungsbedingungen</a></li></ul>
      <p class="small muted">Jungle Coach isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.</p>`) +
    card("Kurzbefehle & Infos", "", `<ul class="clean small">
      <li><b>Ctrl+Shift+J</b> Overlay ein/aus</li><li><b>Ctrl+Shift+K</b> Overlay verschieben</li>
      <li>League auf <b>Randlos</b> stellen, damit das Overlay sichtbar ist.</li>
      <li>Aufnahmen: nur die letzten 3 Games werden behalten.</li></ul>`) +
    `<div class="card wide" style="display:flex;justify-content:flex-end;gap:12px;align-items:center"><span class="small muted">${esc(msg.cfg || "")}</span><button class="btn" onclick="saveCfg()">Sichern</button></div>`);
}

// ------------------------------------------------------------ account
let accData = null;
const serverUrl = () => ((cfgData || {}).server_url || "").replace(/\/$/, "");
function accountCard() {
  const a = accData;
  if (!a) return card("Konto", "", '<span class="muted small">Lade…</span>');
  if (!a.server) return card("Konto", "", '<span class="muted small">Die Anmeldung wird gerade eingerichtet. Bis dahin funktioniert die App mit eigenem Entwickler-Key (unten).</span>');
  if (!a.logged_in) return card("Konto", "Melde dich an, damit die App Profil, Match-History und Analysen laden kann. Gespeichert werden nur deine Nutzer-ID und dein Anzeigename – keine E-Mail, kein Passwort.",
    `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="background:#5865F2" onclick="login('discord')">Mit Discord anmelden</button>
     <button class="btn sec" onclick="login('google')">Mit Google anmelden</button></div>
     <p class="small muted">Der Browser öffnet sich zur Anmeldung. Danach einfach hierher zurückkehren. ${a.error ? esc(a.error) : ""}</p>
     <p class="small muted">Mit der Anmeldung akzeptierst du die <a href="${serverUrl()}/nutzungsbedingungen.html" target="_blank">Nutzungsbedingungen</a> und hast die <a href="${serverUrl()}/datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen.</p>`);
  return card("Konto", "", `<div class="row" style="border:0"><span>Angemeldet als <b>${esc(a.name || "–")}</b> <span class="badge">${esc(a.provider || "")}</span>${a.offline ? ' <span class="badge">offline</span>' : ""}</span>
     <button class="btn sec" onclick="logout()">Abmelden</button></div>
     <details><summary class="small red" style="cursor:pointer">Konto löschen</summary>
     <p class="small">Löscht dein Konto und alle dazu gespeicherten Daten sofort und endgültig. Lokale Daten auf deinem PC (Einstellungen, Clips) bleiben, bis du die App deinstallierst.</p>
     <button class="btn" style="background:var(--red)" onclick="deleteAccount()">Konto endgültig löschen</button></details>`);
}
async function loadAccount() { try { accData = await getJson("/api/account"); } catch (e) { accData = {server: false}; } if (view === "settings") render(); }
async function login(p) {
  const r = await getJson("/api/login?provider=" + p);
  if (r.error) { alertMsg(r.error); return; }
  let n = 0; const t = setInterval(async () => { n++; await loadAccount(); if ((accData && accData.logged_in) || n > 60) { clearInterval(t); if (accData.logged_in) { profData = null; profErr = ""; } } }, 3000);
}
async function logout() { await fetch("/api/logout", {method: "POST"}); profData = null; await loadAccount(); }
async function deleteAccount() {
  const r = await (await fetch("/api/delete-account", {method: "POST"})).json();
  if (r.error) alertMsg(r.error); profData = null; await loadAccount();
}

// ------------------------------------------------------------ render + data
let renderedView = null, LANG = "de", LANG_SAVED = null, TR_RE = null;
const NM = x => x ? (LANG === "en" ? (x.name || x.name_de) : (x.name_de || x.name)) : "";
function setLang(l) {
  l = l === "en" ? "en" : "de";
  if (l === LANG && (l === "de" || TR_RE)) return;
  LANG = l; document.documentElement.lang = l;
  const dict = window.I18N_EN || {};
  const keys = Object.keys(dict).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  TR_RE = keys.length ? new RegExp("(?<![\\p{L}\\d])(" + keys.join("|") + ")(?![\\p{L}])", "gu") : null;
  translateTree(document.querySelector("aside")); renderedView = null; render();
}
const tr = t => (LANG === "en" && TR_RE && t && /[A-Za-zÄÖÜäöüß]/.test(t)) ? t.replace(TR_RE, m => window.I18N_EN[m] ?? m) : t;
function translateTree(root) {
  if (LANG !== "en" || !root || !TR_RE) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = w.currentNode; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
    else for (const a of ["placeholder", "title"]) if (n.hasAttribute && n.hasAttribute(a)) n.setAttribute(a, tr(n.getAttribute(a)));
  }
}
function morphAttrs(a, b) {
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
}
function morph(a, b) {   // update DOM a to look like b without rebuilding it: no flicker, keeps focus/scroll/video
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++) {
    const x = ac[i], y = bc[i];
    if (!x) { a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === 3 || x.nodeType === 8) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeName === "VIDEO" && x.getAttribute("src") === y.getAttribute("src")) continue;
    const focused = x === document.activeElement && /INPUT|SELECT|TEXTAREA/.test(x.nodeName);
    if (!focused) morphAttrs(x, y);
    if (/INPUT|TEXTAREA/.test(x.nodeName)) { if (!focused && x.value !== (y.getAttribute("value") ?? "")) x.value = y.getAttribute("value") ?? ""; continue; }
    if (x.nodeName === "SELECT" && focused) continue;
    morph(x, y);
    if (x.nodeName === "SELECT") { const o = [...y.options].find(o => o.hasAttribute("selected")); if (o && !focused) x.value = o.value; }
  }
  for (let i = ac.length - 1; i >= bc.length; i--) a.removeChild(ac[i]);
}
function render() {
  const ph = state.phase || "…";
  const label = {InGame: "Im Spiel", ChampSelect: "Champ Select", Lobby: "Lobby", None: "Client bereit", Matchmaking: "Suche läuft", ReadyCheck: "Match gefunden", EndOfGame: "Spielende"}[ph] || ph;
  $("#stxt").textContent = label; $("#sdot").classList.toggle("on", !/nicht gefunden|Startet/.test(ph));
  $("#rec").style.display = state.recording ? "flex" : "none";
  $("#err").style.display = state.error ? "block" : "none"; $("#err").textContent = tr(state.error || "");
  $("#stxt").textContent = tr($("#stxt").textContent);
  const R = {coach: renderCoach, profile: renderProfile, ranked: renderRanked, select: renderSelect, live: renderLive, analyse: renderAnalyse, meta: renderMeta, settings: renderSettings};
  const gate = needsOnboarding();
  const html = gate ? renderOnboarding() : R[view]();
  const vkey = gate ? "onboarding" : view;
  const main = $("#main");
  const tmp = document.createElement("div"); tmp.innerHTML = html; translateTree(tmp);
  if (renderedView !== vkey) {
    main.replaceChildren(...tmp.childNodes); renderedView = vkey; window.scrollTo({top: 0});
    main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
    clearTimeout(render._t); render._t = setTimeout(() => main.classList.remove("enter"), 900);
  } else {
    morph(main, tmp);
  }
}
async function tick() {
  let txt;
  try { txt = await (await fetch("/api/state")).text(); } catch (e) { txt = JSON.stringify({...state, error: "App-Server nicht erreichbar"}); }
  if (txt === lastJson) return;
  lastJson = txt; state = JSON.parse(txt);
  if (state.lang && state.lang !== LANG) setLang(state.lang);
  const rsNow = JSON.stringify(state.review_status || {});
  if (rsNow !== tick._rs) { const was = tick._rs; tick._rs = rsNow; if (was && !(state.review_status || {}).running) { coachData = null; loadCoach(); } }
  const ph = state.live ? "InGame" : state.phase;          // auto-switch on phase change only
  if (ph !== lastPhase) { if (ph === "ChampSelect") go("select"); else if (ph === "InGame") go("live"); lastPhase = ph; }
  if (view !== "settings") render();
}
const getJson = async u => (await fetch(u)).json();
async function loadRanked() { try { rankedData = await getJson("/api/ranked" + (rankedAccount ? "?account=" + encodeURIComponent(rankedAccount) : "")); if (view === "ranked") render(); } catch (e) {} }
async function loadMeta() { try { metaData = await getJson("/api/meta"); if (view === "meta") render(); } catch (e) {} }
async function loadCfg() { try { cfgData = await getJson("/api/config"); if (cfgData.main_role) tierRole = tierRole === "JUNGLE" ? cfgData.main_role : tierRole; if (!cfgData.main_role && !onb.mains.length) onb.mains = (cfgData.champion_pool || []).slice(0, 2);
  if (view === "settings" || !cfgData.main_role) render(); } catch (e) {} }
async function loadChampList() { try { champList = await getJson("/api/champions"); if (needsOnboarding()) render(); } catch (e) {} }
async function loadSessions() { try { const s = await getJson("/api/sessions"); if (JSON.stringify(s) !== JSON.stringify(sessions)) { sessions = s; if (view === "analyse") render(); } } catch (e) {} }
async function applyRunes() { const r = await (await fetch("/api/apply-runes", {method: "POST"})).json(); msg.runes = r.error || "Runen gesetzt ✓"; render(); }
async function crawl() { const r = await (await fetch("/api/meta/crawl", {method: "POST"})).json(); if (r.error) alertMsg(r.error); loadMeta(); }
function alertMsg(t) { state.error = t; render(); }
async function loadReview() {
  msg.review = "Lade Games… (ca. 1 Minute)"; render();
  const r = await getJson("/api/review"); msg.review = r.error || "";
  if (!r.error) { state.review = r; selGame = 0; loadRanked(); coachData = null; loadCoach(); }
  render();
}
async function saveCfg() {
  const body = {riot_id: $("#s_riot").value.trim(), platform: $("#s_platform").value, champion_pool: $("#s_pool").value.split(",").map(s => s.trim()).filter(Boolean),
    language: $("#s_lang").value, main_role: $("#s_role").value, meta_bracket: $("#s_bracket").value, auto_import_runes: $("#s_auto").checked, review_games: +$("#s_games").value || 20, profile_games: +$("#s_pgames").value || 20};
  if ($("#s_key").value.trim()) body.riot_api_key = $("#s_key").value.trim();
  const r = await (await fetch("/api/config", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();
  msg.cfg = r.ok ? "Gespeichert ✓" : "Fehler beim Speichern"; await loadCfg(); profData = null; profErr = "";
  if (r.ok && (body.language || "") !== (LANG_SAVED ?? "")) msg.cfg += " – App neu starten, um die Sprache komplett zu wechseln / restart the app to switch language completely";
  LANG_SAVED = body.language || ""; setLang(body.language || state.lang);
}
async function testKey() {
  const k = ($("#s_key") || {}).value || "";
  msg.test = [{ok: true, text: "Teste…"}]; render();
  const r = await (await fetch("/api/test-key", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({riot_api_key: k.trim()})})).json();
  msg.test = r.steps; await loadCfg(); profData = null; profErr = ""; render();
}
function togglePlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; render(); return; }
  if (replayMin >= 15) replayMin = 0;
  playTimer = setInterval(() => { replayMin++; if (replayMin >= 15) { clearInterval(playTimer); playTimer = null; } render(); }, 700);
  render();
}
loadCfg(); loadChampList(); go("coach"); tick();
setInterval(tick, 2000); setInterval(loadSessions, 20000);
setInterval(() => { if (view === "ranked") loadRanked(); if (view === "meta") loadMeta(); }, 8000);
</script>
