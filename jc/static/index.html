<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moosi</title>
<style>
  :root {
    --bg:#07090f; --bg2:#0b0f1a; --card:rgba(20,26,40,.72); --card2:rgba(255,255,255,.055); --card3:rgba(255,255,255,.09);
    --txt:#eef2ff; --sec:#8b93a7; --sep:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
    --acc:#22d3ee; --acc2:#a78bfa; --grad:linear-gradient(135deg,#22d3ee 0%,#818cf8 55%,#c084fc 100%);
    --green:#34d399; --orange:#fbbf24; --red:#fb7185; --purple:#c084fc; --gold:#f5c451;
    --shadow:0 10px 40px rgba(0,0,0,.45); --r:20px; --blur:rgba(7,9,15,.7);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--txt);
    font:14.5px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1, "cv11" 1; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(900px 600px at 85% -10%, rgba(129,140,248,.16), transparent 60%),
               radial-gradient(800px 600px at -10% 110%, rgba(34,211,238,.12), transparent 60%),
               radial-gradient(600px 400px at 50% 50%, rgba(192,132,252,.05), transparent 70%); }
  ::selection { background:rgba(34,211,238,.3); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }

  /* ---------- shell: sidebar + content */
  .shell { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  aside { position:sticky; top:0; height:100vh; padding:22px 14px; border-right:1px solid var(--sep);
    background:linear-gradient(180deg,rgba(11,15,26,.92),rgba(7,9,15,.92)); backdrop-filter:blur(20px); display:flex; flex-direction:column; gap:18px; }
  .logo { display:flex; align-items:center; gap:10px; padding:0 8px; font-weight:800; font-size:17px; letter-spacing:-.3px; }
  .logo i { width:32px; height:32px; border-radius:10px; background:var(--grad); display:grid; place-items:center; font-style:normal; font-size:17px;
    box-shadow:0 6px 24px rgba(34,211,238,.35); }
  .logo small { display:block; font-size:11px; color:var(--sec); font-weight:500; letter-spacing:0; }
  nav#nav { display:flex; flex-direction:column; gap:3px; }
  nav#nav button { display:flex; align-items:center; gap:11px; border:0; background:none; color:var(--sec); font:inherit; font-weight:600; font-size:14px;
    padding:10px 12px; border-radius:12px; cursor:pointer; text-align:left; transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); position:relative; }
  nav#nav button span.ic { width:22px; text-align:center; font-size:16px; filter:grayscale(.3); }
  nav#nav button:hover { background:var(--card2); color:var(--txt); }
  nav#nav button.act { background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(129,140,248,.06)); color:var(--txt); }
  nav#nav button.act::before { content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--grad); }
  nav#nav button .pill { margin-left:auto; font-size:10px; padding:1px 7px; border-radius:99px; background:var(--grad); color:#071018; font-weight:800; }
  .side-status { margin-top:auto; padding:12px; border-radius:14px; background:var(--card2); border:1px solid var(--sep); font-size:12.5px; }
  .status { color:var(--sec); display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--sec); display:inline-block; box-shadow:0 0 0 3px rgba(255,255,255,.05); }
  .dot.on { background:var(--green); box-shadow:0 0 12px rgba(52,211,153,.7); } .dot.rec { background:var(--red); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  main { padding:34px 40px 80px; max-width:1320px; width:100%; }
  @media (max-width:900px) { .shell { grid-template-columns:1fr; } aside { position:sticky; height:auto; flex-direction:row; align-items:center; padding:10px 12px; z-index:20; overflow-x:auto; }
    nav#nav { flex-direction:row; } nav#nav button { padding:8px 10px; } nav#nav button .lbl, .side-status, .logo small { display:none; } main { padding:20px 16px 60px; } }

  /* ---------- typography */
  .title { font-size:34px; font-weight:800; letter-spacing:-.8px; margin:0; line-height:1.15; }
  .title .g, .g { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:var(--sec); margin:6px 0 26px; max-width:760px; font-size:15px; }
  .muted { color:var(--sec); } .small { font-size:12.5px; }
  .green { color:var(--green); } .red { color:var(--red); } .orange { color:var(--orange); } .acc { color:var(--acc); } .gold { color:var(--gold); }
  .big { font-size:28px; font-weight:800; letter-spacing:-.5px; }
  .huge { font-size:44px; font-weight:800; letter-spacing:-1.2px; line-height:1.05; }
  a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }

  /* ---------- cards & grid */
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .card { position:relative; background:var(--card); border-radius:var(--r); padding:22px 24px; border:1px solid var(--line);
    box-shadow:var(--shadow); backdrop-filter:blur(18px); transition:transform .25s var(--ease), border-color .25s var(--ease); }
  .card:hover { border-color:rgba(255,255,255,.16); }
  .card.wide { grid-column:1/-1; }
  .card.glow::after { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; background:var(--grad); opacity:.55;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .card h3 { margin:0 0 3px; font-size:16.5px; font-weight:700; letter-spacing:-.2px; }
  .card .hint { color:var(--sec); font-size:12.5px; margin:0 0 16px; }
  .enter .card { animation:rise .45s var(--ease) both; }
  .enter .card:nth-child(2) { animation-delay:.04s } .enter .card:nth-child(3) { animation-delay:.08s } .enter .card:nth-child(4) { animation-delay:.12s }
  .enter .card:nth-child(5) { animation-delay:.16s } .enter .card:nth-child(n+6) { animation-delay:.2s }
  .enter .title, .enter .subtitle { animation:rise .4s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(12px) scale(.99); } to { opacity:1; transform:none; } }
  /* v1.9.3 motion: springy, staggered, bars grow, numbers count; calm with "reduce motion" */
  .enter .card { animation:rise .5s cubic-bezier(.2,.9,.25,1.15) both; }
  .enter .stat, .enter .row, .enter tr, .enter .lb, .enter .fcard { animation:rise .45s cubic-bezier(.2,.9,.25,1.15) both; animation-delay:calc(var(--i, 0) * 35ms + 80ms); }
  .enter .meter i { animation:grow .9s cubic-bezier(.2,.8,.2,1) both; transform-origin:left; animation-delay:.25s; }
  @keyframes grow { from { transform:scaleX(0); } }
  .tgl { flex:none; width:46px; height:28px; border-radius:99px; border:0; background:rgba(255,255,255,.14); position:relative; cursor:pointer; padding:0; transition:background .2s; }
  .tgl i { position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); transition:transform .25s cubic-bezier(.3,1.5,.5,1); }
  .tgl.on { background:var(--green, #30d158); } .tgl.on i { transform:translateX(18px); }
  @keyframes modalIn { from { opacity:0; transform:translateY(22px) scale(.97); } 70% { transform:translateY(-2px) scale(1.004); } }
  .mmodal > .card { animation:modalIn .4s cubic-bezier(.2,1,.3,1); }
  .mmodal tr { animation:rise .4s cubic-bezier(.2,.9,.25,1.15) both; animation-delay:calc(var(--i, 0) * 30ms + 120ms); }
  .mmodal .meter i { animation:grow .9s cubic-bezier(.2,.8,.2,1) both; transform-origin:left; animation-delay:.35s; }
  button, .lb, #nav button, .row[onclick], tr[onclick] { transition:transform .22s cubic-bezier(.3,1.6,.5,1), background-color .2s, opacity .2s; }
  button:active, .lb:active, #nav button:active { transform:scale(.96); }
  #nav button.act svg { animation:navPop .4s cubic-bezier(.3,1.6,.5,1); } @keyframes navPop { 0% { transform:scale(.7); } 60% { transform:scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--sep); }
  .row:last-child { border-bottom:0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin-top:14px; }
  .stat { background:var(--card2); border:1px solid var(--sep); border-radius:14px; padding:12px 14px; transition:background .2s; }
  .stat:hover { background:var(--card3); }
  .stat b { display:block; font-size:21px; letter-spacing:-.4px; font-weight:800; } .stat span { font-size:12px; color:var(--sec); }
  .badge { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; padding:3px 8px;
    border-radius:99px; background:var(--card3); color:var(--sec); vertical-align:middle; }
  .badge.meta { background:rgba(34,211,238,.14); color:var(--acc); } .badge.gem { background:rgba(192,132,252,.16); color:var(--purple); }
  .badge.mu { background:rgba(251,191,36,.15); color:var(--orange); } .badge.team { background:rgba(52,211,153,.15); color:var(--green); }
  .tier { display:inline-grid; place-items:center; min-width:30px; height:30px; padding:0 8px; border-radius:9px; font-weight:900; font-size:14px; color:#071018; }
  .tier.S { background:linear-gradient(135deg,#fde68a,#f59e0b); } .tier.A { background:linear-gradient(135deg,#a5f3fc,#22d3ee); }
  .tier.B { background:linear-gradient(135deg,#bbf7d0,#34d399); } .tier.C { background:#94a3b8; } .tier.D { background:#64748b; }
  .item { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--sep); }
  .item:last-child { border:0; } .item .n { font-weight:700; } .item .w { color:var(--sec); font-size:12.5px; margin-top:1px; }
  .num { width:26px; height:26px; flex:none; border-radius:9px; background:var(--card3); display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--txt); }
  .btn { white-space:nowrap; border:0; background:var(--grad); color:#061018; font:inherit; font-weight:800; font-size:13.5px; padding:10px 18px; border-radius:12px; cursor:pointer;
    box-shadow:0 8px 24px rgba(34,211,238,.22); transition:transform .15s var(--ease), box-shadow .2s, filter .2s; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.08); } .btn:active { transform:translateY(0) scale(.98); }
  .btn.sec { background:var(--card3); color:var(--txt); box-shadow:none; border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; transform:none; }
  .meter { height:7px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:7px; }
  .meter i { display:block; height:100%; border-radius:99px; transition:width .7s var(--ease); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:99px; background:var(--card3); border:1px solid var(--sep); cursor:default; transition:background .2s, border-color .2s; }
  .chip.on, button.chip.on { background:rgba(34,211,238,.16); border-color:rgba(34,211,238,.45); color:var(--acc); }
  button.chip { color:var(--txt); font-family:inherit; cursor:pointer; } button.chip:hover { border-color:var(--line); background:var(--card2); }
  .empty { text-align:center; padding:40px 20px; color:var(--sec); }
  .empty .ico { font-size:38px; margin-bottom:10px; filter:drop-shadow(0 6px 18px rgba(34,211,238,.35)); }
  .empty b { color:var(--txt); display:block; font-size:17px; margin-bottom:6px; }
  ul.clean { list-style:none; padding:0; margin:0; }
  ul.clean li { padding:8px 0; border-bottom:1px solid var(--sep); } ul.clean li:last-child { border:0; }
  .click { cursor:pointer; transition:opacity .15s, background .15s; } .click:hover { opacity:.85; }
  .sel { color:var(--acc); font-weight:700; }
  .two { display:grid; grid-template-columns:minmax(260px,360px) 1fr; gap:24px; align-items:start; }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } .title { font-size:27px; } }
  label.f { display:block; margin:14px 0 5px; font-weight:700; font-size:13px; color:var(--sec); }
  input, select { font:inherit; color:var(--txt); }
  input.f, select.f, .card input:not([type=checkbox]):not([type=range]), .card select { width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
    background:rgba(0,0,0,.25); color:var(--txt); outline:none; transition:border-color .2s, box-shadow .2s; }
  input:focus, select:focus { border-color:rgba(34,211,238,.6) !important; box-shadow:0 0 0 4px rgba(34,211,238,.12); }
  select option { background:#0b0f1a; }
  .switch { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--sep); }
  .switch input { width:46px; height:26px; appearance:none; background:var(--card3); border-radius:99px; position:relative; cursor:pointer; transition:.25s var(--ease); border:1px solid var(--line); }
  .switch input:checked { background:var(--green); }
  .switch input::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.25s var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked::after { left:22px; }
  .switch input[type=range] { appearance:auto; -webkit-appearance:auto; width:200px; height:auto; background:none; border:0; accent-color:var(--acc); }
  .switch input[type=range]::after { display:none; }
  .err { background:rgba(251,113,133,.12); color:var(--red); border:1px solid rgba(251,113,133,.3); border-radius:14px; padding:11px 15px; margin-bottom:18px; display:none; }
  video { width:100%; border-radius:14px; background:#000; display:block; max-height:72vh; }
  .vwrap { position:relative; }
  .vwrap .fsbtn { position:absolute; top:10px; right:10px; z-index:2; opacity:.85; }
  .cinema { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.94); display:flex; flex-direction:column; padding:18px; gap:10px; }
  .cinema video { flex:1; max-height:none; height:100%; object-fit:contain; border-radius:10px; }
  details summary { cursor:pointer; color:var(--sec); font-weight:600; }
  img { image-rendering:auto; }

  /* ---------- coach & meta components */
  .hero { display:grid; grid-template-columns:auto 1fr auto; gap:26px; align-items:center; }
  @media (max-width:760px) { .hero { grid-template-columns:1fr; } }
  .ring { position:relative; width:128px; height:128px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { transition:stroke-dashoffset 1s var(--ease); }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:34px; font-weight:900; letter-spacing:-1px; }
  .ringw { display:flex; flex-direction:column; align-items:center; gap:8px; flex:none; }
  .ringl { text-align:center; font-size:11px; line-height:1.3; color:var(--sec); font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .focus { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .fcard { position:relative; border-radius:18px; padding:18px 18px 16px; background:linear-gradient(160deg,rgba(34,211,238,.10),rgba(129,140,248,.05) 50%,rgba(255,255,255,.02)); border:1px solid rgba(34,211,238,.22); }
  .fcard .k { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); }
  .fcard h4 { margin:4px 0 8px; font-size:19px; letter-spacing:-.3px; }
  .fcard .drill { background:rgba(0,0,0,.25); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:13px; border:1px solid var(--sep); }
  .pbar { display:grid; grid-template-columns:1fr auto; gap:5px 10px; padding:7px 0; align-items:center; }
  .pbar .lab { font-size:13px; font-weight:600; } .pbar .track { grid-column:1/-1; height:8px; border-radius:99px; background:rgba(255,255,255,.06); position:relative; overflow:hidden; }
  .pbar .track i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .8s var(--ease); }
  .pbar .track::after { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:rgba(255,255,255,.25); }
  .pbar .val { text-align:right; font-size:12.5px; white-space:nowrap; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:110px; padding-top:6px; }
  .bars i { flex:1; border-radius:6px 6px 2px 2px; min-height:4px; transition:height .7s var(--ease); opacity:.9; }
  .bars i:hover { opacity:1; filter:brightness(1.2); }
  .tl { width:100%; border-collapse:collapse; }
  .tl th { text-align:left; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--sec); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--sep); }
  .tl td { padding:9px 10px; border-bottom:1px solid var(--sep); vertical-align:middle; }
  .tl tr.click:hover td { background:rgba(255,255,255,.035); }
  .champ { display:flex; align-items:center; gap:10px; font-weight:700; }
  .runes { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .rtree h5 { margin:0 0 8px; display:flex; align-items:center; gap:8px; font-size:14px; }
  .rrow { display:flex; gap:10px; justify-content:center; padding:7px 0; border-bottom:1px dashed var(--sep); }
  .rrow:last-child { border:0; }
  .rune { border-radius:50%; transition:filter .2s, opacity .2s, transform .2s; }
  .rune.off { filter:grayscale(1) brightness(.6); opacity:.45; }
  .rune.on { box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(245,196,81,.45); transform:scale(1.06); }
  .build { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .build .arr { color:var(--sec); font-size:18px; }
  .ibox { position:relative; text-align:center; width:68px; }
  .ibox small { display:block; font-size:10.5px; color:var(--sec); margin-top:3px; line-height:1.2; }
  .skills { display:flex; gap:8px; align-items:center; }
  .skey { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:900; background:var(--card3); border:1px solid var(--line); }
  .skey.q { color:var(--acc); } .skey.w { color:var(--green); } .skey.e { color:var(--purple); }
  .search { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .skel { background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)); background-size:200% 100%;
    animation:sh 1.2s linear infinite; border-radius:12px; min-height:16px; }
  @keyframes sh { to { background-position:-200% 0; } }
  .steps { counter-reset:s; display:grid; gap:10px; }
  .steps div { counter-increment:s; display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:14px; background:var(--card2); border:1px solid var(--sep); }
  .steps div::before { content:counter(s); width:26px; height:26px; flex:none; border-radius:9px; background:var(--grad); color:#061018; display:grid; place-items:center; font-weight:900; font-size:13px; }
  .duel { display:flex; align-items:center; gap:10px; }
  .duel .track { flex:1; height:12px; border-radius:99px; background:linear-gradient(90deg,var(--red),rgba(255,255,255,.12) 50%,var(--green)); position:relative; }
  .duel .track i { position:absolute; top:-5px; width:4px; height:22px; border-radius:3px; background:#fff; box-shadow:0 0 12px #fff; transition:left .8s var(--ease); }

  /* ================= v1.5 launcher design ================= */
  :root { --bg:#070a12; --panel:#0c111d; --card:#111726; --card2:rgba(255,255,255,.045); --card3:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.08); --sep:rgba(255,255,255,.06); --r:22px;
    --grad:linear-gradient(135deg,#34d399 0%,#22d3ee 45%,#818cf8 100%); --acc:#2dd4bf; --shadow:0 18px 50px rgba(0,0,0,.45); }
  body::before { background:radial-gradient(1000px 520px at 70% -12%, rgba(45,212,191,.13), transparent 60%),
    radial-gradient(800px 600px at -10% 110%, rgba(129,140,248,.10), transparent 60%); }
  .shell { grid-template-columns:240px minmax(0,1fr) 330px; }
  @media (max-width:1380px) { .shell { grid-template-columns:240px minmax(0,1fr); } .rail { display:none !important; } }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:20px 14px; gap:14px; }
  .logo { padding:2px 6px 8px; font-size:16.5px; }
  .logo-m { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; box-shadow:0 8px 26px rgba(45,212,191,.22); }
  .nsec { font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#5d6680; padding:12px 12px 4px; }
  nav#nav { gap:2px; overflow:auto; }

<script>

let view = "profile", profData = null, profQuery = "", profQueue = "all", profLoading = false, profErr = "",

const gStart = g => g.game_start || (g.deep || {}).game_start || 0;

async function loadReviewData() { try { const r = await getJson("/api/review-data"); reviewData = r && r.games ? sortReview(r) : null; if (view === "analyse") render(); } catch (e) {} }

  labForm = {champ: $("#lab-champ").value.trim(), role: $("#lab-role").value, enemies: $("#lab-enemies").value, msg: "Rechne …"};
  labData = null; render();
  try {
    const q = new URLSearchParams({champ: labForm.champ, role: labForm.role, enemies: labForm.enemies.split(",").map(x => x.trim()).filter(Boolean).join(",")});
    const r = await fetch("/api/sim?" + q); const j = await r.json();

}
const $ = s => document.querySelector(s);

const ptsCol = v => v >= 70 ? "green" : v >= 55 ? "acc" : v >= 40 ? "orange" : "red";

function moosiSays() {
  const c = coachData, ph = state.live ? "InGame" : state.phase;
  if (ph === "InGame") return ["Im Spiel", "Ich schaue mit. Die wichtigsten Hinweise stehen im Overlay – Strg+Shift+J blendet es ein/aus.", "happy"];
  if (ph === "ChampSelect") return ["Champ Select", "Build-Pfad und Runen sind bereit – schau in Champ Select.", "proud"];
  if ((state.review_status || {}).running) return ["Ich analysiere", "Deine letzten Games werden gerade ausgewertet …", "sleepy"];
  if (c && c.session_task && view !== "coach") return ["Deine Aufgabe", `${c.session_task.title}: ${c.session_task.drill}`, c.score >= 60 ? "proud" : "happy"];
  if (c && c.ready && view === "coach") {
    const fl = ((friendsData || {}).friends || []).filter(f => (f.presence || {}).status === "ingame");
    if (fl.length) return ["Freunde im Spiel", `${fl.map(f => f.riot_id.split("#")[0]).join(", ")} spielt gerade – danach kann ich das Game analysieren.`, "happy"];
    if (c.consistency && c.consistency.wobbly) return ["Tipp", `Am meisten schwankt bei dir ${c.consistency.wobbly.label}. Gleicher Start in jedem Game hilft.`, "happy"];
  }
  if (c && c.tilt && c.tilt.rule) return ["Kurz Pause?", c.tilt.rule, "worried"];
  return ["Hi, ich bin Moosi!", "Spiel ein Game – danach sage ich dir, woran du als Nächstes arbeitest.", "happy"];
}

// ranking like in the mobile app: you + friends, sortable
let frSort = "rank";
const TIER_ORD = ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND", "MASTER", "GRANDMASTER", "CHALLENGER"];
const DIV_ORD = {IV: 0, III: 1, II: 2, I: 3};
const rankVal = r => r ? TIER_ORD.indexOf(r.tier) * 400 + (DIV_ORD[r.division] || 0) * 100 + (r.lp || 0) : -1;
function friendsRanking(fl) {
  const ownId = (friendsData && friendsData.me && friendsData.me.riot_id) || state.account || (cfgData || {}).riot_id;
  const me = (friendsData && friendsData.me) || (ownId ? {me: true, riot_id: ownId, loading: true, presence: {status: "online"}} : null);
  const rows = [...(me ? [me] : []), ...fl.filter(f => !me || f.riot_id.toLowerCase() !== me.riot_id.toLowerCase())];
  if (!rows.length) return "";
  const wr = f => f.recent && f.recent.games ? Math.round(100 * f.recent.wins / f.recent.games) : null;
  const key = {rank: f => rankVal(f.rank), score: f => (f.recent || {}).score ?? -1, wr: f => wr(f) ?? -1, kda: f => +((f.recent || {}).kda ?? -1)}[frSort];
  rows.sort((a, b) => key(b) - key(a));
  const S_ = [["rank", "Rang"], ["score", "Moosi-Score"], ["wr", "Winrate"], ["kda", "KDA"]];
  return `<div class="card wide frank"><div class="row" style="border:0;padding:0 0 10px"><div><h3 style="margin:0">Rangliste</h3><span class="small muted">Score: bis zu 10 bewertbare aus den letzten 20 Matches · alle Queues</span></div>
      <div class="seg" style="margin-left:auto">${S_.map(([k, l]) => `<button class="${frSort === k ? "on" : ""}" onclick="frSort='${k}';render()">${l}</button>`).join("")}</div></div>
    <table class="pa-tab fr-tab"><tr><th>#</th><th>Spieler</th><th>Rang</th><th>Moosi-Score</th><th>WR (20)</th><th>KDA</th></tr>
    ${rows.map((f, i) => { const st = (f.presence || {}).status, w = wr(f), sc = (f.recent || {}).score;
      return `<tr class="${f.me ? "mine" : "click"}" ${f.me ? "" : `onclick='openFriend(${JSON.stringify(f.riot_id)})'`}><td><b>${i === 0 ? "👑" : i + 1}</b></td>
        <td><span class="dot ${st === "online" || st === "ingame" ? "on" : ""}"></span> <b>${esc((f.jc && f.jc.name) || String(f.riot_id).split("#")[0])}</b>${f.me ? ' <span class="muted small">(du)</span>' : ""}${st === "ingame" ? ' <span class="green small">im Spiel</span>' : ""}</td>
        <td>${f.loading ? '<span class="muted">Lädt …</span>' : f.error ? `<span class="red">${esc(f.error)}</span>` : f.rank ? rankTxt(f.rank) : '<span class="muted">Unranked</span>'}</td>
        <td><b style="color:${sc != null ? paCol(sc) : "inherit"}">${sc != null ? sc.toFixed(1) : "–"}</b></td>
        <td class="${w == null ? "" : w >= 50 ? "green" : "red"}">${w ?? "–"}${w == null ? "" : "%"}</td><td>${(f.recent || {}).kda ?? "–"}</td></tr>`; }).join("")}</table></div>`;
}
function renderFriendDetail(rid) {
  const f = ((friendsData || {}).friends || []).find(x => x.riot_id === rid) || {riot_id: rid}, fc = friendCoach[rid] || {};
  const top = (f.top || [])[0];
  let h = `<div class="hero-banner"><div class="art" style="background-image:url('${top ? splash(top) : ""}')"></div><div class="in">
    ${profIcon(f.icon, 96)}<div><span class="tag">${esc(PRES[(f.presence || {}).status] || "Freund")}</span><h2>${esc(rid.split("#")[0])}<span class="muted" style="font-size:22px"> #${esc(rid.split("#")[1] || "")}</span></h2>
      <p>${f.rank ? rankTxt(f.rank) + ` · ${f.rank.winrate}% Saison-WR` : "Unranked"}${f.role ? " · " + esc(f.role) : ""}</p>
      <div class="meta">${(f.top || []).map(c => `<span>${esc(c)}</span>`).join("")}</div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn" onclick='friendCoachLoad(${JSON.stringify(rid)}, true)' ${fc.status === "running" ? "disabled" : ""}>${fc.status === "running" ? "Analysiert …" : fc.plan ? "Neu analysieren" : "Mit Moosi analysieren"}</button>
      <button class="btn sec" onclick='friendProfile(${JSON.stringify(rid)})'>Profil & Match-Historie</button>
      <button class="btn sec" onclick='removeFriend(${JSON.stringify(rid)})'>Entfernen</button></div></div></div>`;
  if (fc.status === "running") h += card("", "", `<div style="display:flex;gap:16px;align-items:center">${moosi("sleepy", 70)}<div><b>Moosi analysiert ${esc(rid.split("#")[0])}s letzte Ranked-Games …</b><p class="muted small">Das dauert je nach Anzahl neuer Games ca. 20–60 Sekunden.</p></div></div>`, true);
  else if (fc.status === "error") h += card("Analyse fehlgeschlagen", esc(fc.error || ""), "", true);
  let body = `<div class="grid">${h}</div>`;
  if (fc.plan && fc.plan.ready) body += coachBody(fc.plan, rid.split("#")[0]);
  else if (fc.plan && !fc.plan.ready) body += `<div class="grid">${card("", "", `<p class="muted">${esc(fc.plan.reason || "")}</p>`, true)}</div>`;
  return `<div class="search" style="margin-bottom:14px"><button class="btn sec" onclick="friendView=null;render()">‹ Alle Freunde</button></div>${body}`;
}

function lineChart(vals, labels, opts = {}) {
  if (!vals || vals.length < 2) return '<span class="muted small">Noch zu wenige Datenpunkte – kommt nach ein paar Games.</span>';
  const W = 560, H = opts.h || 150, lo = Math.min(...vals, opts.zero ? -Math.max(...vals.map(Math.abs)) : Infinity), hi = Math.max(...vals, opts.zero ? Math.max(...vals.map(Math.abs)) : -Infinity);
  const span = hi - lo || 1, x = i => i / (vals.length - 1) * W, y = v => H - 6 - (v - lo) / span * (H - 12);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const base = opts.zero ? y(0) : H;
  return `<svg viewBox="0 0 ${W} ${H + 18}" style="width:100%">
    ${opts.zero ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--sep)"/>` : ""}
    <polygon points="0,${base} ${pts} ${W},${base}" fill="var(--acc)" opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>

}

async function loadProfile(extra) {
  profLoading = !profData; profErr = ""; if (view === "profile") render();
  if (!cfgData) await loadCfg();
  const q = new URLSearchParams(); if (profQuery) q.set("riot_id", profQuery); q.set("queue", profQueue || "all");
  if (extra) for (const [k, v] of Object.entries(extra)) q.set(k, v);
  try { const r = await getJson("/api/profile?" + q); if (r.error) profErr = r.error; else profData = r; } catch (e) { profErr = "App-Server nicht erreichbar"; }
  profLoading = false; if (view === "profile") render();
  if (profData && profData.stale && !extra) {  // shown instantly from disk – pick up the fresh version quietly
    clearTimeout(loadProfile._t);
    let tries = 0;
    const again = async () => {
      try { const r = await getJson("/api/profile?" + q); if (!r.error) { profData = r; if (view === "profile") render(); } if (r.stale && ++tries < 10) loadProfile._t = setTimeout(again, 3000); } catch (e) {}
    };
    loadProfile._t = setTimeout(again, 3000);
  }
}
function setQueue(q) { profQueue = q; histChamp = histRole = histResult = ""; loadProfile(); }
async function moreGames() { await loadProfile({more: 1}); }
async function loadAllGames() {
  await loadProfile({all: 1});
  clearInterval(allTimer);
  allTimer = setInterval(async () => {
    await loadProfile();
    if (!(profData && profData.load_all && profData.load_all.running)) clearInterval(allTimer);
  }, 4000);
}

// ------------------------------------------------------------ LIVE
let livePlayers = new Map(), livePlayerBusy = false;
async function loadLivePlayers() {
  if (livePlayerBusy || view !== "live") return;
  const roster = state.live && state.live.roster;
  if (!roster) return;
  const next = [...roster.enemies, ...roster.allies].find(p => p.riot_id && !livePlayers.has(p.riot_id));
  if (!next) return;
  livePlayerBusy = true;
  const session = livePlayers;
  session.set(next.riot_id, {loading:true});
  try {
    const response = await fetch("/api/live-player?riot_id=" + encodeURIComponent(next.riot_id), {signal: AbortSignal.timeout(25000)});
    const data = await response.json();
    session.set(next.riot_id, response.ok ? data : {error:true});
  } catch(e) {
    session.set(next.riot_id, {error:true});
  } finally {
    livePlayerBusy = false;
    if (view === "live") render();
    setTimeout(loadLivePlayers, 400);
  }
}
function rosterForm(games) {
  const valid = (games || []).filter(g => !g.remake);
  if (!valid.length) return "";
  const wins = valid.filter(g => g.win).length;
  const marks = valid.slice().reverse().map(g => {
    const score = Number.isFinite(g.score) ? " · Moosi " + g.score.toFixed(1) + "/10" : "";
    const title = [g.champion, g.win ? "Sieg" : "Niederlage"].filter(Boolean).join(" · ") + score;
    return '<span class="' + (g.win ? "green" : "red") + '" title="' + esc(title) + '">' + (g.win ? "S" : "N") + '</span>';
  }).join("");
  return '<div class="roster-form" aria-label="Spielverlauf, ältestes Match zuerst">' + marks + '</div>' +
    '<div class="small muted">' + wins + ' Siege · ' + (valid.length - wins) + ' Niederlagen aus ' + valid.length + ' Matches</div>';
}
function rosterWeaknesses(analysis) {
  if (!analysis || !analysis.weaknesses.length) return "";
  return '<div class="roster-focus">' + analysis.weaknesses.map(skill =>
    '<span title="Moosi-Richtwert: 5,5">' + esc(skill.label) + ' <b>' + skill.v.toFixed(1) + ' / 10</b></span>'
  ).join("") + '</div>';
}
function liveRoster(roster) {
  if (!roster) return "";
  const roleOrder = ["TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"];
  const laneOrder = players => players.slice().sort((a, b) => (roleOrder.includes(a.role) ? roleOrder.indexOf(a.role) : 5) - (roleOrder.includes(b.role) ? roleOrder.indexOf(b.role) : 5));
  const columns = [["Dein Team", laneOrder(roster.allies)], ["Gegner", laneOrder(roster.enemies)]];
  return card("Spielerübersicht", "Solo/Duo-Rang und Auffälligkeiten aus bis zu 10 aktuellen Matches", '<div class="roster-grid">' + columns.map(([label, players]) =>
    '<section><h3>' + label + '</h3>' + players.map(p => {
      const data = livePlayers.get(p.riot_id);
      const rank = data && data.ranks && data.ranks.solo;
      const analysis = data && data.games ? playerAnalysis(data.games) : null;
      const rankLabel = rank ? [rank.tier, rank.division, rank.lp + " LP"].join(" · ") : data && data.ranks ? "Solo/Duo: ohne Rang" : "Rang nicht verfügbar";
      const notes = !p.riot_id ? "Riot-ID nicht sichtbar" : !data || data.loading ? "Stats werden geladen …" :
        data.error ? "Stats nicht verfügbar" : !analysis ? "Zu wenige bewertbare Matches" :
        analysis.weaknesses.length ? "Unter dem Moosi-Richtwert (5,5)" : "Keine klare Schwäche in " + analysis.n + " Matches";
      return '<div class="fcard" style="margin-bottom:8px"><div style="display:flex;gap:8px;align-items:center">' +
        (p.champion ? cImg(p.champion, 32, 8) : "") + '<div><b>' + esc(p.riot_id || p.champion || "Spieler") + '</b>' +
        '<div class="small muted">' + esc([ROLE_DE[p.role], rankLabel].filter(Boolean).join(" · ")) + '</div></div></div>' +
        rosterForm(data && data.games) + '<p class="small muted" style="margin:8px 0 0">' + esc(notes) + '</p>' + rosterWeaknesses(analysis) + '</div>';
    }).join("") + '</section>').join("") + '</div>', true);
}

let clipFilter = "all";
const vidId = sid => "v_" + String(sid).replace(/[^\w]/g, "_");
function bigVideo(id) {
  const v = document.getElementById(id);
  if (!v) return;
  const t = v.currentTime, src = v.getAttribute("src");
  v.pause();
  const box = document.createElement("div");
  box.className = "cinema";
  box.innerHTML = `<div class="row" style="border:0;padding:0"><span class="muted small">${tr("Esc oder Schließen beendet die Vollbild-Ansicht")} · ← → 5 s · J/L 10 s · K ⏯ · , . Einzelbild</span><button class="btn sec">${tr("Schließen")}</button></div><video id="${id}_big" src="${src}" controls autoplay></video>`;
  const close = () => { const nv = box.querySelector("video"); v.currentTime = nv.currentTime; box.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") close(); };
  box.querySelector("button").onclick = close;
  document.addEventListener("keydown", esc);
  document.body.appendChild(box);
  const nv = box.querySelector("video");
  nv.addEventListener("loadedmetadata", () => { nv.currentTime = t; }, {once: true});
  activeVid = nv.id;
  try { box.requestFullscreen && box.requestFullscreen().catch(() => {}); } catch (e) {}
}
let activeVid = null;
function vctl(id, op, val) {
  const v = document.getElementById(id); if (!v) return;
  activeVid = id;
  if (op === "seek") v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + val));
  else if (op === "rate") { v.playbackRate = val; document.querySelectorAll(`[data-rate-for="${id}"]`).forEach(b => b.classList.toggle("on", +b.dataset.rate === val)); }
  else if (op === "toggle") v.paused ? v.play() : v.pause();
  else if (op === "frame") { v.pause(); v.currentTime = Math.max(0, v.currentTime + val / 30); }
}
document.addEventListener("keydown", e => {  // YouTube-like shortcuts for the clip player
  if (/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).nodeName || "")) return;
  const id = activeVid && document.getElementById(activeVid) ? activeVid : (document.querySelector("video") || {}).id;
  if (!id) return;
  const map = {ArrowLeft: ["seek", -5], ArrowRight: ["seek", 5], j: ["seek", -10], l: ["seek", 10], k: ["toggle"], " ": ["toggle"], ",": ["frame", -1], ".": ["frame", 1]};
  const m = map[e.key]; if (!m) return;
  e.preventDefault(); vctl(id, m[0], m[1]);
});
const kindLabel = c => ({highlight: "Highlight", review: "Prüfen"})[c.kind] || "Fehler";
async function clipFeedback(sid, file, verdict) {
  try {

    render();
  } catch (e) {}
}

// your death causes per game vs. better players (winners one elo bracket higher, same role, from the crawler)
let deathBench, deathBenchLoading = false;
function deathCompareCard(games) {
  const gs = (games || []).filter(g => g.deep && g.deep.death_causes);
  if (!gs.length) return "";
  if (deathBench === undefined && !deathBenchLoading) { deathBenchLoading = true;
    getJson("/api/death-bench?role=JUNGLE").then(r => { deathBench = r.bench || null; deathBenchLoading = false; render(); }).catch(() => { deathBench = null; deathBenchLoading = false; }); }
  const mine = {}; gs.forEach(g => Object.entries(g.deep.death_causes).forEach(([k, n]) => mine[k] = (mine[k] || 0) + n));
  const B = deathBench && deathBench.per_game || {};
  const keys = Object.keys(CAUSE_LBL).filter(k => (mine[k] || 0) > 0 || (B[k] || 0) >= .3);
  const rows = keys.map(k => ({k, me: (mine[k] || 0) / gs.length, them: B[k]})).sort((a, b) => (b.me - (b.them || 0)) - (a.me - (a.them || 0)));
  const max = Math.max(1, ...rows.map(r => Math.max(r.me, r.them || 0)));
  const worst = rows.find(r => r.them != null && r.me - r.them >= .4);
  const costly = gs.reduce((t, g) => t + (g.deep.death_cost || 0), 0) / gs.length;
  return card("Tode: du vs. bessere Spieler", deathBench ? `Tode pro Game nach Ursache · ${gs.length} deiner Games vs. ${esc(deathBench.scope)} (${deathBench.games} Games)` :
      `Tode pro Game nach Ursache · ${gs.length} deiner Games${deathBench === null ? " · Vergleichsdaten sammelt der Meta-Crawler gerade erst" : ""}`, `
    ${rows.map(r => `<div style="padding:7px 0"><div class="row" style="border:0;padding:0"><span>${esc(CAUSE_LBL[r.k])}</span>
      <span class="small"><b class="${r.them != null && r.me - r.them >= .4 ? "red" : ""}">${r.me.toFixed(1)}</b>${r.them != null ? ` <span class="muted">vs ${r.them.toFixed(1)}</span>` : ""}</span></div>
      <div class="meter" style="height:6px"><i style="width:${100 * r.me / max}%;background:var(--orange)"></i></div>
      ${r.them != null ? `<div class="meter" style="height:4px;margin-top:3px"><i style="width:${100 * r.them / max}%;background:var(--green)"></i></div>` : ""}</div>`).join("")}
    <p class="small" style="margin-top:10px">${worst ? `👉 Größter Unterschied: <b>${esc(CAUSE_LBL[worst.k])}</b> – du ${worst.me.toFixed(1)}× pro Game, bessere Spieler ${worst.them.toFixed(1)}×.` : "Kein großer Unterschied zu besseren Spielern bei den Todesursachen."}
      ${costly ? ` Deine Tode kosten im Schnitt ≈ ${Math.round(costly).toLocaleString("de-DE")} Gold-Wert pro Game.` : ""}</p>
    <p class="muted small">Orange = du, grün = bessere Spieler. Ursachen aus Riots Match-Timeline geschätzt (Positionen nur minütlich).</p>`);
}

  level: "Level-Nachteil", vision: "Sicht unklar", jungler: "Gegner-Jungler beteiligt", duel: "Duell-Kontext", unknown: "Ursache offen"};

async function loadCoach() {
  if (loadCoach.busy) return;
  loadCoach.busy = true;
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 45000);
  try {
    const response = await fetch("/api/coach", {signal: controller.signal});
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || data.reason || "Coach nicht erreichbar");
    coachData = data;
  } catch (e) {
    coachData = {ready: false, error: e.name === "AbortError" ? "Die Anfrage dauert zu lange. Bitte erneut versuchen." : e.message};
  } finally {
    clearTimeout(timer); loadCoach.busy = false;
    if (view === "coach") render();
  }
}
function renderCoach() {
  const c = coachData;
  if (c && c.error) return page("Coach", "Der Coaching-Plan konnte nicht geladen werden.",
    card("", "", `<p class="red">${esc(c.error)}</p><button class="btn" onclick="coachData=null;loadCoach();render()">Erneut versuchen</button>`, true));
  if (!c) return page("Coach", "Lade deinen Coaching-Plan …", card("", "", `<div class="skel" style="height:140px"></div>`, true));
  const rs = state.review_status || {};
  if (!c.ready && rs.running) return page("Coach", "Dein Coach analysiert gerade automatisch deine letzten Ranked-Games – alle Rollen.",
    card("", "", `<div class="hero" style="grid-template-columns:auto 1fr">${ring(rs.total ? Math.round(100 * rs.done / rs.total) : 0, "Analyse")}
      <div><div class="big">Analysiere deine Games …</div><p class="muted">${rs.done || 0} von ${rs.total || "?"} Games · ${esc(rs.account || "")}</p>
      <p class="small muted">Jungle-Games werden mit Zeitverlauf (Pfade, Tode, Objectives) analysiert, andere Rollen mit allen Detailwerten. Dauert 1–2 Minuten.</p></div></div>`, true));
  if (!c.ready) return page("Dein <span class='g'>Coach</span>".replace(/<[^>]+>/g, ""), "Persönliche Schwerpunkte, Konstanz und Tilt-Muster – aus deinen echten Games, verglichen mit Spielern deines Champions und Elos.",
    card("", "", empty("🧠", "Noch kein Coaching-Plan", `<p>${esc(c.reason)}</p><button class="btn" onclick="go('analyse');loadReview()">Jetzt Games analysieren</button>`), true));
  return coachBody(c);
}
function progCard(p) {
  if (!p.enough) return `<div class="fcard"><div class="k">${esc(p.title)}</div><p class="muted small" style="margin:8px 0 0">Noch zu wenige Games in den letzten 30 Tagen – der Verlauf füllt sich mit jedem Game.</p></div>`;
  const W = 300, H = 90, pts = p.points, vals = pts.map(x => x.v).concat([p.target]);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const X = t => 8 + (t - t0) / ((t1 - t0) || 1) * (W - 16), Y = v => H - 8 - (v - lo) / span * (H - 16);
  // moving average (5 games) as the trend line
  const ma = pts.map((_, i) => { const w = pts.slice(Math.max(0, i - 4), i + 1); return w.reduce((a, x) => a + x.v, 0) / w.length; });
  const trend = p.better == null ? ["Unverändert", "muted"] : p.better ? ["Wird besser", "green"] : ["Wird schlechter", "red"];
  return `<div class="fcard"><div class="row" style="border:0;padding:0"><div class="k">${esc(p.title)}</div><b class="small ${trend[1]}">${trend[0]}</b></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">
      <line x1="0" x2="${W}" y1="${Y(p.target)}" y2="${Y(p.target)}" stroke="var(--acc)" stroke-dasharray="4 4" opacity=".7"/>
      <polyline points="${pts.map((x, i) => X(x.t) + "," + Y(ma[i])).join(" ")}" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>
      ${pts.map(x => `<circle cx="${X(x.t)}" cy="${Y(x.v)}" r="3.2" fill="${x.win ? "var(--green)" : "var(--red)"}"/>`).join("")}</svg>
    <div class="row small" style="border:0;padding:4px 0 0"><span class="muted">Ziel ${esc(p.target_txt || "")} · im Ziel ${esc(p.hit)}</span><span class="muted">${p.games} Games</span></div></div>`;
}
// session recap on the PC (exact LP from the ranked tracker)
let recapLoad = false;
function pcRecap() {
  if (!rankedData && !recapLoad) { recapLoad = true; getJson("/api/ranked").then(r => { rankedData = r; render(); }).catch(() => {}); }
  const sm = rankedData && rankedData.summary; if (!sm) return "";
  const d = new Date(); d.setHours(5, 0, 0, 0); if (new Date().getHours() < 5) d.setDate(d.getDate() - 1);
  const gs = (sm.recent || []).filter(g => g.ts * 1000 >= d.getTime());
  if (!gs.length) return "";
  const w = gs.filter(g => g.win).length, l = gs.length - w, lp = gs.reduce((t, g) => t + g.lp, 0);
  const mood = w > l ? "proud" : l >= w + 2 ? "worried" : gs.length >= 6 ? "sleepy" : "happy";
  const say = mood === "proud" ? "Starke Session – genau so weiter." : mood === "worried" ? `${l} Niederlagen – kurze Pause, bevor es ein Tilt-Abend wird.`
    : mood === "sleepy" ? `${gs.length} Games heute – die Konzentration lässt nach.` : "Solide Session – bleib bei deiner Aufgabe.";
  return card("Heute", `${gs.length} Ranked-${gs.length === 1 ? "Game" : "Games"} seit 5 Uhr`, `<div style="display:flex;gap:18px;align-items:center">${moosi(mood, 84)}
    <div style="flex:1"><div class="stats" style="margin-top:0"><div class="stat"><b><span class="green">${w}</span> – <span class="red">${l}</span></b><span>Sieg – Niederlage</span></div>
      <div class="stat"><b class="${lp >= 0 ? "green" : "red"}">${lp > 0 ? "+" : ""}${lp}</b><span>LP heute</span></div>
      <div class="stat"><b>${sm.streak > 0 ? sm.streak + "× W" : sm.streak < 0 ? -sm.streak + "× L" : "–"}</b><span>Serie</span></div></div>
      <p class="small" style="margin:10px 0 0">${esc(say)}</p></div></div>`, true);
}

    c.focus.length ? `<div class="focus">${c.focus.map((f, i) => `<div class="fcard"><div class="k">Schwerpunkt ${i + 1}</div><h4>${esc(f.title)}</h4>

  if ((c.progress || []).length) h += card("Fortschritt · 30 Tage", "Wirkt das Coaching? Jeder Punkt ist ein Game (grün = Sieg), die gestrichelte Linie ist dein Ziel.",
    `<div class="focus">${c.progress.map(p => progCard(p)).join("")}</div>`, true);

  return `<div class="grid">${h}</div>`;

async function uploadAvatar(input) {

    let q = 0.85, data = cv.toDataURL("image/jpeg", q);

    card("Kurzbefehle & Infos", "", `<ul class="clean small">

}

// ------------------------------------------------------------ account

async function loadAccount() { try { accData = await getJson("/api/account"); } catch (e) { accData = {server: false}; } if (view === "settings") render(); }

// ------------------------------------------------------------ render + data
let renderedView = null, LANG = "de", LANG_SAVED = null, TR_RE = null;
const NM = x => x ? (LANG === "en" ? (x.name || x.name_de) : (x.name_de || x.name)) : "";
function setLang(l) {
  l = l === "en" ? "en" : "de";
  if (l === LANG && (l === "de" || TR_RE)) return;
  LANG = l; document.documentElement.lang = l;
  const dict = window.I18N_EN || {};
  const keys = Object.keys(dict).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  TR_RE = keys.length ? new RegExp("(?<![\\p{L}\\d])(" + keys.join("|") + ")(?![\\p{L}])", "gu") : null;
  translateTree(document.querySelector("aside")); renderedView = null; render();
}
const tr = t => (LANG === "en" && TR_RE && t && /[A-Za-zÄÖÜäöüß]/.test(t)) ? t.replace(TR_RE, m => window.I18N_EN[m] ?? m) : t;
function translateTree(root) {
  if (LANG !== "en" || !root || !TR_RE) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = w.currentNode; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
    else for (const a of ["placeholder", "title"]) if (n.hasAttribute && n.hasAttribute(a)) n.setAttribute(a, tr(n.getAttribute(a)));
  }
}
function morphAttrs(a, b) {
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
}
function morph(a, b) {   // update DOM a to look like b without rebuilding it: no flicker, keeps focus/scroll/video
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++) {
    const x = ac[i], y = bc[i];
    if (!x) { a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === 3 || x.nodeType === 8) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeName === "VIDEO" && x.getAttribute("src") === y.getAttribute("src")) continue;
    const focused = x === document.activeElement && /INPUT|SELECT|TEXTAREA/.test(x.nodeName);
    if (!focused) morphAttrs(x, y);
    if (/INPUT|TEXTAREA/.test(x.nodeName)) { if (!focused && x.value !== (y.getAttribute("value") ?? "")) x.value = y.getAttribute("value") ?? ""; continue; }
    if (x.nodeName === "SELECT" && focused) continue;
    morph(x, y);
    if (x.nodeName === "SELECT") { const o = [...y.options].find(o => o.hasAttribute("selected")); if (o && !focused) x.value = o.value; }
  }
  for (let i = ac.length - 1; i >= bc.length; i--) a.removeChild(ac[i]);
}
// stagger list items and count numbers up when a view appears
const RM = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  const t = el.textContent, m = t.match(/^(\D{0,2}?)(\d+(?:[.,]\d+)?)(.*)$/s);
  if (!m || RM()) return;
  const dec = (m[2].split(/[.,]/)[1] || "").length, sep = m[2].includes(",") ? "," : ".", end = parseFloat(m[2].replace(",", "."));
  if (!isFinite(end) || end === 0) return;
  const t0 = performance.now(), dur = 650 + Math.min(400, end * 2);
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = m[1] + (end * e).toFixed(dec).replace(".", sep) + m[3]; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function motionIn(root) {
  if (RM()) return;
  let i = 0; root.querySelectorAll(".stat, .row, tr, .lb, .fcard").forEach(el => el.style.setProperty("--i", Math.min(i++, 18)));
  root.querySelectorAll(".stat b, .ring b, .big").forEach(el => { if (!el.children.length) countUp(el); });
}
function render() {
  const ph = state.phase || "…";
  const label = {InGame: "Im Spiel", ChampSelect: "Champ Select", Lobby: "Lobby", None: "Client bereit", Matchmaking: "Suche läuft", ReadyCheck: "Match gefunden", EndOfGame: "Spielende"}[ph] || ph;
  $("#stxt").textContent = label; $("#sdot").classList.toggle("on", !/nicht gefunden|Startet/.test(ph));
  $("#rec").style.display = state.recording ? "flex" : "none";
  $("#err").style.display = state.error ? "block" : "none"; $("#err").textContent = tr(state.error || "");
  $("#stxt").textContent = tr($("#stxt").textContent);
  $("#tright").innerHTML = tr(topRight()); renderRail();
  const R = {friends: renderFriends, coach: renderCoach, profile: renderProfile, ranked: renderRanked, select: renderSelect, live: renderLive, analyse: renderAnalyse, meta: renderMeta, settings: renderSettings};
  const gate = needsOnboarding();
  const html = (view !== "settings" ? updateCard() : "") + (gate ? renderOnboarding() : R[view]());
  const vkey = gate ? "onboarding" : view;
  const main = $("#main");
  const tmp = document.createElement("div"); tmp.innerHTML = html; translateTree(tmp);
  if (renderedView !== vkey) {
    main.replaceChildren(...tmp.childNodes); renderedView = vkey; window.scrollTo({top: 0});
    main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter"); motionIn(main);
    clearTimeout(render._t); render._t = setTimeout(() => main.classList.remove("enter"), 900);
  } else {
    morph(main, tmp);
  }
}
async function tick() {
  if (document.hidden && Date.now() - (tick._t || 0) < 8000) return;  // window in background (e.g. in game): poll rarely
  tick._t = Date.now();
  let txt;
  try { txt = await (await fetch("/api/state")).text(); } catch (e) { txt = JSON.stringify({...state, error: "App-Server nicht erreichbar"}); }
  if (txt === lastJson) return;
  lastJson = txt; state = JSON.parse(txt);
  if (state.lang && state.lang !== LANG) setLang(state.lang);
  const rsNow = JSON.stringify(state.review_status || {});
  if (rsNow !== tick._rs) { const was = tick._rs; tick._rs = rsNow; if (was && !(state.review_status || {}).running) { coachData = null; loadCoach(); loadReviewData(); } }
  const ph = state.live ? "InGame" : state.phase;          // auto-switch on phase change only
  if (ph !== lastPhase) {
    if (ph === "ChampSelect") go("select"); else if (ph === "GameStart" || ph === "InGame") go("live");
    if (ph !== "InGame" && ph !== "GameStart") livePlayers = new Map();
    else if ((ph === "EndOfGame" || ph === "PreEndOfGame") && lastPhase === "InGame") { go("coach"); }
    lastPhase = ph;
  }
  if (view === "live") loadLivePlayers();
  if (view !== "settings") render();
}
const getJson = async u => (await fetch(u)).json();
async function loadRanked() { try { rankedData = await getJson("/api/ranked" + (rankedAccount ? "?account=" + encodeURIComponent(rankedAccount) : "")); if (view === "ranked") render(); } catch (e) {} }
async function loadMeta() { try { metaData = await getJson("/api/meta"); if (view === "meta") render(); } catch (e) {} }
async function loadCfg() { try { cfgData = await getJson("/api/config"); if (cfgData.main_role) tierRole = tierRole === "JUNGLE" ? cfgData.main_role : tierRole; if (!cfgData.main_role && !onb.mains.length) onb.mains = (cfgData.champion_pool || []).slice(0, 2);
  if (view === "settings" || !cfgData.main_role) render(); } catch (e) {} }
async function loadChampList() { try { champList = await getJson("/api/champions"); if (needsOnboarding()) render(); } catch (e) {} }
async function loadSessions() { try { const s = await getJson("/api/sessions"); if (JSON.stringify(s) !== JSON.stringify(sessions)) { sessions = s; if (view === "analyse") render(); } } catch (e) {} }
async function applyRunes() { const r = await (await fetch("/api/apply-runes", {method: "POST"})).json(); msg.runes = r.error || "Runen gesetzt ✓"; render(); }
async function crawl() { const r = await (await fetch("/api/meta/crawl", {method: "POST"})).json(); if (r.error) alertMsg(r.error); loadMeta(); }
function alertMsg(t) { state.error = t; render(); }
async function loadReview() {
  msg.review = "Lade Games… (ca. 1 Minute)"; render();
  const r = await getJson("/api/review"); msg.review = r.error || "";
  if (!r.error) { reviewData = sortReview(r); selGame = 0; anPage = 0; loadRanked(); coachData = null; loadCoach(); }
  render();
}
async function saveCfg() {
  const body = {riot_id: $("#s_riot").value.trim(), platform: $("#s_platform").value, champion_pool: poolSel.slice(),
    language: $("#s_lang").value, main_role: $("#s_role").value, meta_bracket: $("#s_bracket").value, auto_import_runes: $("#s_auto").checked, review_games: +$("#s_games").value || 20, profile_games: +$("#s_pgames").value || 20};
  if ($("#s_key").value.trim()) body.riot_api_key = $("#s_key").value.trim();
  const r = await (await fetch("/api/config", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();
  msg.cfg = r.ok ? "Gespeichert ✓" : "Fehler beim Speichern"; await loadCfg(); profData = null; profErr = "";
  if (r.ok && (body.language || "") !== (LANG_SAVED ?? "")) msg.cfg += " – App neu starten, um die Sprache komplett zu wechseln / restart the app to switch language completely";
  LANG_SAVED = body.language || ""; setLang(body.language || state.lang);
}
async function testKey() {
  const k = ($("#s_key") || {}).value || "";
  msg.test = [{ok: true, text: "Teste…"}]; render();
  const r = await (await fetch("/api/test-key", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({riot_api_key: k.trim()})})).json();

function togglePlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; render(); return; }
  if (replayMin >= 15) replayMin = 0;
  playTimer = setInterval(() => { replayMin++; if (replayMin >= 15) { clearInterval(playTimer); playTimer = null; } render(); }, 700);
  render();
}
setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 3600000);
loadCfg(); loadChampList(); loadFriends(); loadMyProfile(); go("coach"); tick();
