<!DOCTYPE html>
<html lang="de">
<head>

<title>Moosi</title>
<style>
  :root { --bg:#070a12; --card:#111726; --card2:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --txt:#eef2ff; --sec:#8b93a7;
    --acc:#2dd4bf; --grad:linear-gradient(135deg,#34d399 0%,#22d3ee 45%,#818cf8 100%); --green:#34d399; --red:#fb7185; --orange:#fbbf24; --gold:#f5c451; --purple:#c084fc;
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body::before { content:""; position:fixed; inset:0; z-index:-1; background:radial-gradient(600px 400px at 90% -10%, rgba(45,212,191,.16), transparent 60%), radial-gradient(500px 400px at -10% 100%, rgba(129,140,248,.12), transparent 60%); }
  #app { padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px); max-width:560px; margin:0 auto; }
  h1 { font-size:30px; letter-spacing:-.7px; margin:6px 0 4px; font-weight:800; }

  .card h3 { margin:0 0 10px; font-size:16px; letter-spacing:-.2px; }

  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:16px; padding:15px; font:inherit; font-weight:800; font-size:16px; color:#061018; background:var(--grad); }
  .btn.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .btn:active { transform:scale(.98); }

  input:focus { border-color:rgba(45,212,191,.6); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--sec); margin:12px 0 6px; }
  .tabs { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-around; padding:8px 8px calc(var(--safe-b) + 8px);
    background:rgba(9,12,20,.82); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--line); z-index:20; }
  .tabs button { flex:1; border:0; background:none; color:#6b7590; font:inherit; font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; }
  .tabs button.on { color:var(--acc); }
  .hero { position:relative; overflow:hidden; border-radius:26px; padding:18px; margin-bottom:14px; border:1px solid var(--line); background:#0d1322; min-height:200px; }
  .hero .art { position:absolute; inset:0; background-size:cover; background-position:65% 20%; }

  .tag { display:inline-flex; align-self:flex-start; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--acc); background:rgba(45,212,191,.14); border:1px solid rgba(45,212,191,.3); padding:4px 9px; border-radius:99px; }
  .hero h2 { font-size:30px; margin:8px 0 2px; letter-spacing:-.8px; line-height:1.1; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; letter-spacing:-.4px; } .stat span { font-size:11.5px; color:var(--sec); }
  .bubble { flex:1; background:rgba(5,8,15,.55); border:1px solid var(--line); border-radius:18px 18px 18px 4px; padding:12px 14px; font-size:14px; }
  .bubble b { display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); margin-bottom:3px; }
  .moosi-card { display:flex; gap:10px; align-items:flex-end; background:linear-gradient(160deg,rgba(45,212,191,.16),rgba(129,140,248,.08)); border-color:rgba(45,212,191,.3); }
  .moosi { flex:none; animation:bob 3.2s ease-in-out infinite; transform-origin:50% 100%; filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  @keyframes bob { 50% { transform:translateY(-3px) scale(1.02,.98); } }
  .game { display:flex; gap:12px; align-items:center; padding:12px; border-radius:18px; background:var(--card); border:1px solid var(--line); margin-bottom:10px; position:relative; overflow:hidden; }
  .game::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); }
  .game.win::before { background:var(--green); }
  .game img.c { width:48px; height:48px; border-radius:14px; flex:none; }
  .game .k { font-weight:800; font-size:16px; } .game .meta { font-size:12px; color:var(--sec); }
  .items { display:flex; gap:3px; margin-top:6px; } .items img, .items i { width:22px; height:22px; border-radius:6px; background:var(--card2); display:block; }

  .dots { display:flex; gap:5px; } .dots i { width:14px; height:14px; border-radius:5px; background:var(--red); } .dots i.w { background:var(--green); }
  .fr { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .fr:last-child { border:0; } .fr img { width:44px; height:44px; border-radius:13px; } .fr b { display:block; }
  .chev { margin-left:auto; color:#4b5563; font-size:20px; }
  .sheet { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; animation:fade .2s; }
  .sheet .in { width:100%; max-height:88vh; overflow:auto; background:#0c111d; border-radius:26px 26px 0 0; border-top:1px solid var(--line); padding:10px 16px calc(var(--safe-b) + 24px); animation:up .28s cubic-bezier(.2,.8,.2,1); }
  .grip { width:40px; height:5px; border-radius:9px; background:#2b3550; margin:4px auto 12px; }
  .sheet { cursor:pointer; } .sheet .in { cursor:auto; position:relative; transition:transform .2s; }
  .xbtn { position:sticky; top:0; float:right; z-index:2; width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:var(--txt);
    font:700 17px/34px -apple-system, system-ui, sans-serif; text-align:center; padding:0; margin:-2px -4px 0 0; cursor:pointer; }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } } @keyframes fade { from { opacity:0; } }
  .team { margin:14px 0; } .teamh { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .mecard { position:relative; padding:14px; border-radius:20px; background:linear-gradient(160deg,rgba(251,113,133,.14),rgba(255,255,255,.03)); border:1px solid var(--line); }
  .mecard.win { background:linear-gradient(160deg,rgba(52,211,153,.16),rgba(255,255,255,.03)); }
  .mecard .stat span { white-space:nowrap; font-size:11px; } .mecard .stat b { font-size:18px; }
  .mecard img.big { width:60px; height:60px; border-radius:16px; } .mecard .stat b small { font-size:11px; color:var(--sec); font-weight:600; }
  .mecard .items img, .mecard .items i { width:34px; height:34px; border-radius:9px; }
  .pl2 { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .pl2:last-child { border:0; } .pl2 > img { width:36px; height:36px; border-radius:11px; flex:none; }
  .pl2.me { background:rgba(45,212,191,.08); border-radius:12px; padding:8px 6px; }
  .pl2h { display:flex; justify-content:space-between; gap:8px; font-size:13.5px; } .pl2h b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .pl2h span { font-weight:700; white-space:nowrap; }
  .pl2s { display:flex; gap:10px; align-items:center; font-size:11.5px; color:var(--sec); margin-top:2px; }
  .pl2s .dmg { flex:1; height:4px; border-radius:9px; background:var(--card2); overflow:hidden; } .pl2s .dmg i { display:block; height:100%; background:var(--orange); }
  .mini { display:flex; gap:3px; margin-top:5px; } .mini img, .mini i { width:18px; height:18px; border-radius:5px; background:var(--card2); display:block; } .pl { display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .pl img { width:30px; height:30px; border-radius:9px; } .pl.me { background:rgba(45,212,191,.08); border-radius:10px; padding:7px 6px; }
  .bar { height:5px; border-radius:9px; background:var(--card2); overflow:hidden; margin-top:3px; } .bar i { display:block; height:100%; background:var(--orange); border-radius:9px; }
  .skel { height:70px; border-radius:18px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)); background-size:200% 100%; animation:sh 1.2s linear infinite; margin-bottom:10px; }
  @keyframes sh { to { background-position:-200% 0; } }
  .tierc { font-weight:900; } .GOLD { color:var(--gold); } .PLATINUM { color:#5eead4; } .EMERALD { color:var(--green); } .DIAMOND { color:#93c5fd; } .SILVER { color:#cbd5e1; } .IRON, .BRONZE { color:#c08a5b; } .MASTER, .GRANDMASTER, .CHALLENGER { color:var(--purple); }
  .card .row > img { width:40px; height:40px; border-radius:12px; flex:none; }
  .rchip { display:inline-block; vertical-align:middle; font-size:11px; font-weight:800; letter-spacing:.3px; color:var(--acc); background:rgba(45,212,191,.14); border:1px solid rgba(45,212,191,.3); padding:2px 8px; border-radius:99px; }
  h2 .rchip { font-size:12px; position:relative; top:-4px; }
  img.up { object-fit:cover; }
  .mav { display:inline-grid; place-items:center; width:40px; height:40px; border-radius:12px; background:linear-gradient(145deg,#0f2a2a,#13203a); overflow:hidden; flex:none; }
  .mav .moosi { animation:none; filter:none; }
  .hav, img.hav { width:52px !important; height:52px !important; border-radius:16px !important; border:2px solid rgba(255,255,255,.25); }
  img.fav { width:26px; height:26px; border-radius:8px; }
  .live { font-size:11.5px; font-weight:700; color:var(--acc); margin-top:2px; }
  .cgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:260px; overflow:auto; }
  .cgrid button { border:1px solid transparent; background:var(--card2); border-radius:12px; padding:6px 2px; color:var(--sec); font:inherit; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .cgrid button img { width:44px; height:44px; border-radius:11px; } .cgrid button span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cgrid button.on { border-color:rgba(45,212,191,.7); background:rgba(45,212,191,.14); color:var(--txt); }
  .mrow { display:flex; gap:6px; margin-bottom:10px; } .mrow button { border:2px solid transparent; background:none; border-radius:14px; padding:2px; } .mrow button.on { border-color:var(--acc); }
  .tg { display:flex; justify-content:space-between; align-items:center; margin:14px 0 0; font-size:14px; color:var(--txt); } .tg input { width:auto; }
  .seg { display:flex; gap:4px; background:var(--card2); border-radius:12px; padding:3px; margin-bottom:10px; }
  .seg button { flex:1; border:0; background:none; color:var(--sec); font:inherit; font-size:12.5px; font-weight:700; padding:7px 0; border-radius:9px; }
  .seg button.on { background:rgba(255,255,255,.12); color:var(--txt); }
  .lb { display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); }
  .lb:last-of-type { border:0; } .lb.me { background:rgba(45,212,191,.08); border-radius:12px; }
  .lb img { width:40px; height:40px; border-radius:12px; flex:none; } .lb .pos { width:24px; text-align:center; font-weight:800; color:var(--sec); flex:none; }
  .lb .pos.p1 { color:#cbd5e1; } .lb .pos.p2 { color:#c08a5b; } .lbv { text-align:right; font-weight:800; font-size:14px; white-space:nowrap; }
  .dots.sm { gap:3px; margin-top:4px; } .dots.sm i { width:9px; height:9px; border-radius:3px; }
  .cmp { margin:8px 0; } .cmph { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; } .cmph span { color:var(--sec); font-size:12px; }
  .cmpb { display:flex; height:6px; border-radius:9px; background:var(--card2); overflow:hidden; margin-top:3px; } .cmpb i { display:block; height:100%; }
  .toast { position:fixed; left:50%; bottom:calc(var(--safe-b) + 90px); transform:translateX(-50%); background:#2c2c2e; color:#fff; padding:10px 16px; border-radius:14px; font-size:14px; z-index:60; }
  .focus { padding:12px 14px; border-radius:16px; background:linear-gradient(160deg,rgba(45,212,191,.10),rgba(129,140,248,.05)); border:1px solid rgba(45,212,191,.22); margin-bottom:10px; }
  .focus .k { font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); } .focus b { display:block; font-size:16px; margin:2px 0 4px; }
</style>

<body>
<div id="app"></div>
<nav class="tabs" id="tabs" style="display:none"></nav>
<script>
// Moosi – the coach monster (own artwork): one pose per mood, head crop for small avatars.
const MOOSI_POSE = {happy: "body", proud: "proud", worried: "worried", sleepy: "sleepy"};
function moosi(mood = "happy", size = 96) {
  const src = size < 64 ? "/moosi/head.webp" : `/moosi/${MOOSI_POSE[mood] || "body"}.webp`;
  return `<img class="moosi" src="${src}" width="${size}" height="${size}" alt="Moosi" draggable="false" style="object-fit:contain;display:block">`;
}
// App logo (round badge)
function moosiLogo(size = 64) {
  return `<img src="/moosi/logo.webp" width="${size}" height="${size}" alt="Moosi" draggable="false" style="display:block;border-radius:50%">`;
}
// Jungle Coach mobile: own stats, past games, friends and the coach summary from the PC app.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LS = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
const PLATFORMS = {euw1: "EUW", eun1: "EUNE", tr1: "TR", ru: "RU", me1: "ME", na1: "NA", br1: "BR", la1: "LAN", la2: "LAS", kr: "KR", jp1: "JP", oc1: "OCE", sg2: "SG", tw2: "TW", vn2: "VN"};
const REGION = p => ["na1", "br1", "la1", "la2"].includes(p) ? "americas" : ["kr", "jp1"].includes(p) ? "asia" : ["oc1", "sg2", "tw2", "vn2"].includes(p) ? "sea" : "europe";
const ACC_REGION = p => REGION(p) === "sea" ? "asia" : REGION(p);
let S = {tab: "home", me: null, ver: "16.23.1", acct: null, league: null, games: null, gamesMore: 20, lbm: "rank", coach: null, friends: null, fdata: {}, sheet: null, err: "", busy: false};
const platform = () => LS.get("jc_platform") || "euw1";

// ---- token (from the login redirect, or injected by the iOS app)
(function () {
  const u = new URL(location.href), t = u.searchParams.get("token");
  if (t) { LS.set("jc_token", t); u.searchParams.delete("token"); history.replaceState(null, "", u.pathname); }
})();
let MEM_TOKEN = window.__jcToken || null;  // the iOS app also injects the saved token natively
window.jcSetToken = t => { MEM_TOKEN = t; LS.set("jc_token", t); S.err = ""; boot(); };
window.jcLoginError = m => { S.err = "Anmeldung fehlgeschlagen: " + m; render(); };
const token = () => LS.get("jc_token") || MEM_TOKEN;
async function api(path, opt = {}) {
  const sent = token();
  if (!sent) throw new Error("nicht angemeldet");   // never send "Bearer null" (background timers while logged out)
  const r = await fetch(path, {...opt, headers: {...(opt.headers || {}), Authorization: "Bearer " + sent, "Content-Type": "application/json"}});
  if (r.status === 401) {
    const j = await r.json().catch(() => ({}));
    if (token() === sent) {   // only drop the token this request used – not a newer one from a fresh login
      LS.set("jc_token", null); MEM_TOKEN = null;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcToken) window.webkit.messageHandlers.jcToken.postMessage("");
      S.me = null;
      S.err = `Server hat die Anmeldung abgelehnt (${path.split("?")[0]} · ${j.why || "ohne Grund"} · Token ${sent.length} Zeichen/${sent.split(".").length} Teile) – bitte erneut anmelden.`; render();
    }
    const info = `${path.split("?")[0]} · ${j.why || "ohne Grund"} · Token ${sent.length} Zeichen/${sent.split(".").length} Teile`;
    throw new Error("Anmeldung abgelehnt: " + info);
  }
  if (r.status === 429) throw new Error("Riot-Limit erreicht – kurz warten und neu laden.");
  if (r.status === 502) { const j = await r.json().catch(() => ({})); if (j.riot_key) throw new Error(j.own ? "Dein eigener Riot-Key ist abgelaufen – unter „Mehr“ einen neuen eintragen." : "Riot-Daten gerade nicht verfügbar: der Server-Key ist abgelaufen. Unter „Mehr“ kannst du deinen eigenen Key eintragen."); }
  if (!r.ok) throw new Error(r.status === 404 ? "nicht gefunden" : "Fehler " + r.status);
  return r.json();
}
const riot = (host, path) => api(`/riot/${host}${path}`);
function login(p) {
  S.err = ""; LS.set("jc_token", null); MEM_TOKEN = null; render();
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcLogin) return window.webkit.messageHandlers.jcLogin.postMessage(p);
  location.href = `/auth/${p}?redirect=${encodeURIComponent(location.origin + "/m/")}`;
}
function logout() { LS.set("jc_token", null); MEM_TOKEN = null; if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcToken) window.webkit.messageHandlers.jcToken.postMessage(""); S = {...S, me: null, acct: null, league: null, games: null, coach: null, friends: null}; render(); }

// ---- data
const DD = () => `https://ddragon.leagueoflegends.com/cdn/${S.ver}`;
const cImg = (c, cls = "c") => `<img class="${cls}" src="${DD()}/img/champion/${encodeURIComponent(c)}.png" loading="lazy" onerror="this.style.visibility='hidden'">`;
const iImg = i => i ? `<img src="${DD()}/img/item/${i}.png" loading="lazy">` : "<i></i>";
const splash = c => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${encodeURIComponent(c)}_0.jpg`;
const rankTxt = r => r ? `<span class="tierc ${r.tier}">${r.tier[0] + r.tier.slice(1).toLowerCase()} ${["MASTER", "GRANDMASTER", "CHALLENGER"].includes(r.tier) ? "" : r.rank}</span> · ${r.leaguePoints} LP` : '<span class="muted">Unranked</span>';
const solo = l => (l || []).find(e => e.queueType === "RANKED_SOLO_5x5") || (l || []).find(e => e.queueType === "RANKED_FLEX_SR");
const MATCH = {}, MP = {};
async function match(id) {
  if (!MP[id]) MP[id] = riot(REGION(platform()), `/lol/match/v5/matches/${id}`).then(m => (MATCH[id] = m));
  return MP[id];
}
async function account(rid) {
  const [n, t] = rid.split("#");
  return riot(ACC_REGION(platform()), `/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(n)}/${encodeURIComponent(t)}`);
}
async function loadGames(puuid, count, start = 0) {
  const ids = await riot(REGION(platform()), `/lol/match/v5/matches/by-puuid/${puuid}/ids?start=${start}&count=${count}`);
  const out = [];
  for (let i = 0; i < ids.length; i += 4) out.push(...await Promise.all(ids.slice(i, i + 4).map(id => match(id).catch(() => null))));
  return out.filter(Boolean).map(m => ({m, p: m.info.participants.find(x => x.puuid === puuid)})).filter(g => g.p);
}
async function boot() {
  render();
  if (!token()) return;
  try {
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(v => { S.ver = v[0]; render(); }).catch(() => {});
    S.me = await api("/api/me"); render();
    api("/api/sync/coach").then(c => { S.coach = c.coach; render(); }).catch(() => {});
    api("/api/sync/friends").then(f => { S.friends = f.friends || []; render(); loadPublic(); }).catch(() => { S.friends = []; });
    api("/api/sync/profile").then(p => { S.prof = p.profile || {}; render(); }).catch(() => { S.prof = {}; });
    loadChamps();
    if (S.me.riot_id && S.me.riot_id.includes("#")) await loadMe();
  } catch (e) { S.err = e.message; render(); }
}
// champion list (names + numeric keys for the spectator API) from Data Dragon
let CHAMPS = [], CKEY = {};
async function loadChamps() {
  try {
    const v = (await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json())[0];
    const d = (await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${v}/data/de_DE/champion.json`)).json()).data;
    CHAMPS = Object.values(d).map(c => ({id: c.id, name: c.name, key: c.key})).sort((a, b) => a.name.localeCompare(b.name));
    CKEY = Object.fromEntries(CHAMPS.map(c => [c.key, c.id]));
  } catch (e) {}
}

async function liveCheck(rid) {
  const d = S.fdata[rid]; if (!d || !d.acct) return;
  try {
    const g = await riot(platform(), `/lol/spectator/v5/active-games/by-summoner/${d.acct.puuid}`);
    const me = (g.participants || []).find(x => x.puuid === d.acct.puuid);
    d.live = {champ: me ? CKEY[String(me.championId)] : null, start: g.gameStartTime || Date.now() - (g.gameLength || 0) * 1000, queue: g.gameQueueConfigId};
  } catch (e) { d.live = null; }
  render();
}
function liveTxt(rid) {
  const d = S.fdata[rid] || {}, pub = (S.pub || {})[rid.toLowerCase()] || {};
  if (d.live) {
    const mins = Math.max(0, Math.round((Date.now() - d.live.start) / 60000));
    return `🎮 spielt ${d.live.champ ? esc(nameOf(d.live.champ)) : ""} · ${mins} min`;

// ---- analytics helpers
const TIERS = ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND", "MASTER", "GRANDMASTER", "CHALLENGER"];
const DIVS = {IV: 0, III: 100, II: 200, I: 300};
const rankScore = e => e ? TIERS.indexOf(e.tier) * 400 + (TIERS.indexOf(e.tier) >= 7 ? 0 : DIVS[e.rank] || 0) + e.leaguePoints : -1;
function agg(games) {
  const gs = (games || []).filter(g => g.m.info.gameDuration >= 300);
  if (!gs.length) return null;
  let k = 0, d = 0, a = 0, kp = 0, cs = 0, gold = 0, vis = 0, dmg = 0, mins = 0, wins = 0;
  const champs = {};
  const scored = gs.map(g => {
    const p = g.p, m = g.m.info, mi = m.gameDuration / 60;
    const tk = m.participants.filter(x => x.teamId === p.teamId).reduce((s, x) => s + x.kills, 0);
    const c = p.totalMinionsKilled + p.neutralMinionsKilled;
    k += p.kills; d += p.deaths; a += p.assists; kp += (p.kills + p.assists) / Math.max(1, tk); cs += c; gold += p.goldEarned || 0;
    vis += p.visionScore || 0; dmg += p.totalDamageDealtToChampions || 0; mins += mi; wins += p.win ? 1 : 0;
    const ch = champs[p.championName] = champs[p.championName] || {c: p.championName, n: 0, w: 0, k: 0, d: 0, a: 0};
    ch.n++; ch.w += p.win ? 1 : 0; ch.k += p.kills; ch.d += p.deaths; ch.a += p.assists;
    return {g, score: (p.kills + p.assists) / Math.max(1, p.deaths) + (p.win ? 1.5 : 0) + c / mi / 4};
  });
  scored.sort((x, y) => y.score - x.score);
  return {n: gs.length, wins, wr: Math.round(100 * wins / gs.length), kda: +((k + a) / Math.max(1, d)).toFixed(2),
    kp: Math.round(100 * kp / gs.length), csm: +(cs / mins).toFixed(1), gpm: Math.round(gold / mins), vpm: +(vis / mins).toFixed(2),
    dpm: Math.round(dmg / mins), deaths: +(d / gs.length).toFixed(1), avgk: +(k / gs.length).toFixed(1), avga: +(a / gs.length).toFixed(1),
    champs: Object.values(champs).sort((x, y) => y.n - x.n), best: scored[0].g, worst: scored[scored.length - 1].g,
    form: gs.slice(0, 10).map(g => g.p.win)};
}
async function share(text) {
  const url = location.origin + "/m/";
  try {
    if (navigator.share) { await navigator.share({title: "Moosi", text, url}); return; }
    await navigator.clipboard.writeText(text + "\n" + url); toast("In die Zwischenablage kopiert");
  } catch (e) {}
}
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
const bar2 = (label, a, b, fmt, higher = true) => {
  const max = Math.max(a, b) || 1, win = higher ? a >= b : a <= b;
  return `<div class="cmp"><div class="cmph"><b class="${win ? "green" : ""}">${fmt(a)}</b><span>${label}</span><b class="${!win ? "green" : ""}">${fmt(b)}</b></div>

};

function spark(pr) {
  pr = {...pr, v: pr.v || (pr.points || []).map(x => x.v), w: pr.w || (pr.points || []).map(x => x.win)};
  if (pr.v.length < 2) return "";
  const W = 300, H = 60, v = pr.v.concat([pr.target]), lo = Math.min(...v), hi = Math.max(...v), sp = (hi - lo) || 1;
  const X = i => 6 + i / Math.max(1, pr.v.length - 1) * (W - 12), Y = x => H - 6 - (x - lo) / sp * (H - 12);
  return `<div style="margin-bottom:12px"><div class="row" style="border:0;padding:0"><b>${esc(pr.title)}</b><span class="small ${pr.better == null ? "muted" : pr.better ? "green" : "red"}">${pr.better == null ? "unverändert" : pr.better ? "wird besser" : "wird schlechter"}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="0" x2="${W}" y1="${Y(pr.target)}" y2="${Y(pr.target)}" stroke="var(--acc)" stroke-dasharray="4 4" opacity=".7"/>
    <polyline points="${pr.v.map((x, i) => X(i) + "," + Y(x)).join(" ")}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"/>
    ${pr.v.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x)}" r="3" fill="${pr.w[i] ? "var(--green)" : "var(--red)"}"/>`).join("")}</svg>
    <div class="muted small">Ziel ${esc(pr.target_txt || "")} · im Ziel ${esc(pr.hit || "")}</div></div>`;
}

// own picture: square crop + 256 px on the phone, then upload
async function uploadPic(input) {
  const f = input.files && input.files[0]; if (!f) return;
  toast("Lade hoch …");
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const sz = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement("canvas");
    cv.width = cv.height = 256;
    cv.getContext("2d").drawImage(img, (img.naturalWidth - sz) / 2, (img.naturalHeight - sz) / 2, sz, sz, 0, 0, 256, 256);
    let q = 0.85, data = cv.toDataURL("image/jpeg", q);
    while (data.length > 100000 && q > 0.4) { q -= 0.1; data = cv.toDataURL("image/jpeg", q); }
    const r = await api("/api/sync/avatar", {method: "PUT", body: JSON.stringify({data})});
    PE.avatar = r.avatar;
    const keepName = $("#pe_name").value, keepBio = $("#pe_bio").value;
    render(); $("#pe_name").value = keepName; $("#pe_bio").value = keepBio;
    toast("Bild hochgeladen – jetzt Profil speichern");
  } catch (e) { toast("Upload fehlgeschlagen: " + e.message); }
}

    <button class="btn sec" onclick="login('discord')">Mit Discord anmelden</button></div>
    ${S.err ? `<p class="red small" style="max-width:320px;margin-top:12px">${esc(S.err)}</p>` : ""}
    <p class="muted small" style="margin-top:16px">Gleiches Konto wie in der PC-App.</p></div>`;
}
const TAB_IC = {home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', games: '<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 11v3M6 12.5h3"/><circle cx="15.5" cy="11.5" r=".9"/><circle cx="17.5" cy="13.7" r=".9"/>',
  stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  friends: '<circle cx="9" cy="8.5" r="3.4"/><path d="M2.8 19.5c1-3.2 3.5-4.8 6.2-4.8s5.2 1.6 6.2 4.8"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6M17.6 14.9c1.8.6 3 2.1 3.6 4.6"/>', more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'};
function render() {
  const app = $("#app"), tabs = $("#tabs");
  if (!token()) { tabs.style.display = "none"; app.innerHTML = vLogin(); return; }
  if (!S.me) { tabs.style.display = "none"; app.innerHTML = `<div style="height:60vh;display:grid;place-items:center">${moosi("sleepy", 110)}</div>${S.err ? `<p class="red" style="text-align:center">${esc(S.err)}</p>` : ""}`; return; }
  tabs.style.display = "flex";
  tabs.innerHTML = [["home", "Home"], ["games", "Games"], ["stats", "Stats"], ["friends", "Freunde"], ["more", "Mehr"]].map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';S.view=null;render();scrollTo(0,0)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TAB_IC[k]}</svg>${l}</button>`).join("");
  app.innerHTML = ({home: vHome, games: vGames, stats: vStats, friends: vFriends, more: vMore}[S.tab])() + (S.sheet ? matchSheet() : "");
}
boot();
if ("serviceWorker" in navigator && !(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcLogin)) navigator.serviceWorker.register("/m/sw.js").catch(() => {});
</script>
