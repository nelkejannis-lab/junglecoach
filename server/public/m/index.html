<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Moosi</title>
<style>
  :root { --bg:#070a12; --card:#111726; --card2:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --txt:#eef2ff; --sec:#8b93a7;
    --acc:#2dd4bf; --grad:linear-gradient(135deg,#34d399 0%,#22d3ee 45%,#818cf8 100%); --green:#34d399; --red:#fb7185; --orange:#fbbf24; --gold:#f5c451; --purple:#c084fc;
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:radial-gradient(600px 400px at 90% -10%, rgba(45,212,191,.16), transparent 60%), radial-gradient(500px 400px at -10% 100%, rgba(129,140,248,.12), transparent 60%); }
  #app { padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px); max-width:560px; margin:0 auto; }
  h1 { font-size:30px; letter-spacing:-.7px; margin:6px 0 4px; font-weight:800; }
  .sub { color:var(--sec); margin:0 0 16px; font-size:14px; }
  .g { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; letter-spacing:-.2px; }
  .muted { color:var(--sec); } .small { font-size:12.5px; } .green { color:var(--green); } .red { color:var(--red); }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:16px; padding:15px; font:inherit; font-weight:800; font-size:16px; color:#061018; background:var(--grad); }
  .btn.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .btn:active { transform:scale(.98); }
  input, select, textarea { font-size:16px !important; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  input, select { width:100%; font:inherit; color:var(--txt); background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; }
  input:focus { border-color:rgba(45,212,191,.6); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--sec); margin:12px 0 6px; }
  .tabs { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-around; padding:8px 8px calc(var(--safe-b) + 8px);
    background:rgba(9,12,20,.82); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--line); z-index:20; }
  .tabs button { flex:1; border:0; background:none; color:#6b7590; font:inherit; font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; }
  .tabs button.on { color:var(--acc); }
  /* desktop browser: sidebar navigation on the left, wider content */
  @media (min-width: 900px) {
    #app { max-width:820px; padding:32px 32px 60px; margin-left:max(240px, calc(50vw - 410px + 110px)); margin-right:auto; }
    .tabs { top:0; bottom:0; right:auto; width:220px; flex-direction:column; justify-content:flex-start; gap:4px; padding:24px 14px;
      border-top:0; border-right:1px solid var(--line); }
    .tabs::before { content:""; display:block; height:64px; margin:0 6px 18px; background:url(/moosi/logo.webp) left center/48px no-repeat; }
    .tabs::after { content:"Moosi"; position:absolute; top:40px; left:82px; font-size:20px; font-weight:800; color:var(--txt); }
    .tabs button { flex:none; flex-direction:row; justify-content:flex-start; gap:12px; font-size:15px; padding:11px 12px; border-radius:12px; }
    .tabs button.on { background:rgba(45,212,191,.1); }
    .sheet .in { max-width:640px; margin:0 auto; }

  }


  /* ---------- game detail ---------- */
  .mh { display:flex; gap:16px; align-items:center; justify-content:space-between; padding:18px; border-radius:22px; margin-bottom:12px;
    background:radial-gradient(120% 140% at 0% 0%, rgba(251,113,133,.22), rgba(255,255,255,.02) 60%); border:1px solid var(--line); }
  .mh.win { background:radial-gradient(120% 140% at 0% 0%, rgba(52,211,153,.22), rgba(255,255,255,.02) 60%); }
  .mhl { display:flex; gap:14px; align-items:center; min-width:0; } .mhl img.big { width:68px; height:68px; border-radius:18px; flex:none; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .res2 { font-size:12px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; color:var(--red); } .mh.win .res2 { color:var(--green); }
  .kda2 { font-size:30px; font-weight:900; letter-spacing:-.8px; line-height:1.1; } .kda2 i { color:var(--sec); font-style:normal; margin:0 2px; }
  .items.big { margin-top:10px; gap:5px; } .items.big img, .items.big i { width:30px; height:30px; border-radius:8px; }
  .ring { position:relative; width:84px; height:84px; flex:none; } .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:7; stroke-linecap:round; } .ring .tr { stroke:rgba(255,255,255,.08); }
  .ring .pr.w { stroke:var(--green); } .ring .pr.l { stroke:var(--orange); }
  .ring .rv { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .ring .rv b { font-size:24px; font-weight:900; letter-spacing:-.5px; } .ring .rv small { font-size:10px; color:var(--sec); font-weight:700; margin-top:2px; }
  .stats.six { margin-bottom:6px; }
  @media (max-width: 899px) {
    .mh { position:relative; padding:14px 100px 14px 14px; align-items:flex-start; } .mhr { position:absolute; right:12px; top:14px; width:80px; }
    .mhr .ring { width:72px; height:72px; margin:0 auto; } .mhr .ring .rv b { font-size:20px; } .mhr .small { font-size:11px; }
    .mhl { flex-direction:column; align-items:flex-start; gap:10px; } .mhl img.big { width:52px; height:52px; border-radius:15px; }
    .kda2 { font-size:26px; } .items.big img, .items.big i { width:26px; height:26px; }
  }
  @media (min-width: 900px) { .in.mx .mh { margin-right:48px; } }
  .tb { margin-top:14px; border:1px solid var(--line); border-radius:20px; padding:6px 10px 4px; background:rgba(255,255,255,.015); }
  .tb.win { border-color:rgba(52,211,153,.22); } .tb.loss { border-color:rgba(251,113,133,.18); }
  .tbh { display:flex; align-items:center; gap:8px; padding:8px 4px 8px; border-bottom:1px solid var(--line); }
  .tbh b { font-size:15px; } .tb.win .tbh b { color:var(--green); } .tb.loss .tbh b { color:var(--red); }
  .side { font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:7px; } .side.blue { background:rgba(96,165,250,.16); color:#93c5fd; } .side.red { background:rgba(251,113,133,.14); color:#fda4af; }
  .tbo { margin-left:auto; font-size:12px; color:var(--sec); display:flex; gap:10px; white-space:nowrap; }
  .sr { display:grid; grid-template-columns:28px auto minmax(0,1fr) auto; grid-template-areas:"r c w k" "r c i n"; column-gap:10px; row-gap:6px;
    align-items:center; padding:11px 6px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:12px; }
  .sr:last-child { border-bottom:0; } .sr.me { background:rgba(45,212,191,.09); }
  .sr .rkn { grid-area:r; } .sr .chs { grid-area:c; } .sr .who { grid-area:w; } .sr .nk { grid-area:k; } .sr .nc { grid-area:n; } .sr .mini { grid-area:i; margin:0; }
  .chs { position:relative; display:flex; gap:4px; align-items:center; } .chs > img { width:40px; height:40px; border-radius:12px; }
  .chs .lv { position:absolute; left:26px; top:28px; min-width:16px; height:16px; padding:0 3px; border-radius:6px; background:#0b0f1a; border:1px solid var(--line);
    font:800 9.5px/14px -apple-system,system-ui,sans-serif; text-align:center; font-style:normal; color:var(--txt); }
  .who { min-width:0; } .who b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who small { display:block; font-size:11.5px; color:var(--sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .dmg { display:block; height:4px; border-radius:9px; background:var(--card2); overflow:hidden; margin-top:5px; max-width:180px; } .who .dmg i { display:block; height:100%; background:var(--orange); border-radius:9px; }
  .nk, .nc { text-align:right; line-height:1.15; } .nk b { font-size:14px; white-space:nowrap; } .nc b { font-size:13px; } .nk small, .nc small { display:block; font-size:11px; color:var(--sec); }
  @media (min-width: 900px) {
    .sheet { align-items:center; justify-content:center; padding:24px; }
    .sheet .in.mx { max-width:1280px; border-radius:28px; border:1px solid var(--line); max-height:92vh; padding:26px 30px 28px; }
    .sheet .in.mx .grip { display:none; }
    .stats.six { grid-template-columns:repeat(6,1fr); }
    .teams2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
    .sr { grid-template-columns:28px auto minmax(0,1fr) 70px 48px auto; grid-template-areas:"r c w k n i"; min-height:68px; }
    .sr .mini img, .sr .mini i { width:20px; height:20px; }
  }
  @media (min-width: 900px) {
    .card { padding:20px; border-radius:24px; margin-bottom:16px; } .game { padding:14px 18px; margin-bottom:12px; }
    h1 { font-size:34px; margin-bottom:6px; } .sub { margin-bottom:22px; }
  }

  /* ---------- motion: short and springy; calm with "reduce motion" ---------- */
  @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.985); } }
  @keyframes grow { from { transform:scaleX(0); } }
  @keyframes ringIn { from { stroke-dashoffset:var(--c); } }
  @keyframes pageR { from { opacity:.0; transform:translateX(22px); } } @keyframes pageL { from { opacity:0; transform:translateX(-22px); } }
  @keyframes popIn { 0% { transform:scale(.6); opacity:0; } 60% { transform:scale(1.15); } }
  @keyframes sheetUp { from { transform:translateY(60px); opacity:.2; } 70% { transform:translateY(-4px); } }
  @keyframes modalIn { from { transform:translateY(24px) scale(.96); opacity:0; } 70% { transform:translateY(-2px) scale(1.005); } }
  @keyframes sheetDown { to { transform:translateY(80px); opacity:0; } } @keyframes fadeOut { to { opacity:0; } }
  .sheet .in { animation:none; }
  .ani { animation:rise .5s cubic-bezier(.2,.9,.25,1.15) both; animation-delay:calc(var(--i, 0) * 42ms); }
  .ani .dmg i, .ani .bar i, .ani .meter i, .ani.dmg i, .ani .vsb i, .ani .mbar i { animation:grow .8s cubic-bezier(.2,.8,.2,1) both; transform-origin:left; animation-delay:calc(var(--i, 0) * 42ms + 160ms); }
  .ani .pr, .ani.ring .pr { animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay:.2s; }
  .ani .dots i { animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both; }
  .ani .dots i:nth-child(2) { animation-delay:.03s } .ani .dots i:nth-child(3) { animation-delay:.06s } .ani .dots i:nth-child(4) { animation-delay:.09s } .ani .dots i:nth-child(5) { animation-delay:.12s }
  .ani .dots i:nth-child(6) { animation-delay:.15s } .ani .dots i:nth-child(7) { animation-delay:.18s } .ani .dots i:nth-child(8) { animation-delay:.21s } .ani .dots i:nth-child(9) { animation-delay:.24s } .ani .dots i:nth-child(10) { animation-delay:.27s }
  #app.pgR { animation:pageR .34s cubic-bezier(.2,.9,.3,1.1); } #app.pgL { animation:pageL .34s cubic-bezier(.2,.9,.3,1.1); }
  .sheet.opening { animation:fade .2s; } .sheet.opening .in { animation:sheetUp .42s cubic-bezier(.2,1,.3,1); }
  @media (min-width: 900px) { .sheet.opening .in.mx { animation:modalIn .4s cubic-bezier(.2,1,.3,1); } }
  .sheet.closing { animation:fadeOut .2s forwards; } .sheet.closing .in { animation:sheetDown .2s ease-in forwards; }
  .btn, .game, .lb, .sr, .fr, .rk, .stat, .seg button, .tabs button, .xbtn, .chk { transition:transform .22s cubic-bezier(.3,1.6,.5,1), background-color .2s, opacity .2s; }
  .btn:active, .game:active, .lb:active, .sr:active, .fr:active, .rk:active, .seg button:active, .xbtn:active { transform:scale(.97); }
  .tabs button:active { transform:scale(.9); } .tabs button.on svg { animation:popIn .4s cubic-bezier(.3,1.6,.5,1); }
  @media (hover:hover) { .game:hover, .lb:hover, .sr:hover { background-color:rgba(255,255,255,.035); } .game:hover { transform:translateY(-1px); } }
  /* check-off reward */
  .chk { flex:none; width:40px; height:40px; border-radius:50%; border:2px solid rgba(45,212,191,.5); background:rgba(45,212,191,.06); padding:0; cursor:pointer; position:relative; }
  .chk svg { width:100%; height:100%; } .chk path { fill:none; stroke:#061018; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24; stroke-dashoffset:24; }
  .chk.done { background:var(--acc); border-color:var(--acc); } .chk.done path { stroke-dashoffset:0; }
  .chk.pop { animation:popIn .45s cubic-bezier(.3,1.6,.5,1); } .chk.pop path { transition:stroke-dashoffset .35s .1s cubic-bezier(.6,0,.2,1); }
  .tt { display:inline; -webkit-box-decoration-break:clone; box-decoration-break:clone; background:linear-gradient(currentColor,currentColor) no-repeat 0 58% / 0 1.6px; transition:background-size .45s cubic-bezier(.6,0,.2,1), opacity .4s; }
  .tt.done { background-size:100% 1.6px; opacity:.55; }
  .spark { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; pointer-events:none; background:var(--c, #2dd4bf);
    animation:spark .7s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes spark { to { transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .chk path { stroke-dashoffset:0 !important; } .chk:not(.done) path { stroke-dashoffset:24 !important; }
  }
  #rail { display:none; }
  /* wide desktop: right column with your card, Moosi's task and friends (like the PC app) */
  @media (min-width: 1240px) {
    #app { margin-left:max(260px, calc(50vw - 560px)); }
    #rail { display:block; position:fixed; top:24px; right:max(24px, calc(50vw - 640px)); width:300px; max-height:calc(100vh - 48px); overflow:auto; }
    #rail .card { padding:14px; margin-bottom:12px; }
    #rail .avw { flex:none; display:block; border-radius:12px; overflow:hidden; } #rail .avw > * { width:100% !important; height:100% !important; border-radius:12px; margin:0 !important; }
    #rail .avw img { width:100%; height:100%; object-fit:cover; }
    #rail .meh { display:flex; gap:12px; align-items:center; } #rail .meh .mav, #rail .meh img.c { width:46px; height:46px; border-radius:14px; }
    #rail .task { display:flex; gap:10px; align-items:center; border-color:rgba(45,212,191,.3); background:linear-gradient(160deg,rgba(45,212,191,.10),rgba(129,140,248,.04)); }
    #rail .task .moosi { width:72px !important; height:72px !important; flex:none; }
    #rail .task .k { font-size:10.5px; font-weight:800; letter-spacing:.6px; color:var(--acc); text-transform:uppercase; }
    #rail .fr { display:flex; gap:10px; align-items:center; padding:8px 4px; border-radius:12px; cursor:pointer; } #rail .fr:hover { background:rgba(255,255,255,.04); }
    #rail .fr .mav, #rail .fr img.c { width:38px; height:38px; border-radius:12px; flex:none; }
    #rail .fr .nm { font-weight:700; font-size:14px; } #rail .fr .st { font-size:12px; color:var(--sec); }
    #rail .fr .rk2 { margin-left:auto; font-size:12.5px; font-weight:800; white-space:nowrap; }
  }
  .hero { position:relative; overflow:hidden; border-radius:26px; padding:18px; margin-bottom:14px; border:1px solid var(--line); background:#0d1322; min-height:200px; }
  .hero .art { position:absolute; inset:0; background-size:cover; background-position:65% 20%; }
  .hero .art::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,#0b101d 8%,rgba(11,16,29,.55) 60%,rgba(11,16,29,.2)); }
  .hero .in { position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:164px; }
  .tag { display:inline-flex; align-self:flex-start; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--acc); background:rgba(45,212,191,.14); border:1px solid rgba(45,212,191,.3); padding:4px 9px; border-radius:99px; }
  .hero h2 { font-size:30px; margin:8px 0 2px; letter-spacing:-.8px; line-height:1.1; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; letter-spacing:-.4px; } .stat span { font-size:11.5px; color:var(--sec); }
  .bubble { flex:1; background:rgba(5,8,15,.55); border:1px solid var(--line); border-radius:18px 18px 18px 4px; padding:12px 14px; font-size:14px; }
  .bubble b { display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); margin-bottom:3px; }
  .moosi-card { display:flex; gap:10px; align-items:flex-end; background:linear-gradient(160deg,rgba(45,212,191,.16),rgba(129,140,248,.08)); border-color:rgba(45,212,191,.3); }
  .moosi { flex:none; animation:bob 3.2s ease-in-out infinite; transform-origin:50% 100%; filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  @keyframes bob { 50% { transform:translateY(-3px) scale(1.02,.98); } }
  .game { display:flex; gap:12px; align-items:center; padding:12px; border-radius:18px; background:var(--card); border:1px solid var(--line); margin-bottom:10px; position:relative; overflow:hidden; }
  .game::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); }
  .game.win::before { background:var(--green); }
  .game img.c { width:48px; height:48px; border-radius:14px; flex:none; }
  .game .k { font-weight:800; font-size:16px; } .game .meta { font-size:12px; color:var(--sec); }
  .items { display:flex; gap:3px; margin-top:6px; } .items img, .items i { width:22px; height:22px; border-radius:6px; background:var(--card2); display:block; }
  .res { margin-left:auto; text-align:right; font-size:12px; font-weight:800; white-space:nowrap; }
  .dots { display:flex; gap:5px; } .dots i { width:14px; height:14px; border-radius:5px; background:var(--red); } .dots i.w { background:var(--green); }
  .fr { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .fr:last-child { border:0; } .fr img { width:44px; height:44px; border-radius:13px; } .fr b { display:block; }
  .chev { margin-left:auto; color:#4b5563; font-size:20px; }
  .sheet { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
  .sheet .in { width:100%; max-height:88vh; overflow:auto; background:#0c111d; border-radius:26px 26px 0 0; border-top:1px solid var(--line); padding:10px 16px calc(var(--safe-b) + 24px); }
  .grip { width:40px; height:5px; border-radius:9px; background:#2b3550; margin:4px auto 12px; }
  .sheet { cursor:pointer; } .sheet .in { cursor:auto; position:relative; transition:transform .2s; }
  .xbtn { position:sticky; top:0; float:right; z-index:2; width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:var(--txt);
    font:700 17px/34px -apple-system, system-ui, sans-serif; text-align:center; padding:0; margin:-2px -4px 0 0; cursor:pointer; }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } } @keyframes fade { from { opacity:0; } }
  .team { margin:14px 0; } .teamh { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .mecard { position:relative; padding:14px; border-radius:20px; background:linear-gradient(160deg,rgba(251,113,133,.14),rgba(255,255,255,.03)); border:1px solid var(--line); }

  .mecard img.big { width:60px; height:60px; border-radius:16px; } .mecard .stat b small { font-size:11px; color:var(--sec); font-weight:600; }

  if (ACC[k]) return ACC[k];

  const a = await riot(ACC_REGION(platform()), `/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(n)}/${encodeURIComponent(t)}`);

// ---- who played best: same formula as jc/gamescore.py (keep in sync)
const GS_W = {
  DEFAULT: {kp: .20, kda: .18, dmg: .20, gold: .10, cs: .10, vis: .07, tank: .05, obj: .05, deaths: .12},
  TOP: {kp: .15, kda: .16, dmg: .18, gold: .10, cs: .12, vis: .06, tank: .12, obj: .06, deaths: .12},
  JUNGLE: {kp: .22, kda: .16, dmg: .14, gold: .08, cs: .08, vis: .08, tank: .08, obj: .14, deaths: .12},
  UTILITY: {kp: .26, kda: .18, dmg: .08, gold: .04, cs: 0, vis: .24, tank: .08, obj: .04, deaths: .10}};
const GS_REF = {kp: .8, kda: 8, dmg: .4, gold: .3, cs: 9, tank: .35, obj: .4, deaths: .4};
function gameScores(info) {
  const P = info.participants || [], cap = x => Math.max(0, Math.min(1, x)), mins = Math.max(1, (info.gameDuration || 0) / 60), T = {};
  if (P.length < 2) return {};
  P.forEach(p => { const t = T[p.teamId] ||= {k: 0, d: 0, dmg: 0, gold: 0, tank: 0, obj: 0};
    t.k += p.kills || 0; t.d += p.deaths || 0; t.dmg += p.totalDamageDealtToChampions || 0; t.gold += p.goldEarned || 0;
    t.tank += (p.totalDamageTaken || 0) + (p.damageSelfMitigated || 0); t.obj += p.damageDealtToObjectives || 0; });
  const out = {};
  P.forEach(p => {
    const t = T[p.teamId], role = p.teamPosition || "", w = GS_W[role] || GS_W.DEFAULT, k = p.kills || 0, d = p.deaths || 0, a = p.assists || 0;
    const cs = (p.totalMinionsKilled || 0) + (p.neutralMinionsKilled || 0);
    const x = {kp: cap((k + a) / Math.max(1, t.k) / GS_REF.kp), kda: cap((k + a) / Math.max(1, d) / GS_REF.kda),
      dmg: cap((p.totalDamageDealtToChampions || 0) / Math.max(1, t.dmg) / GS_REF.dmg), gold: cap((p.goldEarned || 0) / Math.max(1, t.gold) / GS_REF.gold),
      cs: cap(cs / mins / GS_REF.cs), vis: cap((p.visionScore || 0) / mins / (role === "UTILITY" ? 2.5 : 1.5)),
      tank: cap(((p.totalDamageTaken || 0) + (p.damageSelfMitigated || 0)) / Math.max(1, t.tank) / GS_REF.tank),
      obj: cap((p.damageDealtToObjectives || 0) / Math.max(1, t.obj) / GS_REF.obj)};
    const pos = Object.entries(w).filter(([kk]) => kk !== "deaths").reduce((s, [, v]) => s + v, 0);
    const raw = Object.keys(x).reduce((s, kk) => s + w[kk] * x[kk], 0) - w.deaths * cap(d / Math.max(1, t.d) / GS_REF.deaths);
    out[p.puuid] = {score: Math.round(10 * Math.max(1, Math.min(10, 8.4 * raw / pos + 1.2 + (p.win ? .4 : 0)))) / 10, win: !!p.win};
  });
  const order = Object.keys(out).sort((a, b) => out[b].score - out[a].score);
  order.forEach((u, i) => { out[u].rank = i + 1; out[u].badge = null; });
  const bw = order.find(u => out[u].win);
  if (bw) out[bw].badge = "MVP";
  return out;
}

const TIERS = ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND", "MASTER", "GRANDMASTER", "CHALLENGER"];
const DIVS = {IV: 0, III: 100, II: 200, I: 300};
const rankScore = e => e ? TIERS.indexOf(e.tier) * 400 + (TIERS.indexOf(e.tier) >= 7 ? 0 : DIVS[e.rank] || 0) + e.leaguePoints : -1;
function agg(games) {
  const gs = (games || []).filter(g => g.m.info.gameDuration >= 300);
  if (!gs.length) return null;
  let k = 0, d = 0, a = 0, kp = 0, cs = 0, gold = 0, vis = 0, dmg = 0, mins = 0, wins = 0;
  const champs = {};
  const scored = gs.map(g => {
    const p = g.p, m = g.m.info, mi = m.gameDuration / 60;
    const tk = m.participants.filter(x => x.teamId === p.teamId).reduce((s, x) => s + x.kills, 0);
    const c = p.totalMinionsKilled + p.neutralMinionsKilled;
    k += p.kills; d += p.deaths; a += p.assists; kp += (p.kills + p.assists) / Math.max(1, tk); cs += c; gold += p.goldEarned || 0;
    vis += p.visionScore || 0; dmg += p.totalDamageDealtToChampions || 0; mins += mi; wins += p.win ? 1 : 0;
    const ch = champs[p.championName] = champs[p.championName] || {c: p.championName, n: 0, w: 0, k: 0, d: 0, a: 0};
    ch.n++; ch.w += p.win ? 1 : 0; ch.k += p.kills; ch.d += p.deaths; ch.a += p.assists;
    const gsv = (gameScores(m)[p.puuid] || {}).score || 0;
    return {g, score: gsv};
  });
  scored.sort((x, y) => y.score - x.score);
  return {n: gs.length, wins, wr: Math.round(100 * wins / gs.length), kda: +((k + a) / Math.max(1, d)).toFixed(2),
    kp: Math.round(100 * kp / gs.length), csm: +(cs / mins).toFixed(1), gpm: Math.round(gold / mins), vpm: +(vis / mins).toFixed(2),
    dpm: Math.round(dmg / mins), deaths: +(d / gs.length).toFixed(1), avgk: +(k / gs.length).toFixed(1), avga: +(a / gs.length).toFixed(1),
    champs: Object.values(champs).sort((x, y) => y.n - x.n), best: scored[0].g, worst: scored[scored.length - 1].g,
    form: gs.slice(0, 10).map(g => g.p.win),
    score: +(scored.reduce((t, x) => t + x.score, 0) / scored.length).toFixed(1),
    mvps: gs.filter(g => (gameScores(g.m.info)[g.p.puuid] || {}).badge).length};
}

function spark(pr) {

// count numbers up from 0 (only the leading number, keeps "%", "k", "/10" …)
function countUp(el) {
  const t = el.textContent, m = t.match(/^(\D{0,2}?)(\d+(?:[.,]\d+)?)(.*)$/s);
  if (!m || RM()) return;
  const dec = (m[2].split(/[.,]/)[1] || "").length, sep = m[2].includes(",") ? "," : ".", end = parseFloat(m[2].replace(",", "."));
  if (!isFinite(end) || end === 0) return;

  requestAnimationFrame(step);
