<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle Coach">
<link rel="manifest" href="/m/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Jungle Coach</title>
<style>
  :root { --bg:#070a12; --card:#111726; --card2:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --txt:#eef2ff; --sec:#8b93a7;
    --acc:#2dd4bf; --grad:linear-gradient(135deg,#34d399 0%,#22d3ee 45%,#818cf8 100%); --green:#34d399; --red:#fb7185; --orange:#fbbf24; --gold:#f5c451; --purple:#c084fc;
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:radial-gradient(600px 400px at 90% -10%, rgba(45,212,191,.16), transparent 60%), radial-gradient(500px 400px at -10% 100%, rgba(129,140,248,.12), transparent 60%); }
  #app { padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px); max-width:560px; margin:0 auto; }
  h1 { font-size:30px; letter-spacing:-.7px; margin:6px 0 4px; font-weight:800; }
  .sub { color:var(--sec); margin:0 0 16px; font-size:14px; }
  .g { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; letter-spacing:-.2px; }
  .muted { color:var(--sec); } .small { font-size:12.5px; } .green { color:var(--green); } .red { color:var(--red); }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:16px; padding:15px; font:inherit; font-weight:800; font-size:16px; color:#061018; background:var(--grad); }
  .btn.sec { background:var(--card); color:var(--txt); border:1px solid var(--line); }
  .btn:active { transform:scale(.98); }
  input, select { width:100%; font:inherit; color:var(--txt); background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; }
  input:focus { border-color:rgba(45,212,191,.6); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--sec); margin:12px 0 6px; }
  .tabs { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-around; padding:8px 8px calc(var(--safe-b) + 8px);
    background:rgba(9,12,20,.82); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--line); z-index:20; }
  .tabs button { flex:1; border:0; background:none; color:#6b7590; font:inherit; font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; }
  .tabs button.on { color:var(--acc); }
  .hero { position:relative; overflow:hidden; border-radius:26px; padding:18px; margin-bottom:14px; border:1px solid var(--line); background:#0d1322; min-height:200px; }
  .hero .art { position:absolute; inset:0; background-size:cover; background-position:65% 20%; }
  .hero .art::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,#0b101d 8%,rgba(11,16,29,.55) 60%,rgba(11,16,29,.2)); }
  .hero .in { position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:164px; }
  .tag { display:inline-flex; align-self:flex-start; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--acc); background:rgba(45,212,191,.14); border:1px solid rgba(45,212,191,.3); padding:4px 9px; border-radius:99px; }
  .hero h2 { font-size:30px; margin:8px 0 2px; letter-spacing:-.8px; line-height:1.1; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; letter-spacing:-.4px; } .stat span { font-size:11.5px; color:var(--sec); }
  .bubble { flex:1; background:rgba(5,8,15,.55); border:1px solid var(--line); border-radius:18px 18px 18px 4px; padding:12px 14px; font-size:14px; }
  .bubble b { display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); margin-bottom:3px; }
  .moosi-card { display:flex; gap:10px; align-items:flex-end; background:linear-gradient(160deg,rgba(45,212,191,.16),rgba(129,140,248,.08)); border-color:rgba(45,212,191,.3); }
  .moosi { flex:none; animation:bob 3.2s ease-in-out infinite; transform-origin:50% 100%; filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  @keyframes bob { 50% { transform:translateY(-3px) scale(1.02,.98); } }
  .game { display:flex; gap:12px; align-items:center; padding:12px; border-radius:18px; background:var(--card); border:1px solid var(--line); margin-bottom:10px; position:relative; overflow:hidden; }
  .game::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); }
  .game.win::before { background:var(--green); }
  .game img.c { width:48px; height:48px; border-radius:14px; flex:none; }
  .game .k { font-weight:800; font-size:16px; } .game .meta { font-size:12px; color:var(--sec); }
  .items { display:flex; gap:3px; margin-top:6px; } .items img, .items i { width:22px; height:22px; border-radius:6px; background:var(--card2); display:block; }
  .res { margin-left:auto; text-align:right; font-size:12px; font-weight:800; white-space:nowrap; }
  .dots { display:flex; gap:5px; } .dots i { width:14px; height:14px; border-radius:5px; background:var(--red); } .dots i.w { background:var(--green); }
  .fr { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .fr:last-child { border:0; } .fr img { width:44px; height:44px; border-radius:13px; } .fr b { display:block; }
  .chev { margin-left:auto; color:#4b5563; font-size:20px; }
  .sheet { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; animation:fade .2s; }
  .sheet .in { width:100%; max-height:88vh; overflow:auto; background:#0c111d; border-radius:26px 26px 0 0; border-top:1px solid var(--line); padding:10px 16px calc(var(--safe-b) + 24px); animation:up .28s cubic-bezier(.2,.8,.2,1); }
  .grip { width:40px; height:5px; border-radius:9px; background:#2b3550; margin:4px auto 12px; }
  .sheet { cursor:pointer; } .sheet .in { cursor:auto; position:relative; transition:transform .2s; }
  .xbtn { position:sticky; top:0; float:right; z-index:2; width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:var(--txt);
    font:700 17px/34px -apple-system, system-ui, sans-serif; text-align:center; padding:0; margin:-2px -4px 0 0; cursor:pointer; }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } } @keyframes fade { from { opacity:0; } }
  .team { margin:8px 0 14px; } .pl { display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .pl img { width:30px; height:30px; border-radius:9px; } .pl.me { background:rgba(45,212,191,.08); border-radius:10px; padding:7px 6px; }
  .bar { height:5px; border-radius:9px; background:var(--card2); overflow:hidden; margin-top:3px; } .bar i { display:block; height:100%; background:var(--orange); border-radius:9px; }
  .skel { height:70px; border-radius:18px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04)); background-size:200% 100%; animation:sh 1.2s linear infinite; margin-bottom:10px; }
  @keyframes sh { to { background-position:-200% 0; } }
  .tierc { font-weight:900; } .GOLD { color:var(--gold); } .PLATINUM { color:#5eead4; } .EMERALD { color:var(--green); } .DIAMOND { color:#93c5fd; } .SILVER { color:#cbd5e1; } .IRON, .BRONZE { color:#c08a5b; } .MASTER, .GRANDMASTER, .CHALLENGER { color:var(--purple); }
  .focus { padding:12px 14px; border-radius:16px; background:linear-gradient(160deg,rgba(45,212,191,.10),rgba(129,140,248,.05)); border:1px solid rgba(45,212,191,.22); margin-bottom:10px; }
  .focus .k { font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--acc); } .focus b { display:block; font-size:16px; margin:2px 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" style="display:none"></nav>
<script>
function moosi(mood = "happy", size = 96) {
  const id = "m" + Math.random().toString(36).slice(2, 7);
  const brow = mood === "worried" ? '<path d="M38 41l12 3M82 41l-12 3" stroke="#0b3b36" stroke-width="3" stroke-linecap="round"/>'
    : mood === "proud" ? '<path d="M38 42q6-5 12-1M70 41q6-4 12 1" stroke="#0b3b36" stroke-width="3" fill="none" stroke-linecap="round"/>' : "";
  const mouth = mood === "worried" ? '<path d="M50 80q10-7 20 0" stroke="#0b3b36" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M92 40q4 7 0 10q-4-3 0-10z" fill="#7dd3fc"/>'
    : mood === "sleepy" ? '<ellipse cx="60" cy="79" rx="5" ry="4" fill="#0b3b36"/>'
    : '<path d="M46 74q14 14 28 0" stroke="#0b3b36" stroke-width="3.5" fill="#0b3b36" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 75l4 6 4-6z" fill="#fff"/>';
  const eyes = mood === "sleepy" ? '<path d="M38 56q7 5 14 0M68 56q7 5 14 0" stroke="#0b3b36" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    : `<ellipse cx="45" cy="56" rx="9" ry="10" fill="#fff"/><ellipse cx="75" cy="56" rx="9" ry="10" fill="#fff"/>
       <circle cx="47" cy="58" r="5" fill="#0b1220"/><circle cx="77" cy="58" r="5" fill="#0b1220"/><circle cx="49" cy="55.5" r="1.8" fill="#fff"/><circle cx="79" cy="55.5" r="1.8" fill="#fff"/>`;
  return `<svg class="moosi" width="${size}" height="${size}" viewBox="0 0 120 120" aria-label="Moosi">
    <defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
      <linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs>
    <path d="M30 44C14 40 6 26 8 12c14 2 26 12 28 26z" fill="url(#${id}l)"/><path d="M12 15c8 6 14 14 19 24" stroke="#14532d" stroke-width="1.6" opacity=".5" fill="none"/>
    <path d="M90 44c16-4 24-18 22-32-14 2-26 12-28 26z" fill="url(#${id}l)"/><path d="M108 15c-8 6-14 14-19 24" stroke="#14532d" stroke-width="1.6" opacity=".5" fill="none"/>
    <path d="M60 26c0-8 2-13 6-17" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M66 10c6-4 12-3 15 0-5 5-11 5-15 0z" fill="#4ade80"/>
    <path d="M60 24c24 0 40 18 40 44 0 26-17 40-40 40S20 94 20 68c0-26 16-44 40-44z" fill="url(#${id}b)"/>
    <ellipse cx="60" cy="86" rx="22" ry="16" fill="#99f6e4" opacity=".55"/>
    <path d="M30 50c3-6 8-10 13-12M88 50c-2-5-6-9-11-11" stroke="#ccfbf1" stroke-width="2.5" opacity=".55" fill="none" stroke-linecap="round"/>
    ${eyes}${brow}<ellipse cx="33" cy="70" rx="6" ry="3.5" fill="#fb7185" opacity=".45"/><ellipse cx="87" cy="70" rx="6" ry="3.5" fill="#fb7185" opacity=".45"/>${mouth}
    <ellipse cx="44" cy="108" rx="10" ry="5" fill="#0f766e"/><ellipse cx="76" cy="108" rx="10" ry="5" fill="#0f766e"/></svg>`;
}
// Jungle Coach mobile: own stats, past games, friends and the coach summary from the PC app.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LS = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
const PLATFORMS = {euw1: "EUW", eun1: "EUNE", tr1: "TR", ru: "RU", me1: "ME", na1: "NA", br1: "BR", la1: "LAN", la2: "LAS", kr: "KR", jp1: "JP", oc1: "OCE", sg2: "SG", tw2: "TW", vn2: "VN"};
const REGION = p => ["na1", "br1", "la1", "la2"].includes(p) ? "americas" : ["kr", "jp1"].includes(p) ? "asia" : ["oc1", "sg2", "tw2", "vn2"].includes(p) ? "sea" : "europe";
const ACC_REGION = p => REGION(p) === "sea" ? "asia" : REGION(p);
let S = {tab: "home", me: null, ver: "16.23.1", acct: null, league: null, games: null, gamesMore: 10, coach: null, friends: null, fdata: {}, sheet: null, err: "", busy: false};
const platform = () => LS.get("jc_platform") || "euw1";

// ---- token (from the login redirect, or injected by the iOS app)
(function () {
  const u = new URL(location.href), t = u.searchParams.get("token");
  if (t) { LS.set("jc_token", t); u.searchParams.delete("token"); history.replaceState(null, "", u.pathname); }
})();
window.jcSetToken = t => { LS.set("jc_token", t); boot(); };
const token = () => LS.get("jc_token");
async function api(path, opt = {}) {
  const r = await fetch(path, {...opt, headers: {...(opt.headers || {}), Authorization: "Bearer " + token(), "Content-Type": "application/json"}});
  if (r.status === 401) { LS.set("jc_token", null); render(); throw new Error("Bitte neu anmelden."); }
  if (r.status === 429) throw new Error("Riot-Limit erreicht – kurz warten und neu laden.");
  if (!r.ok) throw new Error(r.status === 404 ? "nicht gefunden" : "Fehler " + r.status);
  return r.json();
}
const riot = (host, path) => api(`/riot/${host}${path}`);
function login(p) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcLogin) return window.webkit.messageHandlers.jcLogin.postMessage(p);
  location.href = `/auth/${p}?redirect=${encodeURIComponent(location.origin + "/m/")}`;
}
function logout() { LS.set("jc_token", null); S = {...S, me: null, acct: null, league: null, games: null, coach: null, friends: null}; render(); }

// ---- data
const DD = () => `https://ddragon.leagueoflegends.com/cdn/${S.ver}`;
const cImg = (c, cls = "c") => `<img class="${cls}" src="${DD()}/img/champion/${encodeURIComponent(c)}.png" loading="lazy" onerror="this.style.visibility='hidden'">`;
const iImg = i => i ? `<img src="${DD()}/img/item/${i}.png" loading="lazy">` : "<i></i>";
const splash = c => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${encodeURIComponent(c)}_0.jpg`;
const rankTxt = r => r ? `<span class="tierc ${r.tier}">${r.tier[0] + r.tier.slice(1).toLowerCase()} ${["MASTER", "GRANDMASTER", "CHALLENGER"].includes(r.tier) ? "" : r.rank}</span> · ${r.leaguePoints} LP` : '<span class="muted">Unranked</span>';
const solo = l => (l || []).find(e => e.queueType === "RANKED_SOLO_5x5") || (l || []).find(e => e.queueType === "RANKED_FLEX_SR");
const MATCH = {}, MP = {};
async function match(id) {
  if (!MP[id]) MP[id] = riot(REGION(platform()), `/lol/match/v5/matches/${id}`).then(m => (MATCH[id] = m));
  return MP[id];
}
async function account(rid) {
  const [n, t] = rid.split("#");
  return riot(ACC_REGION(platform()), `/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(n)}/${encodeURIComponent(t)}`);
}
async function loadGames(puuid, count) {
  const ids = await riot(REGION(platform()), `/lol/match/v5/matches/by-puuid/${puuid}/ids?count=${count}`);
  const out = [];
  for (let i = 0; i < ids.length; i += 4) out.push(...await Promise.all(ids.slice(i, i + 4).map(id => match(id).catch(() => null))));
  return out.filter(Boolean).map(m => ({m, p: m.info.participants.find(x => x.puuid === puuid)})).filter(g => g.p);
}
async function boot() {
  render();
  if (!token()) return;
  try {
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(v => { S.ver = v[0]; render(); }).catch(() => {});
    S.me = await api("/api/me"); render();
    api("/api/sync/coach").then(c => { S.coach = c.coach; render(); }).catch(() => {});
    api("/api/sync/friends").then(f => { S.friends = f.friends || []; render(); }).catch(() => { S.friends = []; });
    if (S.me.riot_id && S.me.riot_id.includes("#")) await loadMe();
  } catch (e) { S.err = e.message; render(); }
}
async function loadMe() {
  try {
    S.acct = await account(S.me.riot_id);
    riot(platform(), `/lol/league/v4/entries/by-puuid/${S.acct.puuid}`).then(l => { S.league = l; render(); }).catch(() => {});
    S.games = await loadGames(S.acct.puuid, S.gamesMore); S.err = ""; render();
  } catch (e) { S.err = e.message; render(); }
}
async function loadFriend(rid) {
  const f = S.fdata[rid] = S.fdata[rid] || {};
  try {
    f.acct = f.acct || await account(rid);
    f.league = f.league || await riot(platform(), `/lol/league/v4/entries/by-puuid/${f.acct.puuid}`);
    render();
    f.games = f.games || await loadGames(f.acct.puuid, 6);
  } catch (e) { f.err = e.message; }
  render();
}
async function saveFriends(list) {
  S.friends = (await api("/api/sync/friends", {method: "PUT", body: JSON.stringify({friends: list})})).friends; render();
}

// ---- views
function gameRow(g, onclick) {
  const p = g.p, m = g.m.info, min = Math.max(1, m.gameDuration / 60), cs = p.totalMinionsKilled + p.neutralMinionsKilled;
  const ago = Math.round((Date.now() - (m.gameEndTimestamp || m.gameCreation)) / 36e5);
  return `<div class="game ${p.win ? "win" : ""}" onclick="${onclick}">${cImg(p.championName)}
    <div style="min-width:0"><div class="k">${p.kills}/${p.deaths}/${p.assists} <span class="muted small" style="font-weight:600">${p.championName}</span></div>
      <div class="meta">${QUEUE[m.queueId] || "Spiel"} · ${Math.round(min)} min · ${(cs / min).toFixed(1)} CS/min</div>
      <div class="items">${[0, 1, 2, 3, 4, 5].map(i => iImg(p["item" + i])).join("")}</div></div>
    <div class="res"><span class="${p.win ? "green" : "red"}">${p.win ? "Sieg" : "Niederlage"}</span><div class="muted" style="font-weight:600">${ago < 24 ? ago + " h" : Math.round(ago / 24) + " T"}</div></div></div>`;
}
const QUEUE = {420: "Solo/Duo", 440: "Flex", 400: "Normal", 430: "Normal", 450: "ARAM", 490: "Quickplay", 1700: "Arena", 1900: "URF"};
function openMatch(id, puuid) { S.sheet = {id, puuid}; render(); history.pushState({sheet: 1}, ""); }
function closeSheet(fromBack) { if (!S.sheet) return; S.sheet = null; render(); if (!fromBack && history.state && history.state.sheet) history.back(); }
addEventListener("popstate", () => closeSheet(true));   // iOS back swipe / Android back closes the sheet
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
// swipe the sheet down to close it (like iOS sheets)
let sy0 = null;
addEventListener("touchstart", e => { const el = document.getElementById("sheet-in"); sy0 = el && el.contains(e.target) && el.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
addEventListener("touchmove", e => { const el = document.getElementById("sheet-in"); if (sy0 == null || !el) return; const dy = e.touches[0].clientY - sy0; if (dy > 0) el.style.transform = `translateY(${dy}px)`; }, {passive: true});
addEventListener("touchend", e => { const el = document.getElementById("sheet-in"); if (sy0 == null || !el) return; const dy = e.changedTouches[0].clientY - sy0; sy0 = null;
  if (dy > 90) closeSheet(); else el.style.transform = ""; });
function matchSheet() {
  const m = MATCH[S.sheet.id]; if (!m || !m.info) return "";
  const info = m.info, max = Math.max(...info.participants.map(p => p.totalDamageDealtToChampions));
  const team = tid => info.participants.filter(p => p.teamId === tid).map(p => `<div class="pl ${p.puuid === S.sheet.puuid ? "me" : ""}">${cImg(p.championName, "")}
      <div style="flex:1;min-width:0"><b style="font-size:13px">${esc(p.riotIdGameName || p.summonerName || "")}</b> <span class="muted">${p.kills}/${p.deaths}/${p.assists}</span>
      <div class="bar"><i style="width:${100 * p.totalDamageDealtToChampions / max}%"></i></div></div>
      <div class="items" style="margin:0">${[0, 1, 2, 3, 4, 5].map(i => iImg(p["item" + i])).join("")}</div></div>`).join("");
  const win = info.teams.find(t => t.win);
  return `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheet-in"><button class="xbtn" onclick="closeSheet()" aria-label="Schließen">✕</button><div class="grip" onclick="closeSheet()"></div>
    <h3 style="margin:0 0 2px">${QUEUE[info.queueId] || "Spiel"} · ${Math.round(info.gameDuration / 60)} min</h3>
    <p class="muted small" style="margin:0 0 6px">${new Date(info.gameEndTimestamp || info.gameCreation).toLocaleString("de-DE")} · Balken = Schaden an Champions</p>
    <div class="team"><b class="${win && win.teamId === 100 ? "green" : "red"}">Blaues Team ${win && win.teamId === 100 ? "· Sieg" : ""}</b>${team(100)}</div>
    <div class="team"><b class="${win && win.teamId === 200 ? "green" : "red"}">Rotes Team ${win && win.teamId === 200 ? "· Sieg" : ""}</b>${team(200)}</div>
    <p class="muted small">Clips und Detail-Analyse (Tode, Ganks, Objectives) findest du in der PC-App unter „Analyse & Clips“.</p></div></div>`;
}
function vHome() {
  const c = S.coach, r = solo(S.league), gs = S.games || [];
  const wins = gs.filter(g => g.p.win).length, counts = {};
  gs.forEach(g => counts[g.p.championName] = (counts[g.p.championName] || 0) + 1);
  const main = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const task = c && c.session_task;
  let h = `<div class="hero"><div class="art" style="background-image:url('${main ? splash(main) : ""}')"></div><div class="in">
    <span class="tag">${c && c.player_type ? "✦ " + esc(c.player_type.name) : "Dein Profil"}</span>
    <h2>${esc((S.me.riot_id || S.me.name || "").split("#")[0])}</h2><div>${S.league ? rankTxt(r) + (r ? ` · ${Math.round(100 * r.wins / Math.max(1, r.wins + r.losses))}% WR` : "") : '<span class="muted">Lade Rang …</span>'}</div></div></div>`;
  h += `<div class="card moosi-card">${moosi(c && c.score >= 60 ? "proud" : "happy", 84)}<div class="bubble"><b>${task ? "Deine Aufgabe" : "Moosi"}</b>${task ? esc(task.title + ": " + task.drill)
    : c ? esc(c.player_type ? c.player_type.text : "") : "Öffne die PC-App einmal mit deinem Konto – dann zeige ich dir hier deine Coaching-Aufgabe."}</div></div>`;
  if (gs.length) h += `<div class="card"><h3>Letzte ${gs.length} Games</h3><div class="stats"><div class="stat"><b class="${wins / gs.length >= .5 ? "green" : "red"}">${Math.round(100 * wins / gs.length)}%</b><span>Winrate</span></div>
      <div class="stat"><b>${(gs.reduce((a, g) => a + g.p.kills + g.p.assists, 0) / Math.max(1, gs.reduce((a, g) => a + g.p.deaths, 0))).toFixed(2)}</b><span>KDA</span></div>
      <div class="stat"><b>${c && c.score != null ? c.score : "–"}</b><span>Coach-Score</span></div></div>
      <div class="dots" style="margin-top:12px">${gs.slice().reverse().map(g => `<i class="${g.p.win ? "w" : ""}"></i>`).join("")}</div></div>`;
  if (c && (c.focus || []).length) h += `<div class="card"><h3>Deine Schwerpunkte</h3>${c.focus.slice(0, 3).map((f, i) => `<div class="focus"><div class="k">Schwerpunkt ${i + 1}</div><b>${esc(f.title)}</b><div class="small muted">🎯 ${esc(f.drill)}</div>${f.last10 ? `<div class="small" style="margin-top:4px">Im Ziel: <b style="display:inline">${esc(f.last10)}</b></div>` : ""}</div>`).join("")}
      ${c.confidence ? `<p class="muted small" style="margin:4px 0 0">⚖️ ${esc(c.confidence)}</p>` : ""}</div>`;
  if (!S.me.riot_id) h += setupCard();
  return h;
}
function vGames() {
  if (!S.me.riot_id) return `<h1>Games</h1>${setupCard()}`;
  const gs = S.games;
  return `<h1>Deine <span class="g">Games</span></h1><p class="sub">Alle Queues · tippe für Details</p>${S.err ? `<div class="card red">${esc(S.err)}</div>` : ""}
    ${gs ? gs.map(g => gameRow(g, `openMatch('${g.m.metadata.matchId}','${g.p.puuid}')`)).join("") + `<button class="btn sec" onclick="S.gamesMore+=10;S.games=null;render();loadMe()">Mehr laden</button>`
      : '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'}`;
}
function vFriends() {
  if (S.view && S.view.friend) return vFriend(S.view.friend);
  const fl = S.friends;
  return `<h1>Deine <span class="g">Freunde</span></h1><p class="sub">Dieselbe Liste wie in der PC-App</p>
    <div class="card"><div style="display:flex;gap:8px"><input id="fadd" placeholder="Name#TAG"><button class="btn" style="width:auto;padding:0 18px" onclick="addF()">+</button></div></div>
    <div class="card">${fl == null ? '<div class="skel" style="height:44px"></div>' : fl.length ? fl.map(rid => { const d = S.fdata[rid] || {}; const r = solo(d.league);
      if (!d.league && !d.err && !d.loading) { d.loading = true; S.fdata[rid] = d; loadFriend(rid); }
      return `<div class="fr" onclick='S.view={friend:${JSON.stringify(rid)}};render()'>${d.games && d.games[0] ? cImg(d.games[0].p.championName, "") : `<img src="/icon.png">`}
        <div><b>${esc(rid.split("#")[0])}</b><span class="small muted">${d.err ? esc(d.err) : d.league ? rankTxt(r) : "lädt …"}</span></div><span class="chev">›</span></div>`; }).join("")
      : '<p class="muted small" style="margin:0">Noch keine Freunde – füge oben eine Riot ID hinzu.</p>'}</div>`;
}
function vFriend(rid) {
  const d = S.fdata[rid] || {}, r = solo(d.league);
  if (!d.games && !d.loading) { d.loading = true; S.fdata[rid] = d; loadFriend(rid); }
  return `<button class="btn sec" style="width:auto;padding:10px 16px;margin-bottom:12px" onclick="S.view=null;render()">‹ Freunde</button>
    <div class="hero"><div class="art" style="background-image:url('${d.games && d.games[0] ? splash(d.games[0].p.championName) : ""}')"></div><div class="in">
      <span class="tag">Freund</span><h2>${esc(rid.split("#")[0])}</h2><div>${d.league ? rankTxt(r) : "…"}</div></div></div>
    ${d.games ? d.games.map(g => gameRow(g, `openMatch('${g.m.metadata.matchId}','${g.p.puuid}')`)).join("") : '<div class="skel"></div><div class="skel"></div>'}
    <button class="btn sec" style="margin-top:6px" onclick='if(confirm("Freund entfernen?")){saveFriends(S.friends.filter(f=>f!==${JSON.stringify(rid)}));S.view=null}'>Entfernen</button>
    <p class="muted small">Die ausführliche Coach-Analyse für Freunde startest du in der PC-App unter „Freunde“.</p>`;
}
function addF() { const v = $("#fadd").value.trim(); if (!/^[^#]{1,24}#[^#]{1,8}$/.test(v)) return alert("Riot ID im Format Name#TAG"); saveFriends([...(S.friends || []), v]); }
function setupCard() {
  return `<div class="card"><h3>Riot ID verbinden</h3><p class="muted small" style="margin:0">Damit ich deine Games laden kann.</p>
    <label>Riot ID</label><input id="rid" placeholder="Name#TAG" value="${esc(S.me.riot_id || "")}">
    <label>Region</label><select id="plat">${Object.entries(PLATFORMS).map(([k, v]) => `<option value="${k}" ${k === platform() ? "selected" : ""}>${v}</option>`).join("")}</select>
    <button class="btn" style="margin-top:14px" onclick="saveRid()">Speichern</button></div>`;
}
async function saveRid() {
  const v = $("#rid").value.trim(); LS.set("jc_platform", $("#plat").value);
  if (!/^[^#]{1,24}#[^#]{1,8}$/.test(v)) return alert("Riot ID im Format Name#TAG");
  await api("/api/me", {method: "PUT", body: JSON.stringify({riot_id: v})});
  S.me.riot_id = v; S.games = null; S.league = null; render(); loadMe();
}
function vMore() {
  return `<h1>Mehr</h1><div class="card"><div class="row"><span>Angemeldet als</span><b style="margin-left:auto">${esc(S.me.name || "")}</b></div>
    <div class="row"><span>Riot ID</span><b style="margin-left:auto">${esc(S.me.riot_id || "–")}</b></div><div class="row"><span>Region</span><b style="margin-left:auto">${PLATFORMS[platform()]}</b></div></div>
    ${setupCard()}<button class="btn sec" onclick="logout()">Abmelden</button>
    <p class="muted small" style="text-align:center;margin-top:18px"><a style="color:var(--sec)" href="/datenschutz.html">Datenschutz</a> · <a style="color:var(--sec)" href="/impressum.html">Impressum</a><br>Jungle Coach ist nicht mit Riot Games verbunden.</p>`;
}
function vLogin() {
  return `<div style="min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px">
    ${moosi("happy", 150)}<h1 style="margin-top:10px">Jungle <span class="g">Coach</span></h1>
    <p class="sub" style="max-width:300px">Deine Stats, vergangenen Games, Freunde und Moosis Coaching – auch unterwegs.</p>
    <div style="width:100%;max-width:340px;display:grid;gap:10px;margin-top:10px"><button class="btn" onclick="login('google')">Mit Google anmelden</button>
    <button class="btn sec" onclick="login('discord')">Mit Discord anmelden</button></div>
    <p class="muted small" style="margin-top:16px">Gleiches Konto wie in der PC-App.</p></div>`;
}
const TAB_IC = {home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', games: '<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 11v3M6 12.5h3"/><circle cx="15.5" cy="11.5" r=".9"/><circle cx="17.5" cy="13.7" r=".9"/>',
  friends: '<circle cx="9" cy="8.5" r="3.4"/><path d="M2.8 19.5c1-3.2 3.5-4.8 6.2-4.8s5.2 1.6 6.2 4.8"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6M17.6 14.9c1.8.6 3 2.1 3.6 4.6"/>', more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'};
function render() {
  const app = $("#app"), tabs = $("#tabs");
  if (!token()) { tabs.style.display = "none"; app.innerHTML = vLogin(); return; }
  if (!S.me) { tabs.style.display = "none"; app.innerHTML = `<div style="height:60vh;display:grid;place-items:center">${moosi("sleepy", 110)}</div>${S.err ? `<p class="red" style="text-align:center">${esc(S.err)}</p>` : ""}`; return; }
  tabs.style.display = "flex";
  tabs.innerHTML = [["home", "Home"], ["games", "Games"], ["friends", "Freunde"], ["more", "Mehr"]].map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';S.view=null;render();scrollTo(0,0)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TAB_IC[k]}</svg>${l}</button>`).join("");
  app.innerHTML = ({home: vHome, games: vGames, friends: vFriends, more: vMore}[S.tab])() + (S.sheet ? matchSheet() : "");
}
boot();
if ("serviceWorker" in navigator && !(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jcLogin)) navigator.serviceWorker.register("/m/sw.js").catch(() => {});
</script>
</body>
