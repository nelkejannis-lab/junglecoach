<style>
  :root { --bg:#070a12; --card:#111726; --card2:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --txt:#eef2ff; --sec:#8b93a7;

  .tb.win { border-color:rgba(52,211,153,.22); } .tb.loss { border-color:rgba(251,113,133,.18); }

  /* ---------- motion: short and springy; calm with "reduce motion" ---------- */
  @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.985); } }
  @keyframes grow { from { transform:scaleX(0); } }
  @keyframes ringIn { from { stroke-dashoffset:var(--c); } }
  @keyframes pageR { from { opacity:.0; transform:translateX(22px); } } @keyframes pageL { from { opacity:0; transform:translateX(-22px); } }
  @keyframes popIn { 0% { transform:scale(.6); opacity:0; } 60% { transform:scale(1.15); } }
  @keyframes sheetUp { from { transform:translateY(60px); opacity:.2; } 70% { transform:translateY(-4px); } }
  @keyframes modalIn { from { transform:translateY(24px) scale(.96); opacity:0; } 70% { transform:translateY(-2px) scale(1.005); } }
  @keyframes sheetDown { to { transform:translateY(80px); opacity:0; } } @keyframes fadeOut { to { opacity:0; } }
  .sheet .in { animation:none; }
  .ani { animation:rise .5s cubic-bezier(.2,.9,.25,1.15) both; animation-delay:calc(var(--i, 0) * 42ms); }
  .ani .dmg i, .ani .bar i, .ani .meter i, .ani.dmg i, .ani .vsb i, .ani .mbar i { animation:grow .8s cubic-bezier(.2,.8,.2,1) both; transform-origin:left; animation-delay:calc(var(--i, 0) * 42ms + 160ms); }
  .ani .pr, .ani.ring .pr { animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay:.2s; }
  .ani .dots i { animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both; }
  .ani .dots i:nth-child(2) { animation-delay:.03s } .ani .dots i:nth-child(3) { animation-delay:.06s } .ani .dots i:nth-child(4) { animation-delay:.09s } .ani .dots i:nth-child(5) { animation-delay:.12s }
  .ani .dots i:nth-child(6) { animation-delay:.15s } .ani .dots i:nth-child(7) { animation-delay:.18s } .ani .dots i:nth-child(8) { animation-delay:.21s } .ani .dots i:nth-child(9) { animation-delay:.24s } .ani .dots i:nth-child(10) { animation-delay:.27s }
  #app.pgR { animation:pageR .34s cubic-bezier(.2,.9,.3,1.1); } #app.pgL { animation:pageL .34s cubic-bezier(.2,.9,.3,1.1); }
  .sheet.opening { animation:fade .2s; } .sheet.opening .in { animation:sheetUp .42s cubic-bezier(.2,1,.3,1); }
  @media (min-width: 900px) { .sheet.opening .in.mx { animation:modalIn .4s cubic-bezier(.2,1,.3,1); } }
  .sheet.closing { animation:fadeOut .2s forwards; } .sheet.closing .in { animation:sheetDown .2s ease-in forwards; }
  .btn, .game, .lb, .sr, .fr, .rk, .stat, .seg button, .tabs button, .xbtn, .chk { transition:transform .22s cubic-bezier(.3,1.6,.5,1), background-color .2s, opacity .2s; }
  .btn:active, .game:active, .lb:active, .sr:active, .fr:active, .rk:active, .seg button:active, .xbtn:active { transform:scale(.97); }
  .tabs button:active { transform:scale(.9); } .tabs button.on svg { animation:popIn .4s cubic-bezier(.3,1.6,.5,1); }
  @media (hover:hover) { .game:hover, .lb:hover, .sr:hover { background-color:rgba(255,255,255,.035); } .game:hover { transform:translateY(-1px); } }
  /* check-off reward */
  .chk { flex:none; width:40px; height:40px; border-radius:50%; border:2px solid rgba(45,212,191,.5); background:rgba(45,212,191,.06); padding:0; cursor:pointer; position:relative; }
  .chk svg { width:100%; height:100%; } .chk path { fill:none; stroke:#061018; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24; stroke-dashoffset:24; }
  .chk.done { background:var(--acc); border-color:var(--acc); } .chk.done path { stroke-dashoffset:0; }
  .chk.pop { animation:popIn .45s cubic-bezier(.3,1.6,.5,1); } .chk.pop path { transition:stroke-dashoffset .35s .1s cubic-bezier(.6,0,.2,1); }
  .tt { display:inline; -webkit-box-decoration-break:clone; box-decoration-break:clone; background:linear-gradient(currentColor,currentColor) no-repeat 0 58% / 0 1.6px; transition:background-size .45s cubic-bezier(.6,0,.2,1), opacity .4s; }
  .tt.done { background-size:100% 1.6px; opacity:.55; }
  .spark { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; pointer-events:none; background:var(--c, #2dd4bf);
    animation:spark .7s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes spark { to { transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .chk path { stroke-dashoffset:0 !important; } .chk:not(.done) path { stroke-dashoffset:24 !important; }
  }
  #rail { display:none; }

const pick = (ids, puuid) => ids.map(id => MATCH[id]).filter(Boolean).map(m => ({m, p: m.info.participants.find(x => x.puuid === puuid)})).filter(g => g.p)
  .sort((a, b) => (b.m.info.gameCreation || 0) - (a.m.info.gameCreation || 0));
async function hydrate() {

  if (!sn || !sn.me) return false;
  Object.assign(S, {me: sn.me, acct: sn.acct, league: sn.league, coach: sn.coach, prof: sn.prof, friends: sn.friends, pub: sn.pub || {}, at: sn.at || 0});
  const all = [...(sn.ids || []), ...Object.values(sn.fd || {}).flatMap(d => d.ids || [])];
  await Promise.all(all.map(async id => { if (!MATCH[id]) { const m = await idbGet(id); if (m) MATCH[id] = m; } }));
  if (S.acct && sn.ids && sn.ids.length) S.games = pick(sn.ids, S.acct.puuid);
  for (const [rid, d] of Object.entries(sn.fd || {})) S.fdata[rid] = {acct: d.acct, league: d.league, games: pick(d.ids || [], d.acct.puuid), at: d.at || 0};

// newest first; onPart(list) is called after every batch so the latest games show up right away
async function loadGames(puuid, count, start = 0, onPart) {
  const ids = await riot(REGION(platform()), `/lol/match/v5/matches/by-puuid/${puuid}/ids?start=${start}&count=${count}`, {cache: "no-store"});
  const out = [];
  const done = () => out.filter(Boolean).map(m => ({m, p: m.info.participants.find(x => x.puuid === puuid)})).filter(g => g.p)
    .sort((a, b) => (b.m.info.gameCreation || 0) - (a.m.info.gameCreation || 0));
  for (let i = 0; i < ids.length; i += 4) {
    out.push(...await Promise.all(ids.slice(i, i + 4).map(id => match(id).catch(() => null))));
    if (onPart) onPart(done());
  }
  return done();
}

const FQ = []; let fqBusy = false;
function queueFriend(rid, force, first) {

    const ids = await riot(REGION(platform()), `/lol/match/v5/matches/by-puuid/${f.acct.puuid}/ids?start=0&count=10`, {cache: "no-store"});
    const have = new Set((f.games || []).map(g => g.m.metadata.matchId));
    if (!f.games || ids.some(id => !have.has(id))) {
      for (const id of ids) { try { await match(id); } catch (e) {} }
      const keep = (f.games || []).map(g => g.m.metadata.matchId).filter(id => !ids.includes(id));

async function uploadPic(input) {
  const f = input.files && input.files[0]; if (!f) return;
  toast("Lade hoch …");
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const sz = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement("canvas");
    cv.width = cv.height = 256;
    cv.getContext("2d").drawImage(img, (img.naturalWidth - sz) / 2, (img.naturalHeight - sz) / 2, sz, sz, 0, 0, 256, 256);
    let q = 0.85, data = cv.toDataURL("image/jpeg", q);
    while (data.length > 100000 && q > 0.4) { q -= 0.1; data = cv.toDataURL("image/jpeg", q); }
    const r = await api("/api/sync/avatar", {method: "PUT", body: JSON.stringify({data})});
    PE.avatar = r.avatar;
    const keepName = $("#pe_name").value, keepBio = $("#pe_bio").value;
    render(); $("#pe_name").value = keepName; $("#pe_bio").value = keepBio;
    toast("Bild hochgeladen – jetzt Profil speichern");
  } catch (e) { toast("Upload fehlgeschlagen: " + e.message); }
}
