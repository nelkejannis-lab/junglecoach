name = "junglecoach"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*", "/riot/*"]

[[d1_databases]]
binding = "DB"
database_name = "junglecoach"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secrets (Cloudflare dashboard -> Worker -> Settings -> Variables and Secrets, type "Secret"):
#   RIOT_API_KEY, JWT_SECRET, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
