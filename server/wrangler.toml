name = "junglecoach"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true   # keep junglecoach.nelkejannis.workers.dev working (old apps, login callbacks)

# Own domain (bought in this Cloudflare account) – Cloudflare creates DNS + certificate on deploy
routes = [
  { pattern = "moosi.app", custom_domain = true },
  { pattern = "www.moosi.app", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*", "/riot/*"]

# push notifications: friend in game (every 5 min) + daily task at 17:00 Berlin
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "junglecoach"
database_id = "63a5fac8-eb9d-47b6-86ef-1b706ed14715"
migrations_dir = "migrations"

# Public OAuth client ids (not secret)
[vars]
DISCORD_CLIENT_ID = "1574356683478671401"
GOOGLE_CLIENT_ID = "171693678354-bd344bgd6pis5dqrdbscboseiap95j7l.apps.googleusercontent.com"

# Secrets (Cloudflare dashboard -> Worker -> Settings -> Variables and Secrets, type "Secret"):
#   RIOT_API_KEY, DISCORD_CLIENT_SECRET, GOOGLE_CLIENT_SECRET  (JWT_SECRET optional, auto-generated)
